  architecture_graph:
    is_version: 15
    rt_chain:
    - csis
    - pdp
    - byrp
    - rgbp
    - yuvsc
    - mlsc
    nrt_chain:
    - mtnr
    - msnr
    - yuvp
    - mcsc
    rt_frame_sync: sensor_v_valid
    nrt_entry: MLSC pyramid WDMA to MTNR RDMA (M2M)
    provenance: kernel IS v15 + user-confirmed topology, 2026-09-13
    assumptions:
    - Pyramid dimensions use ceil(width/2^L), ceil(height/2^L); alignment/crop needs runtime confirmation.
    - Preview is FHD; LMEDS 1008x756, FDPIG RGB 512x288 and CAV RGB 320x180 are fixture assumptions.
    - MCSC channel assignment W0/W1 is logical policy; validate runtime port mapping.
    - History DMA models warmed-up steady state; first-frame initialization is not measured.
    - SW timings are assumed wall time. preME includes LME; CPU active time/power is not known.
    - PDP/BYRP statistic and MV result sizes are uncharacterized; their DMA availability is catalogued but their traffic is
      excluded from bandwidth totals.
    - NRT L0 chroma auxiliary input and MTNR weight/segmentation buffers require runtime format/size confirmation; not included
      in bandwidth totals.
    - CPU_CAMERA serializes CPU-only stages; preME is a composite SW+LME interval with unknown CPU duty.
    - RGBP DRC/HIST/SAT and MLSC SVHIST sizes are unknown; excluded from BW. BYRP Bayer snapshot and CAV are optional disabled
      outputs by default.
    pyramid_base: mlsc_out
    eis_chain: MCSC -> one EIS SW stage -> preview/video GDC instances
