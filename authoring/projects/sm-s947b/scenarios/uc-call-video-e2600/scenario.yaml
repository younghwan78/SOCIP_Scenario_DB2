# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-call-video-e2600
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  canonical_usecase: uc-call-video
  name: Video Call
  purpose: "영상 통화: 전면/후면 Sensor 입력, 인코딩 송신과 디코딩 수신이 동시에 진행되는 조건입니다. VT DVFS 값과 해상도·fps를 대조하고 음성·네트워크·패널 조건의 누락을 확인하세요."
  review_focus:
  - "Sensor 입력 · 인코딩 송신"
  - "디코딩 수신"
  - "VT DVFS ↔ 해상도 · fps"
  category:
  - voice_call
  - video
  domain:
  - voice_call
pipeline:
  nodes:
  - id: sensor_rear
    ip_ref: ip-sensor-rear-s5e9965
    role: sensor
    instance_index: 0
  - id: sensor_front
    ip_ref: ip-sensor-front-s5e9965
    role: sensor
    instance_index: 0
  - id: csis
    ip_ref: ip-csis-s5e9965
    role: csis
    instance_index: 0
  - id: isp
    ip_ref: ip-isp-s5e9965
    role: isp
    instance_index: 0
  - id: mcsc
    ip_ref: ip-mcsc-s5e9965
    role: mcsc
    instance_index: 0
  - id: mfc_enc
    ip_ref: ip-mfc-s5e9965
    role: encoder
    instance_index: 0
  - id: mfc_dec
    ip_ref: ip-mfc-s5e9965
    role: decoder
    instance_index: 0
    load_model:
      ref: codec-throughput-v1
      value_source: assumed
      note: >-
        Fixture assumption (2026-11-14), not a measurement. Per-codec decode throughput (pixels per MFC
        clock) and entropy-decoding cycles per bit; replace with the MFC team's per-codec rates.
      cycles_per_bit: 1.0
      codecs:
        H264_DEC: {ppc: 2.0}
        HEVC_DEC: {ppc: 2.0}
        VP9_DEC: {ppc: 1.0}
        AV1_DEC: {ppc: 1.0}
  - id: network
    ip_ref: ip-cpu-s5e9965
    role: network
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: sensor_rear
    to: csis
    type: OTF
  - from: sensor_front
    to: csis
    type: OTF
  - from: csis
    to: isp
    type: OTF
  - from: isp
    to: mcsc
    type: OTF
  - from: mcsc
    to: mfc_enc
    type: OTF
  - from: mfc_enc
    to: network
    type: M2M
    buffer: LOCAL_ENC_BUF
  - from: network
    to: mfc_dec
    type: M2M
    buffer: REMOTE_ES_BUF
  - from: mfc_dec
    to: dpu
    type: M2M
    buffer: REMOTE_DEC_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    LOCAL_ENC_BUF:
      format: BITSTREAM
      compression: COMP_OFF
    REMOTE_ES_BUF:
      format: BITSTREAM
      compression: COMP_OFF
    REMOTE_DEC_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
variants:
  $include: variants.yaml
