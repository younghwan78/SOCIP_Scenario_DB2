      to: npu
    - from: npu
      to: dpu
    - from: gpu
      to: dpu
  node_configs:
    gpu:
      sim:
        width: 2560
        height: 1440
    dpu:
      sim:
        composer: M2M_SCALER_FALLBACK
        layers:
        - name: m2m_scaled_rendered_frame
          src:
          - 2560
          - 1440
          bpp: 32
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui3
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      bw_kb_s:
        bts_read_vote: 7039899
        surface_traffic: 1390500
    m2m_scaler:
      selected_mode: Normal
      sim:
        $unset:
        - active
        src:
        - 2560
        - 1440
        dst:
        - 1440
        - 3120
        fps: 60
        src_bpp: 12
        dst_bpp: 32
        ppc: 4.89
        ppc_row: YUV420
      required_freq_khz: 55126
      dvfs:
        freq_mif_khz: 0
        freq_int_khz: 133000
        freq_mscl_khz: 88000
      bw_kb_s:
        read: 324000
        write: 1053000
      model_ref: ip-m2m-scaler-s5e9965.capabilities.perf_model / bw_model
    npu:
      sim:
        width: 2560
        height: 1440
  buffer_overrides:
    GPU_M2M_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
- id: game-fhd-60fps-gpu-heavy-overlay
  extends: game-fhd-60fps-sdr
  design_conditions:
    $unset:
    - gpu_governor
    dpu_layer_count: 13
    dpu_composer: GPU_FALLBACK
    note: 게임+시스템UI+인앱브라우저+알림 레이어 합산 >12 → SurfaceFlinger GPU fallback
    design_review: GPU fallback is asserted at 13 layers, but S5E9965 has 16 DPP channels and max_win = 16, so the DPU can
      compose this directly. The real limits are >16 layers, or more than 8 layers needing scale/CSC (only the odd DPPs are
      VG). Confirm the intended trigger and either raise the layer count or state the other reason.
  node_configs:
    gpu:
      sim:
        input_layers: 13
      bw_kb_s:
        composition_write: 1053000
    dpu:
      sim:
        composer: GPU_FALLBACK
        layers:
        - name: gpu_composed
          src:
          - 1440
          - 3120
          dst:
          - 1440
          - 3120
          bpp: 32
          note: single RGBA8888 surface produced by SurfaceFlinger
      bw_kb_s:
        bts_read_vote: 1218444
        surface_traffic: 1053000
