# Compact variants: root entries are complete; `extends: <id>` entries are a
# deep-merge patch over that variant (`$unset: [keys]` removes keys).
# node sim width/height come from sizes.yaml; sw_timing from sw_timing.yaml.
- id: game-fhd-60fps-sdr
  severity: light
  design_conditions:
    resolution: FHD
    target_fps: 60
    hdr: SDR
    gpu_governor: performance
    panel_fps_hz: 60
    npu_used: false
    dpu_layer_count: 5
    dpu_composer: DPU_DIRECT
    panel_resolution: 1440x3120
    source_resolution: 1920x1080
    sw_timing_source: assumed
  routing_switch:
    disabled_nodes:
    - npu
    - m2m_scaler
    disabled_edges:
    - from: gpu
      to: npu
    - from: npu
      to: dpu
    - from: gpu
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    gpu:
      selected_mode: Normal
      sim:
        width: 1920
        height: 1080
        fps: 60
        workload: render
      bw_kb_s:
        note: GPU traffic is not kernel-declared; see ip-gpu bw_model
        composition_write: 0
      model_ref: ip-gpu-s5e9965.capabilities.dvfs_model / power_model
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: DPU_DIRECT
        layers:
        - name: rendered_frame
          src:
          - 1920
          - 1080
          bpp: 32
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui3
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 6498368
        surface_traffic: 1012500
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    m2m_scaler:
      sim:
        active: false
    npu:
      sim:
        active: false
        width: 1920
        height: 1080
        fps: 0
      dvfs: null
      dvfs_note: null
- id: game-fhd-90fps-sdr
  extends: game-fhd-60fps-sdr
  design_conditions:
    $unset:
    - gpu_governor
    target_fps: 90
    panel_fps_hz: 90
  node_configs:
    gpu:
      sim:
        fps: 90
    panel:
      selected_mode: 120hz
      sim:
        refresh_hz: 90
    dpu:
      selected_mode: VRR
      sim:
        refresh_hz: 90
      resol_clk_khz: 456917
      bw_kb_s:
        bts_read_vote: 9747563
        surface_traffic: 1518750
