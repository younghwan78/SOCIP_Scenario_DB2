# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-game-play
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: Game Play
  category:
  - game
  - game
  domain:
  - game
pipeline:
  nodes:
  - id: cpu
    ip_ref: ip-cpu-s5e9965
    role: cpu
    instance_index: 0
  - id: gpu
    ip_ref: ip-gpu-s5e9965
    role: gpu_renderer
    instance_index: 0
  - id: npu
    ip_ref: ip-npu-s5e9965
    role: npu
    instance_index: 0
  - id: m2m_scaler
    ip_ref: ip-m2m-scaler-s5e9965
    role: m2m_scaler
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: cpu
    to: gpu
    type: control
  - from: gpu
    to: dpu
    type: M2M
    buffer: GPU_DPU_BUF
  - from: gpu
    to: npu
    type: M2M
    buffer: GPU_NPU_BUF
  - from: npu
    to: dpu
    type: M2M
    buffer: NPU_DPU_BUF
  - from: gpu
    to: m2m_scaler
    type: M2M
    buffer: GPU_M2M_BUF
  - from: m2m_scaler
    to: dpu
    type: M2M
    buffer: M2M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    GPU_NPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    NPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    GPU_M2M_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
variants:
  $include: variants.yaml
provenance:
  platform_review: S5E9965 platform (non-camera) driver review 2026-09-16
  note: Node ip_refs, per-variant sim shapes, bw_kb_s, dvfs steps and sw_timing are generated by tools/build_platform_fixture.py
    from the S5E9965 DT/drivers. Variant ids and design_conditions are hand-maintained inputs.
