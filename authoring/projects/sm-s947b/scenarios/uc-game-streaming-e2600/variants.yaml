# Compact variants: root entries are complete; `extends: <id>` entries are a
# deep-merge patch over that variant (`$unset: [keys]` removes keys).
# node sim width/height come from sizes.yaml; sw_timing from sw_timing.yaml.
- id: game-stream-fhd60-h264
  severity: medium
  design_conditions:
    codec_mfc: H264_DEC
    resolution: FHD
    fps: 60
    dpu_layer_count: 3
    dpu_composer: DPU_DIRECT
    panel_resolution: 1440x3120
    panel_fps_hz: 60
    source_resolution: 1920x1080
    sw_timing_source: assumed
    bitrate_mbps: 16
    bitrate_value_source: assumed
  routing_switch:
    disabled_nodes:
    - gpu
    - m2m_scaler
    disabled_edges:
    - from: mfc_dec
      to: gpu
    - from: gpu
      to: dpu
    - from: mfc_dec
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    mfc_dec:
      selected_mode: Normal
      codec: H264_DEC
      sim:
        width: 1920
        height: 1080
        fps: 60
        bitdepth: 8
        sbwc: false
      bw_kb_s:
        peak: 492698
        read: 519535
        write: 321308
      dvfs:
        weighted_mb: 489600
        freq_mfc_khz: 400000
        freq_int_khz: 133000
        freq_mif_khz: 676000
        time_fw_us: 1187
        bts_scen: default
      model_ref: ip-mfc-s5e9965.capabilities.bw_model / dvfs_model
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: DPU_DIRECT
        layers:
        - name: video
          src:
          - 1920
          - 1080
          bpp: 12
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 3046110
        surface_traffic: 445500
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    m2m_scaler:
      sim:
        active: false
    gpu:
      sim:
        active: false
    network:
      sim:
        bitrate_mbps: 16
      bw_kb_s:
        write: 2000
      model_ref: ip-cpu-s5e9965.capabilities.sw_task_model
      bw_note: Link traffic landing in DRAM through the modem/WiFi driver. It is not an IP DMA port; charge it to MIF but
        not to a codec or display IP.
