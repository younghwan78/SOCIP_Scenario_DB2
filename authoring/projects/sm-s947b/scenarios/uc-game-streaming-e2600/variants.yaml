      to: dpu
    - from: mfc_dec
      to: gpu
    - from: gpu
      to: dpu
  node_configs:
    dpu:
      sim:
        composer: M2M_SCALER_FALLBACK
        layers:
        - name: m2m_scaled_video
          src:
          - 1920
          - 1080
          bpp: 32
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      bw_kb_s:
        bts_read_vote: 4061480
        surface_traffic: 749250
    m2m_scaler:
      selected_mode: Normal
      sim:
        $unset:
        - active
        src:
        - 1920
        - 1080
        dst:
        - 1440
        - 3120
        fps: 60
        src_bpp: 12
        dst_bpp: 32
        ppc: 4.89
        ppc_row: YUV420
      required_freq_khz: 55126
      dvfs:
        freq_mif_khz: 0
        freq_int_khz: 133000
        freq_mscl_khz: 88000
      bw_kb_s:
        read: 182250
        write: 1053000
      model_ref: ip-m2m-scaler-s5e9965.capabilities.perf_model / bw_model
  buffer_overrides:
