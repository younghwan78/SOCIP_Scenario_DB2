- id: game-stream-fhd60-hevc-gpu-overlay
  extends: game-stream-fhd60-hevc
  design_conditions:
    dpu_layer_count: 13
    dpu_composer: GPU_FALLBACK
    note: 게임+스트리밍 컨트롤 UI+채팅+알림 레이어 합산 >12 → GPU fallback
    design_review: GPU fallback is asserted at 13 layers, but S5E9965 has 16 DPP channels and max_win = 16, so the DPU can
      compose this directly. The real limits are >16 layers, or more than 8 layers needing scale/CSC (only the odd DPPs are
      VG). Confirm the intended trigger and either raise the layer count or state the other reason.
  routing_switch:
    disabled_nodes:
    - m2m_scaler
    disabled_edges:
    - from: mfc_dec
      to: dpu
    - from: mfc_dec
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    dpu:
      sim:
        composer: GPU_FALLBACK
        layers:
        - name: gpu_composed
          src:
          - 1440
          - 3120
          dst:
          - 1440
          - 3120
          bpp: 32
          note: single RGBA8888 surface produced by SurfaceFlinger
      bw_kb_s:
        bts_read_vote: 1218444
        surface_traffic: 1053000
    gpu:
      selected_mode: Normal
      sim:
        $unset:
        - active
        width: 1920
        height: 1080
        fps: 60
        workload: composition
        input_layers: 13
      bw_kb_s:
        note: GPU traffic is not kernel-declared; see ip-gpu bw_model
        composition_write: 1053000
      model_ref: ip-gpu-s5e9965.capabilities.dvfs_model / power_model
- id: game-stream-fhd60-hevc-m2m-scale
  extends: game-stream-fhd60-hevc
