# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-vid-youtube-e2600
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  canonical_usecase: uc-vid-youtube
  name: YouTube Playback
  purpose: "YouTube 재생: 네트워크 수신·demux·MFC 디코딩·화면 합성을 검토합니다. 등록된 codec/bitrate는 검토 조건이며 실제 서비스의 적응형 화질 선택이나 네트워크 성능을 보장하지 않습니다."
  review_focus:
  - "MFC decode (codec · bitrate)"
  - "자체 주기 task (ABOX · ExoPlayer · network)"
  - "화면 합성"
  - "화면 off 재생 전력"
  category:
  - video_playback
  - video
  domain:
  - video_playback
pipeline:
  nodes:
  - id: network
    ip_ref: ip-cpu-s5e9965
    role: source
    instance_index: 0
  - id: sw_demux
    ip_ref: ip-cpu-s5e9965
    role: demux
    instance_index: 0
  # ExoPlayer playback work loop (doSomeWork every 10 ms): own cadence, outside the frame path
  - id: exo_loop
    ip_ref: ip-cpu-s5e9965
    role: player_loop
    instance_index: 0
  - id: mfc_dec
    ip_ref: ip-mfc-s5e9965
    role: decoder
    instance_index: 0
    load_model:
      ref: codec-throughput-v1
      value_source: assumed
      note: >-
        Fixture assumption (2026-11-14), not a measurement. Per-codec decode throughput (pixels per MFC
        clock) and entropy-decoding cycles per bit; replace with the MFC team's per-codec rates.
      cycles_per_bit: 1.0
      codecs:
        H264_DEC: {ppc: 2.0}
        HEVC_DEC: {ppc: 2.0}
        VP9_DEC: {ppc: 1.0}
        AV1_DEC: {ppc: 1.0}
  - id: gpu
    ip_ref: ip-gpu-s5e9965
    role: composer
    instance_index: 0
  - id: m2m_scaler
    ip_ref: ip-m2m-scaler-s5e9965
    role: m2m_scaler
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  - id: abox
    ip_ref: ip-abox-s5e9965
    role: audio_playback
    instance_index: 0
  edges:
  - from: network
    to: sw_demux
    type: control
  - from: sw_demux
    to: mfc_dec
    type: M2M
    buffer: NET_ES_BUF
  - from: mfc_dec
    to: dpu
    type: M2M
    buffer: MFC_DPU_BUF
  - from: mfc_dec
    to: gpu
    type: M2M
    buffer: MFC_GPU_BUF
  - from: gpu
    to: dpu
    type: M2M
    buffer: GPU_DPU_BUF
  - from: mfc_dec
    to: m2m_scaler
    type: M2M
    buffer: MFC_M2M_BUF
  - from: m2m_scaler
    to: dpu
    type: M2M
    buffer: M2M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  # D-02 judgement contract: the outputs whose interval is judged at the variant fps.
  # Screen-off playback (dpu disabled) is judged on the decoder output only.
  judgement:
    sinks:
    - node: dpu
      kind: preview
      label: display
    - node: mfc_dec
      kind: video
      label: decode
    stages:
      decoder: output
      display_controller: output
      display_output: output
    kpis:
    - interval
    - latency
  buffers:
    NET_ES_BUF:
      format: BITSTREAM
      compression: COMP_OFF
    MFC_DPU_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    MFC_GPU_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    MFC_M2M_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
variants:
  $include: variants.yaml
provenance:
  platform_review: S5E9965 platform (non-camera) driver review 2026-09-16
  note: Node ip_refs, per-variant sim shapes, bw_kb_s, dvfs steps and sw_timing are generated by tools/build_platform_fixture.py
    from the S5E9965 DT/drivers. Variant ids and design_conditions are hand-maintained inputs.
