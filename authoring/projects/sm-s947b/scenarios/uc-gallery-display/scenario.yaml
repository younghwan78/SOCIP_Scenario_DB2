# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-gallery-display
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: Gallery Display
  category:
  - display
  - display
  domain:
  - display
pipeline:
  nodes:
  - id: storage
    ip_ref: ip-ufs-s5e9965
    role: source
    instance_index: 0
  - id: gpu
    ip_ref: ip-gpu-s5e9965
    role: composer
    instance_index: 0
  - id: m2m_scaler
    ip_ref: ip-m2m-scaler-s5e9965
    role: m2m_scaler
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: storage
    to: dpu
    type: M2M
    buffer: STORAGE_DPU_BUF
  - from: storage
    to: gpu
    type: M2M
    buffer: STORAGE_GPU_BUF
  - from: gpu
    to: dpu
    type: M2M
    buffer: GPU_DPU_BUF
  - from: storage
    to: m2m_scaler
    type: M2M
    buffer: STORAGE_M2M_BUF
  - from: m2m_scaler
    to: dpu
    type: M2M
    buffer: M2M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    STORAGE_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    STORAGE_GPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    STORAGE_M2M_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
variants:
  $include: variants.yaml
provenance:
  platform_review: S5E9965 platform (non-camera) driver review 2026-09-16
  note: Node ip_refs, per-variant sim shapes, bw_kb_s, dvfs steps and sw_timing are generated by tools/build_platform_fixture.py
    from the S5E9965 DT/drivers. Variant ids and design_conditions are hand-maintained inputs.
