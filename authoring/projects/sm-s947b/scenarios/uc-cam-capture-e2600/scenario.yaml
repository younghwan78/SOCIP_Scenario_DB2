# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-cam-capture-e2600
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  canonical_usecase: uc-cam-capture
  name: Camera Capture
  purpose: "정지 촬영 · 셔터 응답, 고해상도 처리와 연속 촬영의 순간 부하를 확인합니다."
  review_focus:
  - "셔터 응답"
  - "고해상도 처리"
  - "연속 촬영 순간 부하"
  category:
  - camera
  domain:
  - camera
pipeline:
  nodes:
  - id: sensor_rear
    ip_ref: ip-sensor-rear-s5e9965
    role: sensor
    instance_index: 0
  - id: sensor_rear2
    ip_ref: ip-sensor-rear-s5e9965
    role: sensor
    instance_index: 0
  - id: sensor_front
    ip_ref: ip-sensor-front-s5e9965
    role: sensor
    instance_index: 0
  - id: csispdp
    ip_ref: ip-csis-is-v15-s5e9965
    role: csispdp
    instance_index: 0
  - id: n3aa
    ip_ref: ip-isp-s5e9965
    role: 3aa_stats
    instance_index: 0
  - id: byrp
    ip_ref: ip-byrp-is-v15-s5e9965
    role: byrp
    instance_index: 0
  - id: rgbp
    ip_ref: ip-rgbp-is-v15-s5e9965
    role: rgbp
    instance_index: 0
  - id: yuvsc
    ip_ref: ip-yuvsc-is-v15-s5e9965
    role: yuvsc
    instance_index: 0
  - id: mtnr
    ip_ref: ip-mtnr-is-v15-s5e9965
    role: mtnr
    instance_index: 0
  - id: msnr
    ip_ref: ip-msnr-is-v15-s5e9965
    role: msnr
    instance_index: 0
  - id: yuvp
    ip_ref: ip-yuvp-is-v15-s5e9965
    role: yuvp
    instance_index: 0
  - id: mcsc
    ip_ref: ip-mcsc-is-v15-s5e9965
    role: mcsc
    instance_index: 0
  - id: npu
    ip_ref: ip-npu-s5e9965
    role: npu
    instance_index: 0
    domain_load:
      model: util-vf-v1
      coeff_uw_per_mhz_v2: 2500
      vf:
      - {mhz: 533, mv: 600}
      - {mhz: 664, mv: 625}
      - {mhz: 800, mv: 650}
      - {mhz: 935, mv: 700}
      - {mhz: 1066, mv: 750}
      - {mhz: 1200, mv: 800}
      leakage: {mw_at_ref: 25.0, ref_mv: 750.0, exponent: 2.5}
      mcycles_per_frame: 10.0
      target_util: 0.85
      idle_gated: 0.7
      value_source: assumed
      basis: "assumed camera AI work (10 Mcycle per frame); NPU coeff / V-f / leakage assumed (not in the catalog)"
  - id: post_proc
    ip_ref: ip-cpu-s5e9965
    role: jpeg_encode
    instance_index: 0
  - id: storage
    ip_ref: ip-cpu-s5e9965
    role: storage_sink
    instance_index: 0
  edges:
  - from: sensor_rear
    to: csispdp
    type: OTF
  - from: sensor_rear2
    to: csispdp
    type: OTF
  - from: sensor_front
    to: csispdp
    type: OTF
  - from: csispdp
    to: byrp
    type: OTF
  - from: byrp
    to: rgbp
    type: OTF
  - from: rgbp
    to: yuvsc
    type: OTF
  - from: yuvsc
    to: mtnr
    type: M2M
    buffer: YUVSC_MTNR_BUF
  - from: mtnr
    to: msnr
    type: OTF
  - from: msnr
    to: yuvp
    type: OTF
  - from: yuvp
    to: mcsc
    type: OTF
  - from: csispdp
    to: n3aa
    type: M2M
    buffer: CSISPDP_3AA_BUF
  - from: csispdp
    to: npu
    type: M2M
    buffer: CSISPDP_NPU_BUF
  - from: npu
    to: mtnr
    type: M2M
    buffer: NPU_MTNR_BUF
  - from: mcsc
    to: post_proc
    type: M2M
    buffer: MCSC_WDMA_CAP_BUF
  - from: post_proc
    to: storage
    type: M2M
    buffer: JPEG_BUF
  buffers:
    YUVSC_MTNR_BUF:
      format: YUV420
      size_ref: sensor_out
      bitdepth: 10
      compression: COMP_OFF
      note: M2M break — multi-frame TNR input
    CSISPDP_3AA_BUF:
      format: BAYER
      bitdepth: 10
      compression: COMP_OFF
      note: 3A stats sidecar
    CSISPDP_NPU_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: AI remosaic NPU input
    NPU_MTNR_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: NPU → MTNR AI pre-processed
    MCSC_WDMA_CAP_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_BAYER_LOSSLESS
      note: MCSC OUTPUT2 capture WDMA — full/high-res size. Left unsized in the steady model (it is written once per
        shot, not every frame); the per-shot traffic belongs to the capture event job.
    ZSL_RING_BUF:
      format: BAYER
      bitdepth: 10
      compression: COMP_BAYER_LOSSLESS
      note: ZSL ring buffer (capture 직전 N프레임 보관). Bayer frames from the BYRP Bayer dump; no edge writes it yet.
    JPEG_BUF:
      format: JPEG
      bitdepth: 8
      compression: COMP_OFF
      note: JPEG encoded output
  # R-3 event jobs (E2600 assumed values; params in knobs.yaml). The steady session is the 12M preview (C-2);
  # a shot runs on the same ISP resources at job priority, preview RT first. ISP stages run at the top DVFS level
  # (capture DVFS SN, assumed); the preview background keeps its steady clock (job-v1).
  jobs:
  # 12M shot from the preview session (binning_4x4): ZSL frames, or N new frames after the shutter (non-ZSL);
  # JPEG through the ISP, or a 16-bit RAW (DNG) straight from BYRP
  - id: still_shot
    label: 12M shot (ZSL / non-ZSL, SF / MF, JPEG / RAW)
    when: {capture_readout: null}
    trigger: {kind: event, at_ms: 200}
    phases: [acquire, process, encode, store]
    buffers:
      cap_yuv: {format: YUV420, bitdepth: 10, count: yuv_pool}
      mrg_yuv: {format: YUV420, bitdepth: 10}
      out_yuv: {format: YUV420, bitdepth: 10}
      raw16: {format: RAW, bitdepth: 16}
      jpeg: {mb: jpeg_mb}
    stages:
    - {id: grab, phase: acquire, kind: fixed, nodes: [sensor_rear], frames: burst_frames, chunk: {by: frame},
       work: {duration_ms: preview_frame_ms}, when: {capture_type: non_ZSL},
       basis: non-ZSL waits for the frames exposed after the shutter (one preview frame period each)}
    - {id: reproc, phase: process, clock: max, nodes: [byrp, rgbp, yuvsc], frames: burst_frames, reads: [ZSL_RING_BUF],
       writes: [cap_yuv], chunk: {by: frame}, after: [{stage: grab, per: frame}], when: {output_format: null}}
    - {id: raw_proc, phase: process, clock: max, nodes: [byrp], reads: [ZSL_RING_BUF], writes: [raw16],
       when: {output_format: RAW_BAYER_16}}
    - {id: merge, phase: process, clock: max, nodes: [mtnr], frames: burst_frames,
       after: [{stage: reproc, per: frame}],
       when: {subscenario: &mf12 [STILL_MF_CAPTURE, STILL_FLASH_MF_CAPTURE, STILL_HIGH_RES_MF_CAPTURE, NIGHT_CAPTURE,
                                   STILL_MOTION_FREE_MF_CAPTURE, SRZOOM_CAPTURE]}}
    - {id: merge_out, phase: process, kind: fixed, nodes: [mtnr], writes: [mrg_yuv], after: [merge],
       work: {duration_ms: 0}, when: {subscenario: *mf12},
       basis: hands the merged frame to the post stage (its time is in merge)}
    - {id: post, phase: process, clock: max, nodes: [msnr, yuvp, mcsc], writes: [out_yuv], after: [merge_out, reproc],
       when: {output_format: null}}
    - {id: enc, phase: encode, kind: sw, nodes: [post_proc], writes: [jpeg], after: [post],
       work: {runtime_ms: encode_ms, cluster: big, power_mw: cpu_encode_mw}, when: {output_format: null}}
    - {id: store, phase: store, kind: transfer, nodes: [storage], after: [enc, raw_proc],
       work: {mb: file_mb, mb_per_s: ufs_mb_s, power_mw: ufs_mw}}
    milestones: {thumbnail: post, saved: store}
    kpis: [event_latency, event_energy, peak_power, peak_bw, peak_footprint]
  # 50M shot: the sensor switches to binning_2x2 for the shot frames (seamless mode change), then back
  - id: still_shot_50m
    label: 50M shot by seamless mode change (binning_2x2 readout)
    when: {capture_readout: binning_2x2}
    trigger: {kind: event, at_ms: 200}
    phases: [acquire, process, encode, store]
    buffers:
      cap_bayer: {format: BAYER, bitdepth: 10, count: yuv_pool}
      cap_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_50m, count: yuv_pool}
      mrg_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_50m}
      out_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_50m}
      jpeg: {mb: jpeg_50m_mb}
    stages:
    - {id: readout, phase: acquire, kind: sensor, nodes: [sensor_rear], holds: [csispdp], mode: binning_2x2,
       frames: burst_frames, writes: [cap_bayer], work: {switch_in_ms: mode_switch_ms, switch_out_ms: mode_switch_ms}}
    - {id: reproc, phase: process, clock: max, nodes: [byrp, rgbp, yuvsc], size_ref: capture_50m, frames: burst_frames,
       writes: [cap_yuv], chunk: {by: frame}, after: [{stage: readout, per: frame}]}
    - {id: merge, phase: process, clock: max, nodes: [mtnr], size_ref: capture_50m, frames: burst_frames,
       after: [{stage: reproc, per: frame}], when: {subscenario: *mf12}}
    - {id: merge_out, phase: process, kind: fixed, nodes: [mtnr], size_ref: capture_50m, writes: [mrg_yuv],
       after: [merge], work: {duration_ms: 0}, when: {subscenario: *mf12}}
    - {id: post, phase: process, clock: max, nodes: [msnr, yuvp, mcsc], size_ref: capture_50m, writes: [out_yuv],
       after: [merge_out, reproc]}
    - {id: enc, phase: encode, kind: sw, nodes: [post_proc], writes: [jpeg], after: [post],
       work: {runtime_ms: encode_50m_ms, cluster: big, power_mw: cpu_encode_mw}}
    - {id: store, phase: store, kind: transfer, nodes: [storage], after: [enc],
       work: {mb: jpeg_50m_mb, mb_per_s: ufs_mb_s, power_mw: ufs_mw}}
    milestones: {thumbnail: post, saved: store}
    kpis: [event_latency, event_energy, peak_power, peak_bw, peak_footprint]
  - id: still_shot_200m
    label: 200M shot by seamless mode change (full_remosaic readout)
    when: {capture_readout: full_remosaic}
    trigger: {kind: event, at_ms: 200}
    phases: [acquire, process, encode, store]
    buffers:
      cap_bayer: {format: BAYER, bitdepth: 12, size_ref: capture_full, count: full_pool}
      cap_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_full, count: full_pool}
      mrg_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_full}
      ai_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_full}
      out_yuv: {format: YUV420, bitdepth: 10, size_ref: capture_full}
      jpeg: {mb: jpeg_200m_mb}
    stages:
    - {id: readout, phase: acquire, kind: sensor, nodes: [sensor_rear], holds: [csispdp], mode: full_remosaic,
       frames: full_frames, writes: [cap_bayer],
       work: {switch_in_ms: mode_switch_ms, switch_out_ms: mode_switch_ms}}
    - {id: reproc, phase: process, clock: max, nodes: [byrp, rgbp, yuvsc], size_ref: capture_full, frames: full_frames,
       writes: [cap_yuv], after: [readout],
       chunk: {by: stripe, max_line_px: isp_line_px, overlap_px: stripe_overlap_px}}
    - {id: merge, phase: process, clock: max, nodes: [mtnr], size_ref: capture_full, frames: full_frames, after: [reproc],
       chunk: {by: stripe, max_line_px: isp_line_px, overlap_px: stripe_overlap_px},
       when: {subscenario: &mf200 [STILL_REMOSAIC_MF_CAPTURE, REMOSAIC_NIGHT_CAPTURE]}}
    - {id: merge_out, phase: process, kind: fixed, nodes: [mtnr], size_ref: capture_full, writes: [mrg_yuv],
       after: [merge], work: {duration_ms: 0}, when: {subscenario: *mf200}}
    - {id: ai, phase: process, kind: domain, nodes: [npu], size_ref: capture_full, writes: [ai_yuv],
       after: [merge_out, reproc], work: {mcycles_per_mp: ai_mcycles_per_mp}, when: {extend_mode: EX_AI_REMOSAIC}}
    - {id: post, phase: process, clock: max, nodes: [msnr, yuvp, mcsc], size_ref: capture_full, writes: [out_yuv],
       after: [ai, merge_out, reproc], chunk: {by: stripe, max_line_px: isp_line_px, overlap_px: stripe_overlap_px}}
    - {id: enc, phase: encode, kind: sw, nodes: [post_proc], writes: [jpeg], after: [post],
       work: {runtime_ms: encode_200m_ms, cluster: big, power_mw: cpu_encode_mw}}
    - {id: store, phase: store, kind: transfer, nodes: [storage], after: [enc],
       work: {mb: jpeg_200m_mb, mb_per_s: ufs_mb_s, power_mw: ufs_mw}}
    milestones: {thumbnail: post, saved: store}
    kpis: [event_latency, event_energy, peak_power, peak_bw, peak_footprint]
size_profile:
  anchors:
    sensor_out: 4000x3000
    capture_50m: 8000x6000      # binning_2x2 readout (capture job only)
    capture_full: 16384x12288   # full_remosaic readout (capture job only)
variants:
  $include: variants.yaml
