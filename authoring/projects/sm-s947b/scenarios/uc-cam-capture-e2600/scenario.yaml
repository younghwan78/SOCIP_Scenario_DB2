# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-cam-capture-e2600
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  canonical_usecase: uc-cam-capture
  name: Camera Capture
  purpose: "정지 촬영 · 셔터 응답, 고해상도 처리와 연속 촬영의 순간 부하를 확인합니다."
  review_focus:
  - "셔터 응답"
  - "고해상도 처리"
  - "연속 촬영 순간 부하"
  category:
  - camera
  domain:
  - camera
pipeline:
  nodes:
  - id: sensor_rear
    ip_ref: ip-sensor-rear-s5e9965
    role: sensor
    instance_index: 0
  - id: sensor_rear2
    ip_ref: ip-sensor-rear-s5e9965
    role: sensor
    instance_index: 0
  - id: sensor_front
    ip_ref: ip-sensor-front-s5e9965
    role: sensor
    instance_index: 0
  - id: csispdp
    ip_ref: ip-csis-is-v15-s5e9965
    role: csispdp
    instance_index: 0
  - id: n3aa
    ip_ref: ip-isp-s5e9965
    role: 3aa_stats
    instance_index: 0
  - id: byrp
    ip_ref: ip-byrp-is-v15-s5e9965
    role: byrp
    instance_index: 0
  - id: rgbp
    ip_ref: ip-rgbp-is-v15-s5e9965
    role: rgbp
    instance_index: 0
  - id: yuvsc
    ip_ref: ip-yuvsc-is-v15-s5e9965
    role: yuvsc
    instance_index: 0
  - id: mtnr
    ip_ref: ip-mtnr-is-v15-s5e9965
    role: mtnr
    instance_index: 0
  - id: msnr
    ip_ref: ip-msnr-is-v15-s5e9965
    role: msnr
    instance_index: 0
  - id: yuvp
    ip_ref: ip-yuvp-is-v15-s5e9965
    role: yuvp
    instance_index: 0
  - id: mcsc
    ip_ref: ip-mcsc-is-v15-s5e9965
    role: mcsc
    instance_index: 0
  - id: npu
    ip_ref: ip-npu-s5e9965
    role: npu
    instance_index: 0
    domain_load:
      model: util-vf-v1
      coeff_uw_per_mhz_v2: 2500
      vf:
      - {mhz: 533, mv: 600}
      - {mhz: 664, mv: 625}
      - {mhz: 800, mv: 650}
      - {mhz: 935, mv: 700}
      - {mhz: 1066, mv: 750}
      - {mhz: 1200, mv: 800}
      leakage: {mw_at_ref: 25.0, ref_mv: 750.0, exponent: 2.5}
      mcycles_per_frame: 10.0
      target_util: 0.85
      idle_gated: 0.7
      value_source: assumed
      basis: "assumed camera AI work (10 Mcycle per frame); NPU coeff / V-f / leakage assumed (not in the catalog)"
  - id: post_proc
    ip_ref: ip-cpu-s5e9965
    role: jpeg_encode
    instance_index: 0
  - id: storage
    ip_ref: ip-cpu-s5e9965
    role: storage_sink
    instance_index: 0
  edges:
  - from: sensor_rear
    to: csispdp
    type: OTF
  - from: sensor_rear2
    to: csispdp
    type: OTF
  - from: sensor_front
    to: csispdp
    type: OTF
  - from: csispdp
    to: byrp
    type: OTF
  - from: byrp
    to: rgbp
    type: OTF
  - from: rgbp
    to: yuvsc
    type: OTF
  - from: yuvsc
    to: mtnr
    type: M2M
    buffer: YUVSC_MTNR_BUF
  - from: mtnr
    to: msnr
    type: OTF
  - from: msnr
    to: yuvp
    type: OTF
  - from: yuvp
    to: mcsc
    type: OTF
  - from: csispdp
    to: n3aa
    type: M2M
    buffer: CSISPDP_3AA_BUF
  - from: csispdp
    to: npu
    type: M2M
    buffer: CSISPDP_NPU_BUF
  - from: npu
    to: mtnr
    type: M2M
    buffer: NPU_MTNR_BUF
  - from: mcsc
    to: post_proc
    type: M2M
    buffer: MCSC_WDMA_CAP_BUF
  - from: post_proc
    to: storage
    type: M2M
    buffer: JPEG_BUF
  buffers:
    YUVSC_MTNR_BUF:
      format: YUV420
      size_ref: sensor_out
      bitdepth: 10
      compression: COMP_OFF
      note: M2M break — multi-frame TNR input
    CSISPDP_3AA_BUF:
      format: BAYER
      bitdepth: 10
      compression: COMP_OFF
      note: 3A stats sidecar
    CSISPDP_NPU_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: AI remosaic NPU input
    NPU_MTNR_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: NPU → MTNR AI pre-processed
    MCSC_WDMA_CAP_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_BAYER_LOSSLESS
      note: MCSC OUTPUT2 capture WDMA — full/high-res size. Left unsized in the steady model (it is written once per
        shot, not every frame); the per-shot traffic belongs to the capture event job.
    ZSL_RING_BUF:
      format: BAYER
      bitdepth: 10
      compression: COMP_BAYER_LOSSLESS
      note: ZSL ring buffer (capture 직전 N프레임 보관). Bayer frames from the BYRP Bayer dump; no edge writes it yet.
    JPEG_BUF:
      format: JPEG
      bitdepth: 8
      compression: COMP_OFF
      note: JPEG encoded output
size_profile:
  anchors:
    sensor_out: 4000x3000
variants:
  $include: variants.yaml
