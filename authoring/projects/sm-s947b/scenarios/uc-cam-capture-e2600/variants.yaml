# Compact variants: root entries are complete; `extends: <id>` entries are a
# deep-merge patch over that variant (`$unset: [keys]` removes keys).
# node sim width/height come from sizes.yaml; sw_timing from sw_timing.yaml.
- id: cam-cap-r1-sf
  severity: light
  design_conditions:
    subscenario: STILL_SF_CAPTURE
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_CAPTURE
    sensor_place: rear
    capture_type: ZSL
    capture_hint: none
    flash: false
    extend_mode: EX_NONE
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - sensor_front
    - npu
    disabled_edges:
    - from: sensor_rear2
      to: csispdp
    - from: sensor_front
      to: csispdp
    - from: csispdp
      to: npu
    - from: npu
      to: mtnr
  node_configs:
    sensor_rear:
      selected_mode: binning_4x4
      resolved_sensor_mode: &hp2_12m_30   # binning_4x4 at the 30 fps session rate (frame-length extension, assumed; C-2)
        mode_id: binning_4x4
        sensor_name: HP2 12MP 4-in-1 binning
        sensor_size: [4000, 3000]
        active_size: [4000, 3000]
        sensor_fps: 30.0
        sensor_format: BAYER
        sensor_bitwidth: 10
        sensor_mipi_speed: 2.5
        sensor_ln_mode: 1
        sensor_sbwc: enable
        sensor_phy_type: CPHY
        place: rear
        ip_ref: ip-sensor-rear-s5e9965
        value_source: assumed
        basis: catalog binning_4x4 (60 fps) with the frame length doubled for a 30 fps session
    mtnr:
      selected_mode: Normal
      sim:
        inherit_shape: true
      mode_label: Capture_SF
      mode_note: IS v15 MTNR operating modes are Normal / Recording / HighSpeed / LowPower; the scenario label 'Capture_SF'
        is kept in mode_label and the Normal coefficients are used (E2600 assumption).
    csispdp:
      sim:
        inherit_shape: true
    n3aa:
      sim:
        inherit_shape: true
    byrp:
      sim:
        inherit_shape: true
    rgbp:
      sim:
        inherit_shape: true
    yuvsc:
      sim:
        inherit_shape: true
    msnr:
      sim:
        inherit_shape: true
    yuvp:
      sim:
        inherit_shape: true
    mcsc:
      sim:
        inherit_shape: true
  buffer_overrides:
    MCSC_WDMA_CAP_BUF:
      size_role: MCSC_OUTPUT2_FULL
  size_overrides:
    sensor_out: 4000x3000
- id: cam-cap-r1-sf-burst
  extends: cam-cap-r1-sf
  $unset:
  - buffer_overrides
  design_conditions:
    $unset:
    - dvfs_sn
    - flash
    - extend_mode
    capture_hint: burst
- id: cam-cap-r1-sf-single-take
  extends: cam-cap-r1-sf-burst
  design_conditions:
    $unset:
    - sensor_place
    - capture_type
    capture_hint: single_take
  node_configs:
    mtnr:
      $unset:
      - selected_mode
      - mode_label
      - mode_note
- id: cam-cap-r1-sf-agif
  extends: cam-cap-r1-sf-single-take
  design_conditions:
    capture_hint: agif
- id: cam-cap-r1-sf-flash
  extends: cam-cap-r1-sf-burst
  design_conditions:
    $unset:
    - capture_hint
    flash: true
  node_configs:
    mtnr:
      $unset:
      - selected_mode
      - mode_label
      - mode_note
- id: cam-cap-r1-sf-pro
  extends: cam-cap-r1-sf-flash
  design_conditions:
    $unset:
    - capture_type
    - flash
    subscenario: STILL_PRO_SF_CAPTURE
    is_scenario: IS_SCENARIO_PRO_VIDEO
    extend_mode: EX_NONE
  node_configs:
    sensor_rear:
      selected_mode: wide_video_16_9_30
      $unset:
      - resolved_sensor_mode     # the 12M 30 fps pin of the parent does not apply to the 16:9 crop mode
  size_overrides:
    sensor_out: 4080x2296
- id: cam-cap-r1-mf
  extends: cam-cap-r1-sf-flash
  design_conditions:
    subscenario: STILL_MF_CAPTURE
    capture_type: non_ZSL
    flash: false
    isp_features: MTNR,MSNR
  node_configs:
    mtnr:
      selected_mode: Normal
      isp_features:
      - MTNR
      - MSNR
      mode_label: Capture_MF
      mode_note: IS v15 MTNR operating modes are Normal / Recording / HighSpeed / LowPower; the scenario label 'Capture_MF'
        is kept in mode_label and the Normal coefficients are used (E2600 assumption).
  buffer_overrides:
    YUVSC_MTNR_BUF:
      note: multi-frame accumulation — N×frame 입력
- id: cam-cap-r1-mf-flash
  extends: cam-cap-r1-mf
  $unset:
  - buffer_overrides
  design_conditions:
    $unset:
    - capture_type
    subscenario: STILL_FLASH_MF_CAPTURE
    flash: true
- id: cam-cap-r1-mf-high-res
  extends: cam-cap-r1-mf-flash
  design_conditions:
    $unset:
    - flash
    subscenario: STILL_HIGH_RES_MF_CAPTURE
    isp_features: MTNR,MSNR,DJAG
    capture_readout: binning_2x2   # 50M frames read at the shot by a seamless mode change (C-2)
  node_configs:
    mtnr:
      isp_features:
      - MTNR
      - MSNR
      - DJAG
- id: cam-cap-r1-remosaic-sf
  extends: cam-cap-r1-sf-single-take
  design_conditions:
    $unset:
    - capture_hint
    subscenario: STILL_REMOSAIC_SF_CAPTURE
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_REMOSAIC_CAPTURE
    extend_mode: EX_SEAMLESS_TETRA
    capture_readout: full_remosaic
    preview_basis: preview session is 12M (binning_4x4); 50M / 200M are read only at capture by a seamless mode change (capture event job), C-2 decision 2026-11-21
    is_scenario: IS_SCENARIO_FULL_SIZE
  node_configs:
    mtnr:
      selected_mode: Normal
      mode_label: Remosaic
      mode_note: IS v15 MTNR operating modes are Normal / Recording / HighSpeed / LowPower; the scenario label 'Remosaic'
        is kept in mode_label and the Normal coefficients are used (E2600 assumption).
    sensor_rear:
      selected_mode: binning_4x4
      resolved_sensor_mode: *hp2_12m_30
  size_overrides:
    sensor_out: 4000x3000
  buffer_overrides:
    MCSC_WDMA_CAP_BUF:
      format: YUV420
      bitdepth: 10
      note: 200MP full-res output
- id: cam-cap-r1-remosaic-mf
  extends: cam-cap-r1-remosaic-sf
  $unset:
  - buffer_overrides
  design_conditions:
    $unset:
    - dvfs_sn
    - is_scenario
    subscenario: STILL_REMOSAIC_MF_CAPTURE
    isp_features: MTNR,MSNR
- id: cam-cap-r1-ai-remosaic
  extends: cam-cap-r1-remosaic-sf
  $unset:
  - buffer_overrides
  design_conditions:
    $unset:
    - dvfs_sn
    - is_scenario
    extend_mode: EX_AI_REMOSAIC
    npu_used: true
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - sensor_front
    disabled_edges:
    - from: sensor_rear2
      to: csispdp
    - from: sensor_front
      to: csispdp
  node_configs:
    mtnr:
      $unset:
      - selected_mode
      - mode_label
      - mode_note
    npu:
      selected_mode: Normal
- id: cam-cap-r1-remosaic-cal
  extends: cam-cap-r1-sf-single-take
  design_conditions:
    $unset:
    - capture_hint
    extend_mode: EX_REMOSAIC_CAL
- id: cam-cap-r1-low-res-tetra
  extends: cam-cap-r1-remosaic-cal
  design_conditions:
    extend_mode: EX_LOW_RES_TETRA
- id: cam-cap-r1-remosaic-pro
  extends: cam-cap-r1-remosaic-mf
  design_conditions:
    $unset:
    - isp_features
    subscenario: STILL_REMOSAIC_PRO_SF_CAPTURE
    is_scenario: IS_SCENARIO_PRO_VIDEO
- id: cam-cap-r1-hhdr
  extends: cam-cap-r1-remosaic-cal
  design_conditions:
    subscenario: STILL_HHDR_AID_CAPTURE
    extend_mode: EX_3DHDR
  node_configs:
    csispdp:
      sim:
        mode: Normal
      selected_mode: VC_DT
      mode_note: IS v15 catalog has no 'VC_DT' mode; the catalog Normal coefficients are used (E2600 assumption). Mode-specific
        coefficients belong in sim.ip_params when known.
- id: cam-cap-r1-dcg
  extends: cam-cap-r1-remosaic-cal
  design_conditions:
    extend_mode: EX_DCG
- id: cam-cap-r1-night
  extends: cam-cap-r1-mf-high-res
  design_conditions:
    $unset:
    - sensor_place
    - capture_readout
    subscenario: NIGHT_CAPTURE
    isp_features: MSNR
    extend_mode: EX_NIGHT
    super_night: true
  node_configs:
    mtnr:
      isp_features:
      - MSNR
- id: cam-cap-r1-night-max
  extends: cam-cap-r1-night
  design_conditions:
    $unset:
    - isp_features
    super_night: max
  node_configs:
    mtnr:
      $unset:
      - selected_mode
      - isp_features
      - mode_label
      - mode_note
- id: cam-cap-r1-night-remosaic
  extends: cam-cap-r1-remosaic-pro
  design_conditions:
    $unset:
    - is_scenario
    subscenario: REMOSAIC_NIGHT_CAPTURE
    super_night: true
  node_configs:
    mtnr:
      $unset:
      - selected_mode
      - mode_label
      - mode_note
- id: cam-cap-r1-srzoom
  severity: light
  design_conditions:
    subscenario: SRZOOM_CAPTURE
    camera_mode: dual_sync
  routing_switch:
    disabled_nodes:
    - sensor_front
    - npu
    disabled_edges:
    - from: sensor_front
      to: csispdp
    - from: csispdp
      to: npu
    - from: npu
      to: mtnr
  node_configs:
    sensor_rear:
      selected_mode: binning_4x4
      resolved_sensor_mode: *hp2_12m_30
    sensor_rear2:
      selected_mode: binning_4x4
      resolved_sensor_mode: *hp2_12m_30
    csispdp:
      sim:
        inherit_shape: true
    n3aa:
      sim:
        inherit_shape: true
    byrp:
      sim:
        inherit_shape: true
    rgbp:
      sim:
        inherit_shape: true
    yuvsc:
      sim:
        inherit_shape: true
    mtnr:
      sim:
        inherit_shape: true
    msnr:
      sim:
        inherit_shape: true
    yuvp:
      sim:
        inherit_shape: true
    mcsc:
      sim:
        inherit_shape: true
  size_overrides:
    sensor_out: 4000x3000
- id: cam-cap-r1-motion-free-sf
  extends: cam-cap-r1-remosaic-cal
  design_conditions:
    $unset:
    - extend_mode
    subscenario: STILL_MOTION_FREE_SF_CAPTURE
- id: cam-cap-r1-motion-free-mf
  extends: cam-cap-r1-mf-flash
  design_conditions:
    $unset:
    - sensor_place
    - flash
    subscenario: STILL_MOTION_FREE_MF_CAPTURE
- id: cam-cap-r1-high-res-raw
  extends: cam-cap-r1-remosaic-cal
  design_conditions:
    subscenario: HIGH_RES_RAW_CAPTURE
    extend_mode: EX_PDAF_OFF
    output_format: RAW_BAYER_16
  buffer_overrides:
    MCSC_WDMA_CAP_BUF:
      format: RAW_BAYER
      bitdepth: 16
      compression: COMP_OFF
    JPEG_BUF:
      format: DNG_RAW
      bitdepth: 16
      compression: COMP_OFF
- id: cam-cap-r1-expert-raw
  extends: cam-cap-r1-high-res-raw
  design_conditions:
    subscenario: STILL_EXPERT_RAW_CAPTURE
  buffer_overrides:
    $unset:
    - JPEG_BUF
- id: cam-cap-rdual
  extends: cam-cap-r1-srzoom
  design_conditions:
    subscenario: STILL_SF_CAPTURE
    dvfs_sn: IS_DVFS_SN_REAR_DUAL_CAPTURE
- id: cam-cap-rtriple
  extends: cam-cap-rdual
  design_conditions:
    camera_mode: triple
    dvfs_sn: IS_DVFS_SN_TRIPLE_CAPTURE
- id: cam-cap-f1
  extends: cam-cap-r1-remosaic-cal
  design_conditions:
    $unset:
    - extend_mode
    dvfs_sn: IS_DVFS_SN_FRONT_SINGLE_CAPTURE
    sensor_place: front
  routing_switch:
    disabled_nodes:
    - sensor_rear
    - sensor_rear2
    - npu
    disabled_edges:
    - from: sensor_rear
      to: csispdp
    - from: sensor_rear2
      to: csispdp
    - from: csispdp
      to: npu
    - from: npu
      to: mtnr
  size_overrides:
    sensor_out: 3648x2736
- id: cam-cap-pip-dual
  extends: cam-cap-rdual
  design_conditions:
    camera_mode: dual_async
    dvfs_sn: IS_DVFS_SN_PIP_DUAL_CAPTURE
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - npu
    disabled_edges:
    - from: sensor_rear2
      to: csispdp
    - from: csispdp
      to: npu
    - from: npu
      to: mtnr
