# Compact variants: root entries are complete; `extends: <id>` entries are a
# deep-merge patch over that variant (`$unset: [keys]` removes keys).
# node sim width/height come from sizes.yaml; sw_timing from sw_timing.yaml.
- id: disp-gallery-fhd-sdr-60hz
  severity: light
  design_conditions:
    resolution: FHD
    hdr: SDR
    color_mode: HAL_COLOR_MODE_DISPLAY_P3
    panel_fps_hz: 60
    dpu_layer_count: 4
    dpu_composer: DPU_DIRECT
    panel_resolution: 1440x3120
    source_resolution: 1920x1080
    sw_timing_source: assumed
  routing_switch:
    disabled_nodes:
    - gpu
    - m2m_scaler
    disabled_edges:
    - from: storage
      to: gpu
    - from: gpu
      to: dpu
    - from: storage
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: DPU_DIRECT
        layers:
        - name: image
          src:
          - 1440
          - 3120
          bpp: 32
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 4873776
        surface_traffic: 1447875
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    m2m_scaler:
      sim:
        active: false
    gpu:
      sim:
        active: false
    storage:
      sim:
        bitrate_mbps: null
      note: no bitrate in design_conditions; set bitrate_mbps or bitrate_kbps to model this traffic
- id: disp-gallery-fhd-sdr-120hz
  extends: disp-gallery-fhd-sdr-60hz
  design_conditions:
    panel_fps_hz: 120
  node_configs:
    panel:
      selected_mode: 120hz
      sim:
        refresh_hz: 120
    dpu:
      selected_mode: VRR
      sim:
        refresh_hz: 120
      resol_clk_khz: 609223
      bw_kb_s:
        bts_read_vote: 9747568
        surface_traffic: 2895750
- id: disp-gallery-uhd-hdr10-60hz
  extends: disp-gallery-fhd-sdr-60hz
  severity: heavy
  design_conditions:
    resolution: UHD
    hdr: HDR10
    hdr_dpu: HDR_HDR10
    color_mode: HAL_COLOR_MODE_BT2020
    bit_depth: 10
    source_resolution: 3840x2160
  buffer_overrides:
    STORAGE_DPU_BUF:
      format: RGBA1010102
      bitdepth: 10
      compression: COMP_OFF
- id: disp-gallery-fhd-hdr10plus-60hz
  extends: disp-gallery-uhd-hdr10-60hz
  severity: light
  design_conditions:
    resolution: FHD
    hdr: HDR10_PLUS
    hdr_dpu: HDR_HDR10_PLUS
    dynamic_metadata: true
    source_resolution: 1920x1080
- id: disp-gallery-fhd-hlg-60hz
  extends: disp-gallery-fhd-hdr10plus-60hz
  severity: medium
  design_conditions:
    $unset:
    - dynamic_metadata
    - color_mode
    - bit_depth
    hdr: HLG
    hdr_dpu: HDR_HLG
    transfer: EXYNOS_TRANSFER_HLG
- id: disp-gallery-fhd-sdr-gpu-heavy
  extends: disp-gallery-fhd-sdr-60hz
  design_conditions:
    $unset:
    - color_mode
    dpu_layer_count: 15
    dpu_composer: GPU_FALLBACK
    note: 'layer_count > 12: SurfaceFlinger GPU fallback (RenderThread GLES)'
    design_review: GPU fallback is asserted at 15 layers, but S5E9965 has 16 DPP channels and max_win = 16, so the DPU can
      compose this directly. The real limits are >16 layers, or more than 8 layers needing scale/CSC (only the odd DPPs are
      VG). Confirm the intended trigger and either raise the layer count or state the other reason.
  routing_switch:
    disabled_nodes:
    - m2m_scaler
    disabled_edges:
    - from: storage
      to: dpu
    - from: storage
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    dpu:
      sim:
        composer: GPU_FALLBACK
        layers:
        - name: gpu_composed
          src:
          - 1440
          - 3120
          dst:
          - 1440
          - 3120
          bpp: 32
          note: single RGBA8888 surface produced by SurfaceFlinger
      bw_kb_s:
        bts_read_vote: 1218444
        surface_traffic: 1053000
    gpu:
      selected_mode: Normal
      sim:
        $unset:
        - active
        width: 1920
        height: 1080
        fps: 30
        workload: composition
        input_layers: 15
      bw_kb_s:
        note: GPU traffic is not kernel-declared; see ip-gpu bw_model
        composition_write: 1053000
      model_ref: ip-gpu-s5e9965.capabilities.dvfs_model / power_model
- id: disp-gallery-fhd-sdr-gpu-filter
  extends: disp-gallery-fhd-sdr-gpu-heavy
  design_conditions:
    $unset:
    - design_review
    dpu_layer_count: 6
    blend_mode: custom_filter
    note: DPP 미지원 blend mode (multiply/overlay 등) → GPU 합성
  node_configs:
    gpu:
      sim:
        input_layers: 6
- id: disp-gallery-uhd-hdr10-gpu-fallback
  extends: disp-gallery-fhd-sdr-gpu-filter
  severity: heavy
  design_conditions:
    $unset:
    - blend_mode
    resolution: UHD
    hdr: HDR10
    hdr_dpu: HDR_HDR10
    dpu_layer_count: 20
    note: '썸네일 그리드: 다수 이미지 레이어 동시 합성 → GPU fallback'
    source_resolution: 3840x2160
  node_configs:
    gpu:
      sim:
        width: 3840
        height: 2160
        input_layers: 20
  buffer_overrides:
    STORAGE_GPU_BUF:
      format: RGBA1010102
      bitdepth: 10
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA1010102
      bitdepth: 10
      compression: COMP_OFF
