          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
    m2m_scaler:
      selected_mode: Normal
      sim:
        $unset:
        - active
        src:
        - 1920
        - 1080
        dst:
        - 1440
        - 3120
        fps: 30
        src_bpp: 12
        dst_bpp: 32
        ppc: 4.89
        ppc_row: YUV420
      required_freq_khz: 27563
      dvfs:
        freq_mif_khz: 0
        freq_int_khz: 133000
        freq_mscl_khz: 88000
      bw_kb_s:
        read: 91125
        write: 526500
      model_ref: ip-m2m-scaler-s5e9965.capabilities.perf_model / bw_model
  buffer_overrides:
    STORAGE_M2M_BUF:
      format: YUV422
      bitdepth: 10
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
