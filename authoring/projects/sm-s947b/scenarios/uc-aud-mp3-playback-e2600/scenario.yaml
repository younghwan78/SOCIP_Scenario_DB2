# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-aud-mp3-playback-e2600
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  canonical_usecase: uc-aud-mp3-playback
  name: Audio MP3 Playback
  purpose: "로컬 오디오 재생: UFS 파일 읽기, CPU decode와 DSP offload, speaker/Bluetooth 출력을 비교합니다. 시나리오 이름보다 variant의 실제 format과 offload 조건을 우선하세요."
  review_focus:
  - "CPU decode ↔ DSP offload"
  - "출력 장치"
  - "사용 시간 (mW)"
  category:
  - audio
  - audio
  domain:
  - audio
pipeline:
  nodes:
  - id: storage
    ip_ref: ip-ufs-s5e9965
    role: source
    instance_index: 0
  - id: sw_decoder
    ip_ref: ip-cpu-s5e9965
    role: audio_decode
    instance_index: 0
  - id: dsp_offload
    ip_ref: ip-abox-s5e9965
    role: dsp_offload
    instance_index: 0
  - id: audio_hal
    ip_ref: ip-abox-s5e9965
    role: audio_hal
    instance_index: 0
  - id: speaker
    ip_ref: ip-abox-s5e9965
    role: audio_output
    instance_index: 0
  - id: bt_codec
    ip_ref: ip-abox-s5e9965
    role: bt_output
    instance_index: 0
  - id: abox
    ip_ref: ip-abox-s5e9965
    role: audio_offload
    instance_index: 0
    subsystem:
      model: mcps-v1
      value_source: assumed
      basis: "E2600 ABOX (CA32 x3 + HiFi5, AUD clock) with assumed MCPS and power; replaces the single 20 / 45 Mcycle/s domain load. Levels: the catalog aud_qos_levels_khz"
      units:
      - &ca32 {id: ca32_0, kind: cpu, clock_domain: AUD,
               power: {coeff_uw_per_mhz_v2: 60, idle_gated: 0.5, leakage: {mw_at_ref: 0.6, ref_mv: 750.0, exponent: 2.5},
                       vf: [{mhz: 200, mv: 575}, {mhz: 332, mv: 600}, {mhz: 400, mv: 600}, {mhz: 533, mv: 625},
                  {mhz: 663, mv: 650}, {mhz: 800, mv: 675}, {mhz: 935, mv: 700}, {mhz: 1200, mv: 750},
                  {mhz: 1500, mv: 800}]}}
      - {<<: *ca32, id: ca32_1}
      - {<<: *ca32, id: ca32_2}
      - {id: hifi5, kind: dsp, clock_domain: AUD,
         power: {coeff_uw_per_mhz_v2: 90, idle_gated: 0.5, leakage: {mw_at_ref: 1.2, ref_mv: 750.0, exponent: 2.5},
                 vf: [{mhz: 200, mv: 575}, {mhz: 332, mv: 600}, {mhz: 400, mv: 600}, {mhz: 533, mv: 625},
                  {mhz: 663, mv: 650}, {mhz: 800, mv: 675}, {mhz: 935, mv: 700}, {mhz: 1200, mv: 750},
                  {mhz: 1500, mv: 800}]}}
      - {id: dma, kind: hw, power: {mw: 0.5}}
      - {id: uaif_spk, kind: interface, power: {mw: 0.3}}
      - {id: uaif_bt, kind: interface, power: {mw: 0.3}}
      streams:
      - {id: pb_main, fs_hz: 48000, channels: 2, bits: 16, period_frames: 960, periods: 2, buffer: dram}   # 20 ms deep buffer
      - {id: pb_out, fs_hz: 48000, channels: 2, bits: 32, period_frames: 240, periods: 2, buffer: sram}    # 5 ms ABOX
      stages:
      - {id: rdma, kind: dma, unit: dma, stream: pb_main}
      - {id: decode, kind: codec, unit: hifi5, stream: pb_main, mcps: 18, when_node_enabled: dsp_offload,
         basis: compressed decode on the DSP when the offload path is used (assumed)}
      - {id: mix, kind: mixer, unit: ca32_0, stream: pb_out, mcps: 6}
      - {id: eq, kind: effect, unit: hifi5, stream: pb_out, mcps: 25}
      - {id: spkprot, kind: solution, unit: ca32_1, stream: pb_out, mcps: 12, when_node_enabled: speaker, bind: speaker}
      - {id: out_spk, kind: interface, unit: uaif_spk, stream: pb_out, when_node_enabled: speaker, bind: speaker}
      - {id: out_bt, kind: interface, unit: uaif_bt, stream: pb_out, when_node_enabled: bt_codec, bind: bt_codec}
      edges: [[rdma, mix], [rdma, decode], [decode, mix], [mix, eq], [eq, spkprot], [spkprot, out_spk], [eq, out_bt]]
      routes:
      - {id: pb_speaker, kind: playback, when_node_enabled: speaker, stages: [rdma, mix, eq, spkprot, out_spk],
         latency_target_ms: 60}
      - {id: pb_bt, kind: playback, when_node_enabled: bt_codec, stages: [rdma, mix, eq, out_bt], latency_target_ms: 80}
      wake:
      - {kind: period_irq, stream: pb_main, when_node_enabled: sw_decoder}   # AP decode / mix feeds a 20 ms period: 50 wake/s
      - {kind: refill, every_ms: 2000, mb: 0.4, when_node_enabled: dsp_offload}   # offload: a compressed refill every 2 s
  edges:
  - from: storage
    to: sw_decoder
    type: M2M
    buffer: AUDIO_ES_BUF
  - from: storage
    to: dsp_offload
    type: M2M
    buffer: AUDIO_OFFLOAD_BUF
  - from: sw_decoder
    to: audio_hal
    type: control
  - from: dsp_offload
    to: audio_hal
    type: control
  - from: audio_hal
    to: speaker
    type: control
  - from: audio_hal
    to: bt_codec
    type: control
  buffers:
    AUDIO_ES_BUF:
      format: AUDIO_PCM
      bitdepth: 16
      compression: COMP_OFF
    AUDIO_OFFLOAD_BUF:
      format: AUDIO_PCM
      bitdepth: 16
      compression: COMP_OFF
variants:
  $include: variants.yaml
provenance:
  platform_review: S5E9965 platform (non-camera) driver review 2026-09-16
  note: Node ip_refs, per-variant sim shapes, bw_kb_s, dvfs steps and sw_timing are generated by tools/build_platform_fixture.py
    from the S5E9965 DT/drivers. Variant ids and design_conditions are hand-maintained inputs.
