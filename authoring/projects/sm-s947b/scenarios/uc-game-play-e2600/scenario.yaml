# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-game-play-e2600
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  canonical_usecase: uc-game-play
  name: Game Play
  purpose: "로컬 게임: CPU/GPU 렌더링과 패널 출력 사이의 frame pacing, 해상도 및 목표 fps를 검토합니다. NPU 사용 여부와 render_resolution은 명시된 조건으로만 판단합니다."
  review_focus:
  - "frame pacing"
  - "CPU / GPU 부하"
  - "목표 fps · 해상도"
  category:
  - game
  - game
  domain:
  - game
pipeline:
  nodes:
  - id: cpu
    ip_ref: ip-cpu-s5e9965
    role: cpu
    instance_index: 0
  - id: gpu
    ip_ref: ip-gpu-s5e9965
    role: gpu_renderer
    instance_index: 0
    domain_load:
      model: util-vf-v1
      mcycles_per_frame: 4.0
      ref_pixels: 2073600
      pixel_exponent: 0.8
      target_util: 0.85
      idle_gated: 0.5
      value_source: assumed
      basis: "assumed render work (4 Mcycle per FHD frame); coeff / V-f / leakage = ip-gpu catalog samples"
  - id: npu
    ip_ref: ip-npu-s5e9965
    role: npu
    instance_index: 0
    domain_load:
      model: util-vf-v1
      coeff_uw_per_mhz_v2: 2500
      vf:
      - {mhz: 533, mv: 600}
      - {mhz: 664, mv: 625}
      - {mhz: 800, mv: 650}
      - {mhz: 935, mv: 700}
      - {mhz: 1066, mv: 750}
      - {mhz: 1200, mv: 800}
      leakage: {mw_at_ref: 25.0, ref_mv: 750.0, exponent: 2.5}
      mcycles_per_frame: 10.0
      target_util: 0.85
      idle_gated: 0.7
      value_source: assumed
      basis: "assumed camera AI work (10 Mcycle per frame); NPU coeff / V-f / leakage assumed (not in the catalog)"
  - id: m2m_scaler
    ip_ref: ip-m2m-scaler-s5e9965
    role: m2m_scaler
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: cpu
    to: gpu
    type: control
  - from: gpu
    to: dpu
    type: M2M
    buffer: GPU_DPU_BUF
  - from: gpu
    to: npu
    type: M2M
    buffer: GPU_NPU_BUF
  - from: npu
    to: dpu
    type: M2M
    buffer: NPU_DPU_BUF
  - from: gpu
    to: m2m_scaler
    type: M2M
    buffer: GPU_M2M_BUF
  - from: m2m_scaler
    to: dpu
    type: M2M
    buffer: M2M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    GPU_NPU_BUF:
      format: RGBA8888
      count: 3   # BufferQueue depth (R-5 frame pacing; assumed triple buffering)
      bitdepth: 8
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA8888
      count: 3   # BufferQueue depth (R-5 frame pacing; assumed triple buffering)
      bitdepth: 8
      compression: COMP_OFF
    NPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    GPU_M2M_BUF:
      format: RGBA8888
      count: 3   # BufferQueue depth (R-5 frame pacing; assumed triple buffering)
      bitdepth: 8
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
  # R-1 judgement contract: the frame rate is the variant's target_fps (a request fps still wins).
  # gpu / npu / m2m follow it (no sim.fps); panel and dpu keep their own refresh_hz. design_conditions.fps stays
  # equal to target_fps (the views and the measured replay read it; authoring refuses a mismatch).
  judgement:
    rate:
      condition: target_fps
    sinks:
    - node: dpu
      kind: display
      label: panel
    kpis:
    - interval
    - frame_pacing
    - latency
    # R-6 KPI target (E2600 assumed): jank share of the presented frames
    targets:
    - {id: jank, kpi: frame_pacing, metric: jank_pct, max: 1.0, basis: jank frames per presented frame (assumed)}
variants:
  $include: variants.yaml
provenance:
  platform_review: S5E9965 platform (non-camera) driver review 2026-09-16
  note: Node ip_refs, per-variant sim shapes, bw_kb_s, dvfs steps and sw_timing are generated by tools/build_platform_fixture.py
    from the S5E9965 DT/drivers. Variant ids and design_conditions are hand-maintained inputs.
