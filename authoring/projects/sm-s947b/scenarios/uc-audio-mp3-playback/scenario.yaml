    to: audio_hal
    type: control
  - from: dsp_offload
    to: audio_hal
    type: control
  - from: audio_hal
    to: speaker
    type: control
  - from: audio_hal
    to: bt_codec
    type: control
  buffers:
    AUDIO_ES_BUF:
      format: AUDIO_PCM
      bitdepth: 16
      compression: COMP_OFF
    AUDIO_OFFLOAD_BUF:
      format: AUDIO_PCM
      bitdepth: 16
      compression: COMP_OFF
