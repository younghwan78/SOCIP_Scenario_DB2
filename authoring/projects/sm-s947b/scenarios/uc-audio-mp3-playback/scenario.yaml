# Base scenario (pipeline, anchors, metadata). Variants live in variants.yaml.
id: uc-audio-mp3-playback
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: Audio MP3 Playback
  category:
  - audio
  - audio
  domain:
  - audio
pipeline:
  nodes:
  - id: storage
    ip_ref: ip-ufs-s5e9965
    role: source
    instance_index: 0
  - id: sw_decoder
    ip_ref: ip-cpu-s5e9965
    role: audio_decode
    instance_index: 0
  - id: dsp_offload
    ip_ref: ip-abox-s5e9965
    role: dsp_offload
    instance_index: 0
  - id: audio_hal
    ip_ref: ip-abox-s5e9965
    role: audio_hal
    instance_index: 0
  - id: speaker
    ip_ref: ip-abox-s5e9965
    role: audio_output
    instance_index: 0
  - id: bt_codec
    ip_ref: ip-abox-s5e9965
    role: bt_output
    instance_index: 0
  - id: abox
    ip_ref: ip-abox-s5e9965
    role: audio_offload
    instance_index: 0
  edges:
  - from: storage
    to: sw_decoder
    type: M2M
    buffer: AUDIO_ES_BUF
  - from: storage
    to: dsp_offload
    type: M2M
    buffer: AUDIO_OFFLOAD_BUF
