# Compact variants: root entries are complete; `extends: <id>` entries are a
# deep-merge patch over that variant (`$unset: [keys]` removes keys).
# node sim width/height come from sizes.yaml; sw_timing from sw_timing.yaml.
- id: cam-prev-r1-30
  severity: light
  design_conditions:
    subscenario: STILL_PREVIEW
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_PHOTO
    sensor_place: rear
    camera_mode: single
    fps: 30
    hdr: SDR
    stabilization: false
    extend_mode: EX_NONE
    super_night: false
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - sensor_rear3
    - sensor_front
    - npu
    - eis
    disabled_edges:
    - from: sensor_rear2
      to: csispdp
    - from: sensor_rear3
      to: csispdp
    - from: sensor_front
      to: csispdp
    - from: csispdp
      to: npu
    - from: npu
      to: mtnr
    - from: mcsc
      to: eis
    - from: eis
      to: gdc_m
  node_configs:
    csispdp:
      selected_mode: Normal
      sim:
        inherit_shape: true
    mtnr:
      selected_mode: Normal
      sim:
        inherit_shape: true
      mode_label: Preview
      mode_note: IS v15 MTNR operating modes are Normal / Recording / HighSpeed / LowPower; the scenario label 'Preview' is
        kept in mode_label and the Normal coefficients are used (E2600 assumption).
    n3aa:
      sim:
        inherit_shape: true
    byrp:
      sim:
        inherit_shape: true
    rgbp:
      sim:
        inherit_shape: true
    yuvsc:
      sim:
        inherit_shape: true
    msnr:
      sim:
        inherit_shape: true
    yuvp:
      sim:
        inherit_shape: true
    mcsc:
      sim:
        inherit_shape: true
    gdc_m:
      sim:
        inherit_shape: true
    dpu:
      sim:
        inherit_shape: true
  size_overrides:
    sensor_out: 8000x6000
- id: cam-prev-r1-60
  extends: cam-prev-r1-30
  $unset:
  - size_overrides
  severity: medium
  design_conditions:
    $unset:
    - stabilization
    - super_night
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_PHOTO_60
    fps: 60
  node_configs:
    mtnr:
      $unset:
      - selected_mode
      - mode_label
      - mode_note
    sensor_rear:
      selected_mode: binning_4x4
- id: cam-prev-r1-full-res
  extends: cam-prev-r1-60
  severity: light
  design_conditions:
    $unset:
    - camera_mode
    - hdr
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_PHOTO_FULL
    fps: 30
    note: remosaic 캡처 직전 sensor full-size 프리뷰
  node_configs:
    csispdp:
      $unset:
      - selected_mode
    sensor_rear:
      selected_mode: binning_2x2
  size_overrides:
    sensor_out: 8000x6000
- id: cam-prev-r1-remosaic
  extends: cam-prev-r1-full-res
  design_conditions:
    $unset:
    - note
    subscenario: STILL_REMOSAIC_PREVIEW
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_REMOSAIC_PHOTO
    fps: 10
    extend_mode: EX_SEAMLESS_TETRA
    is_scenario: IS_SCENARIO_FULL_SIZE
    fps_basis: full_remosaic streams at 10 fps (ip-sensor-rear catalog); the session is judged at the sensor rate, not at
      30 fps
  node_configs:
    mtnr:
      selected_mode: Normal
      mode_label: Remosaic
      mode_note: IS v15 MTNR operating modes are Normal / Recording / HighSpeed / LowPower; the scenario label 'Remosaic'
        is kept in mode_label and the Normal coefficients are used (E2600 assumption).
    sensor_rear:
      selected_mode: full_remosaic
  size_overrides:
    sensor_out: 16384x12288
- id: cam-prev-r1-ai-remosaic
  extends: cam-prev-r1-remosaic
  design_conditions:
    $unset:
    - dvfs_sn
    - is_scenario
    extend_mode: EX_AI_REMOSAIC
    npu_used: true
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - sensor_rear3
    - sensor_front
    - eis
    disabled_edges:
    - from: sensor_rear2
      to: csispdp
    - from: sensor_rear3
      to: csispdp
    - from: sensor_front
      to: csispdp
    - from: mcsc
      to: eis
    - from: eis
      to: gdc_m
  node_configs:
    npu:
      selected_mode: Normal
- id: cam-prev-r1-night
  extends: cam-prev-r1-full-res
  design_conditions:
    $unset:
    - dvfs_sn
    - note
    subscenario: STILL_SUPER_NIGHT_PREVIEW
    extend_mode: EX_NIGHT
    super_night: true
  node_configs:
    $unset:
    - sensor_rear
- id: cam-prev-r1-night-max
  extends: cam-prev-r1-night
  design_conditions:
    super_night: max
- id: cam-prev-r1-crop-zoom
  extends: cam-prev-r1-full-res
  design_conditions:
    $unset:
    - dvfs_sn
    - note
    extend_mode: EX_CROP_ZOOM
    freeform_sensor_crop: true
  node_configs:
    $unset:
    - sensor_rear
    csispdp:
      freeform_crop: true
- id: cam-prev-r1-dcg
  extends: cam-prev-r1-full-res
  design_conditions:
    $unset:
    - dvfs_sn
    - note
    extend_mode: EX_DCG
  node_configs:
    $unset:
    - sensor_rear
- id: cam-prev-r1-ln
  extends: cam-prev-r1-dcg
  design_conditions:
    extend_mode: EX_LN
- id: cam-prev-r1-3dhdr
  extends: cam-prev-r1-dcg
  design_conditions:
    extend_mode: EX_3DHDR
  node_configs:
    csispdp:
      sim:
        mode: Normal
      selected_mode: VC_DT
      mode_note: IS v15 catalog has no 'VC_DT' mode; the catalog Normal coefficients are used (E2600 assumption). Mode-specific
        coefficients belong in sim.ip_params when known.
