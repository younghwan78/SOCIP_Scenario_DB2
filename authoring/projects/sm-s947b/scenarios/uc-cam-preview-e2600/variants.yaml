    - from: npu
      to: mtnr
    - from: mcsc
      to: eis
    - from: eis
      to: gdc_m
  node_configs:
    csispdp:
      sim:
        inherit_shape: true
    n3aa:
      sim:
        inherit_shape: true
    byrp:
      sim:
        inherit_shape: true
    rgbp:
      sim:
        inherit_shape: true
    yuvsc:
      sim:
        inherit_shape: true
    mtnr:
      sim:
        inherit_shape: true
    msnr:
      sim:
        inherit_shape: true
    yuvp:
      sim:
        inherit_shape: true
    mcsc:
      sim:
        inherit_shape: true
    gdc_m:
      sim:
        inherit_shape: true
    dpu:
      sim:
        inherit_shape: true
  size_overrides:
    sensor_out: 8000x6000
- id: cam-prev-r1-expert-raw
  extends: cam-prev-r1-dcg
