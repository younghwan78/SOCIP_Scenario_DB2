    ip_ref: ip-isp-s5e9965
    role: gdc_preview
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: sensor_rear
    to: csispdp
    type: OTF
  - from: sensor_rear2
    to: csispdp
    type: OTF
  - from: sensor_rear3
    to: csispdp
    type: OTF
  - from: sensor_front
    to: csispdp
    type: OTF
