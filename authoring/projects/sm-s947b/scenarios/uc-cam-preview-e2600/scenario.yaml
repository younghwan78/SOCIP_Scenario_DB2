    to: yuvsc
    type: OTF
  - from: yuvsc
    to: mtnr
    type: M2M
    buffer: YUVSC_MTNR_BUF
  - from: mtnr
    to: msnr
    type: OTF
  - from: msnr
    to: yuvp
    type: OTF
  - from: yuvp
    to: mcsc
    type: OTF
  - from: csispdp
    to: n3aa
    type: M2M
    buffer: CSISPDP_3AA_BUF
  - from: csispdp
    to: npu
    type: M2M
    buffer: CSISPDP_NPU_BUF
  - from: npu
    to: mtnr
    type: M2M
    buffer: NPU_MTNR_BUF
  - from: mcsc
    to: gdc_m
    type: M2M
    buffer: MCSC_WDMA_PREV_BUF
  - from: mcsc
    to: eis
    type: M2M
    buffer: MCSC_WDMA_PREV_BUF
  - from: eis
    to: gdc_m
    type: M2M
    buffer: EIS_GDC_M_BUF
  - from: gdc_m
    to: dpu
    type: M2M
    buffer: GDC_M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    YUVSC_MTNR_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: M2M break — multi-frame TNR input
    CSISPDP_3AA_BUF:
      format: BAYER
      bitdepth: 10
      compression: COMP_OFF
      note: 3A stats sidecar
    CSISPDP_NPU_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: AI remosaic / AI-AF NPU input
    NPU_MTNR_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: NPU → MTNR AI pre-processed
    MCSC_WDMA_PREV_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: MCSC OUTPUT0 preview WDMA — larger than display (EIS margin)
    EIS_GDC_M_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_OFF
      note: EIS warp map + frame → GDC_M
    GDC_M_DPU_BUF:
      format: YUV420
      bitdepth: 10
      compression: COMP_YUV_LOSSLESS
      note: GDC_M crop/warp output → DPU (SBWC zero-copy)
variants:
  $include: variants.yaml
