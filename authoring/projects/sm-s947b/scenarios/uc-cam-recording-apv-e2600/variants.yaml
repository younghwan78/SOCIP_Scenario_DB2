    apv_enc_profile: 1
    record_bitrate_mbps: 1500.0
  node_configs:
    apv_enc:
      sim:
        format: YUV444
      chroma_format_idc: 2
      enc_profile: 1
  buffer_overrides:
    MCSC_VIDEO:
      format: YUV444
    GDC_VIDEO:
