# Compact variants: root entries are complete; `extends: <id>` entries are a
# deep-merge patch over that variant (`$unset: [keys]` removes keys).
# node sim width/height come from sizes.yaml; sw_timing from sw_timing.yaml.
- id: cam-rec-apv-uhd30-422-sdr
  severity: heavy
  design_conditions:
    subscenario: UHD_VIDEO
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_VIDEO_UHD30
    sensor_place: rear
    resolution: UHD
    fps: 30
    hdr: SDR
    codec_mfc: HEVC_ENC
    dpu_layer_count: 3
    is_version: 15
    sw_timing_case: mean
    sw_timing_source: assumed
    sensor_board: m2s-GNG
    mcsc_dma_channels: 2
    sensor_input_fps: 30.0
    sensor_bitwidth: 10
    sensor_input_source: user_confirmed
    apv_chroma_format_idc: 1
    apv_chroma_format: '4:2:2'
    apv_band_idc: 0
    apv_enc_profile: 0
    priority_recording: true
    encoder_hw: APV
    sensor_runtime_confirmation: true
    record_bitrate_mbps: 1000.0
    bitrate_source: assumed
    writer_model: linear_bitrate_wall_time
    storage_model: sustained_write_assumed
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - sensor_rear3
    - sensor_front
    - vps_dof
    - vps_seg
    - eis
    - gdc_m
    - gdc_o
  node_configs:
    apv_enc:
      selected_mode: Normal
      codec: HEVC_ENC
      sim:
        inherit_shape: true
        format: YUV422
      chroma_format_idc: 1
      band_idc: 0
      enc_profile: 0
      memory_io:
      - port: APV_WDMA_BITSTREAM
        direction: write
        bitrate_condition: record_bitrate_mbps
    yuvsc:
      operations:
        scale: false
      bypass_downscale: true
      sim:
        inherit_shape: true
    mcsc:
      operations:
        crop: true
        scale: true
      active_output_ports:
      - MCSC_WDMA_W0
      - MCSC_WDMA_W1
      sim:
        inherit_shape: true
    byrp:
      video_snapshot_enabled: false
      stat_dma_note: IS_LVN_BYRP0_BYR / BYRP_WDMA_BYR dumps full sensor size when video_snapshot_enabled; OTF remains connected.
      sim:
        inherit_shape: true
    vps_od:
      selected_mode: Normal
      function: object_detection
      sim:
        inherit_shape: true
    lme:
      selected_mode: Normal
      sim:
        inherit_shape: true
    sensor_rear:
      selected_mode: cis_4sum_ln4_raw10_4080x2296_30fps_3993msps
    csis:
      sim:
        inherit_shape: true
    pdp:
      sim:
        inherit_shape: true
    rgbp:
      sim:
        inherit_shape: true
    mlsc:
      sim:
        inherit_shape: true
    mtnr:
      sim:
        inherit_shape: true
    msnr:
      sim:
        inherit_shape: true
    yuvp:
      sim:
        inherit_shape: true
    gdc_m:
      sim:
        inherit_shape: true
      operations:
        crop: true
    gdc_o:
      sim:
        inherit_shape: true
      operations:
        crop: true
    dpu:
      sim:
        inherit_shape: true
    mpeg_writer:
      sw_bitrate_scaling:
        reference_bitrate_mbps: 1000
      memory_io:
      - port: CPU_BITSTREAM_READ
        direction: read
        bitrate_condition: record_bitrate_mbps
      - port: CPU_BITSTREAM_WRITE
        direction: write
        bitrate_condition: record_bitrate_mbps
      timeline_resource_id: CPU_WRITER
      source_note: Engineering assumption approved for fixture exploration; replace with internal measurements.
    storage_write:
      sw_bitrate_scaling:
        reference_bitrate_mbps: 1000
      timeline_resource_id: STORAGE_IO
      memory_io:
      - port: STORAGE_BITSTREAM_READ
        direction: read
        bitrate_condition: record_bitrate_mbps
      source_note: I/O completion wall time, not CPU active execution; no UFS capacity sign-off. Engineering assumption approved
        for fixture exploration; replace with internal measurements.
  topology_patch:
    add_edges:
    - from: mcsc
      to: dpu
      type: M2M
      buffer: MCSC_PREVIEW
      port_pairs:
      - src: MCSC_WDMA_W0
        dst: DPU_RDMA
    - from: mcsc
      to: apv_enc
      type: M2M
      buffer: MCSC_VIDEO
      port_pairs:
      - src: MCSC_WDMA_W1
        dst: APV_RDMA_FRAME
    - from: apv_enc
      to: mpeg_writer
      type: control
    - from: mpeg_writer
      to: storage_write
      type: control
    add_nodes:
    - id: mpeg_writer
      ip_ref: ip-cpu-s5e9965
      role: sw_task
      instance_index: 0
    - id: storage_write
      ip_ref: ip-cpu-s5e9965
      role: sw_task
      instance_index: 0
  size_overrides:
    sensor_full: 4080x2296
    record_out: 3840x2160
    preview_out: 1920x1080
    pyramid_l0: 4080x2296
    pyramid_l1: 2040x1148
    pyramid_l2: 1020x574
    pyramid_l3: 510x287
    pyramid_l4: 255x144
    object_detection: 512x288
    cav: 320x180
    mlsc_out: 4080x2296
  buffer_overrides:
    MCSC_VIDEO:
      format: YUV422
      bitdepth: 10
    GDC_VIDEO:
      format: YUV422
      bitdepth: 10
  tags:
  - is-v15
  - assumed-sw-timing
  - uncalibrated-power
- id: cam-rec-apv-uhd30-444-sdr
