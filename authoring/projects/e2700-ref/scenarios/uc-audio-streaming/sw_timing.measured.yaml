  group: network-a
  baseline:
    min_ms: 0.5
    mean_ms: 1.0
    max_ms: 3.0
  timing: null
- task: sw_decoder
  group: sw_decoder-a
  baseline:
    min_ms: 1.5
    mean_ms: 3.0
    max_ms: 6.0
  timing: null
