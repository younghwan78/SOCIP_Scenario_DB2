# Measured SW timing slots. Fill `timing` (e.g. from semantic Perfetto) and keep
# `baseline` as reference. `timing: null` = pending (compiler keeps baseline).
# `group` = group id in the inherited sw_timing.yaml. Narrow further with
# `when: {resolution: UHD}` or an explicit `variants` list; later entries win.
# Example timing: {min_ms: 0.2, mean_ms: 0.4, max_ms: 0.7, value_source: measured,
#                  source_note: 'perfetto <trace id>'}
kind: authoring.sw_timing_measured
