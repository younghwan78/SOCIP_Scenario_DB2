# Exynos2700 reference project = S26+ (sm-s947b) baseline on the exynos2700 platform.
# Scenarios, variants, SW task graph and sensor sizes are inherited. Deltas:
#   scenarios/<parent uc id>/overlay.yaml          structural/variant deltas (see docs)
#   scenarios/<parent uc id>/sw_timing.measured.yaml  measured SW timing (python -m scenario_db.authoring worksheet e2700-ref)
#   patches/<doc id>.yaml                           project-scoped doc patches (sim config profile ...)
kind: authoring.project
key: e2700-ref
platform: exynos2700
extends: sm-s947b
rename:
- from: proj-sm-s947b
  to: proj-e2700-ref
scenario_rename:
  suffix: -e2700
document_patch:
  metadata:
    name: Exynos2700 Reference (S26+ baseline)
    board_type: E2700-REF
    board_name: Exynos2700 reference (S26+ pipeline baseline)
scenarios:
  include: '*'
  exclude: []
