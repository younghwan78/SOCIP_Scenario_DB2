      apv bw_enc / bw_dec (same KB-per-UHD-frame convention as MFC)'
    unit: KB/s
    table_unit: KB per UHD frame (32400 macroblocks)
    formula:
    - bw_x = table[dir].x * ceil(w/16) * ceil(h/16) * fps / 32400
    tables:
      non_sbwc:
        ENC:
          peak: 45456
          read: 56112
          write: 11170
        DEC:
          peak: 32605
          read: 34381
          write: 21263
      sbwc:
