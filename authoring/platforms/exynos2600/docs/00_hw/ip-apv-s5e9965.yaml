          peak: 31622
          read: 32183
          write: 7065
        DEC:
          peak: 23757
          read: 18603
          write: 13620
    note: The APV DT reuses the MFC H.264 numbers for its BW table, so these are a
      placeholder in the kernel too. 4:4:4 and 10/12-bit traffic is not reflected;
      scale by the source format when it matters.
