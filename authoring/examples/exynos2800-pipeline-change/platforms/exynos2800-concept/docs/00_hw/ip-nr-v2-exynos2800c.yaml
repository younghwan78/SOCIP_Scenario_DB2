    - {name: MTNR0_RDMA_PREV_L0_WGT, type: DMA, direction: read}
    - {name: MTNR0_RDMA_PREV_L0_Y, type: DMA, direction: read}
    - {name: MTNR0_RDMA_PREV_L0_Y_1, type: DMA, direction: read}
    - {name: MTNR0_RDMA_SEG_L0, type: DMA, direction: read}
