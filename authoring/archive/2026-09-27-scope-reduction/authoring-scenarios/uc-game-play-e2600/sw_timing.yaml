# SW task timing table. `variants: '*'` = every variant not listed in another
# group and not in absent_in. Measured overrides go in the project's
# sw_timing.measured.yaml, not here.
known_variants:
- game-fhd-60fps-sdr
- game-fhd-90fps-sdr
- game-fhd-120fps-sdr
- game-uhd-60fps-sdr
- game-fhd-60fps-npu-ai
- game-fhd-120fps-hdr10
- game-fhd-60fps-m2m-upscale
- game-fhd-60fps-gpu-heavy-overlay
tasks:
  cpu:
    groups:
    - id: cpu-a
      variants: '*'
      timing:
        min_ms: 2.0
        mean_ms: 4.0
        max_ms: 8.0
        start_latency_ref: frame_start
        start_latency_mean_ms: 0.0
        rate_hz: 60.0
        cpu_affinity: CPUCL3
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
    - id: cpu-b
      variants:
      - game-fhd-90fps-sdr
      timing:
        min_ms: 2.0
        mean_ms: 4.0
        max_ms: 8.0
        start_latency_ref: frame_start
        start_latency_mean_ms: 0.0
        rate_hz: 90.0
        cpu_affinity: CPUCL3
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
    - id: cpu-c
      variants:
      - game-fhd-120fps-sdr
      - game-fhd-120fps-hdr10
      timing:
        min_ms: 2.0
        mean_ms: 4.0
        max_ms: 8.0
        start_latency_ref: frame_start
        start_latency_mean_ms: 0.0
        rate_hz: 120.0
        cpu_affinity: CPUCL3
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
  gpu:
    groups:
    - id: gpu-a
      variants: '*'
      timing:
        min_ms: 1.0
        mean_ms: 2.0
        max_ms: 4.0
        start_latency_ref: layers_ready
        start_latency_mean_ms: 0.5
        rate_hz: 60.0
        cpu_affinity: CPUCL2
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
    absent_in:
    - game-fhd-60fps-sdr
    - game-fhd-90fps-sdr
    - game-fhd-120fps-sdr
    - game-uhd-60fps-sdr
    - game-fhd-60fps-npu-ai
    - game-fhd-120fps-hdr10
    - game-fhd-60fps-m2m-upscale
