# Opt-in host-root React deployment. Not loaded by scripts/dev_up.sh.
# Copy the build's contents into this dedicated static root; never use the repository root.
# Install in one nginx http-context include (sites-enabled OR conf.d).
server {
    listen 80;
    server_name scenariodb.internal;
    root /opt/scenariodb/ui/current;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header X-ScenarioDB-Key-Id $http_x_scenariodb_key_id;
    proxy_set_header X-ScenarioDB-API-Key $http_x_scenariodb_api_key;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
    proxy_cache off;
    proxy_intercept_errors off;
    # Preserve API failures/429 + Retry-After. Never replay calculations or writes in nginx.
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    # Example idle-between-I/O limits, NOT a calculation deadline or UI admission budget.
    # Review these with measured longest calculations before enabling this opt-in site.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # No URI suffix: preserve /api/v1/... and query strings exactly.
    location ^~ /api/ { proxy_pass http://127.0.0.1:18000; }
    location = /api { proxy_pass http://127.0.0.1:18000; }
    location ^~ /health/ { proxy_pass http://127.0.0.1:18000; }
    location = /health { proxy_pass http://127.0.0.1:18000; }
    location = /docs { proxy_pass http://127.0.0.1:18000; }
    location ^~ /docs/ { proxy_pass http://127.0.0.1:18000; }
    location = /redoc { proxy_pass http://127.0.0.1:18000; }
    location = /openapi.json { proxy_pass http://127.0.0.1:18000; }

    # Existing optional Streamlit route. Only usable when that viewer is running.
    location ^~ /viewer/ {
        proxy_pass http://127.0.0.1:18502/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /\. { deny all; }
    # Only successful content-addressed Vite assets get an immutable cache lifetime.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
