version: "1.0"
metrics:
  power.total:
    category: power
    canonical_unit: mW
    allowed_scopes: [scenario]
    compare_statistic: mean
    polarity: lower_is_better
    kpi_key: total_power_mw
  power.rail:
    category: power
    canonical_unit: mW
    allowed_scopes: [rail]
    compare_statistic: mean
    polarity: lower_is_better
  power.rail_voltage:
    category: power
    canonical_unit: V
    allowed_scopes: [rail]
    compare_statistic: mean
    polarity: neutral
  power.rail_current:
    category: power
    canonical_unit: mA
    allowed_scopes: [rail]
    compare_statistic: mean
    polarity: lower_is_better
  # Declared join key between simulation VDD rails and measured PMIC bucks:
  # measurement rails carry an explicit `domain`, simulation rails default to
  # their own (logical) rail name. Rolled up as the sum of member rail means.
  power.domain:
    category: power
    canonical_unit: mW
    allowed_scopes: [power_domain]
    compare_statistic: mean
    polarity: lower_is_better
  # Per-CPU-cluster power: measurement side from cpu_breakdown (rail rollup),
  # prediction side from power_breakdown.cpu.by_cluster once the CPU model lands.
  power.cluster:
    category: power
    canonical_unit: mW
    allowed_scopes: [cluster]
    compare_statistic: mean
    polarity: lower_is_better
  # Per-IP power: prediction side from ip_breakdown — the primary
  # calibration axis for the IP power model.
  power.ip:
    category: power
    canonical_unit: mW
    allowed_scopes: [ip]
    compare_statistic: mean
    polarity: lower_is_better
  bandwidth.total:
    category: bandwidth
    canonical_unit: MB/s
    allowed_scopes: [scenario]
    compare_statistic: mean
    polarity: neutral
    kpi_key: total_bw_mbs
  bandwidth.read:
    category: bandwidth
    canonical_unit: MB/s
    allowed_scopes: [dma_port, ip]
    compare_statistic: p95
    polarity: neutral
  bandwidth.write:
    category: bandwidth
    canonical_unit: MB/s
    allowed_scopes: [dma_port, ip]
    compare_statistic: p95
    polarity: neutral
  bandwidth.otf:
    category: bandwidth
    canonical_unit: MB/s
    allowed_scopes: [dma_port, ip]
    compare_statistic: p95
    polarity: neutral
  latency.frame:
    category: latency
    canonical_unit: ms
    allowed_scopes: [scenario]
    compare_statistic: p95
    polarity: lower_is_better
    kpi_key: frame_latency_ms
  latency.stage:
    category: latency
    canonical_unit: ms
    allowed_scopes: [pipeline_stage, ip]
    compare_statistic: p95
    polarity: lower_is_better
  camera.fps:
    category: camera
    canonical_unit: fps
    allowed_scopes: [scenario]
    compare_statistic: mean
    polarity: higher_is_better
    kpi_key: fps_effective
  camera.frame_drop:
    category: camera
    canonical_unit: count
    allowed_scopes: [scenario]
    compare_statistic: value
    polarity: lower_is_better
    kpi_key: frame_drop_count
  sw.runtime:
    category: sw_timing
    canonical_unit: ms
    allowed_scopes: [task, thread]
    compare_statistic: p95
    polarity: lower_is_better
  sw.runtime_jitter:
    category: sw_timing
    canonical_unit: us
    allowed_scopes: [task, thread]
    compare_statistic: p95
    polarity: lower_is_better
  sw.start_jitter:
    category: sw_timing
    canonical_unit: us
    allowed_scopes: [task, thread]
    compare_statistic: p95
    polarity: lower_is_better
  sw.deadline_miss:
    category: sw_timing
    canonical_unit: count
    allowed_scopes: [task, thread]
    compare_statistic: value
    polarity: lower_is_better
  hw.runtime:
    category: hw_timing
    canonical_unit: ms
    allowed_scopes: [node, task]
    compare_statistic: mean
    polarity: lower_is_better
  sw.start_latency:
    category: sw_timing
    canonical_unit: ms
    allowed_scopes: [event_pair]
    compare_statistic: mean
    polarity: lower_is_better
  # --- PMU-derived metrics (meas_import/pmu_digest.py) ---
  # Effective IP clock: stats.mean is the residency-weighted mean; the
  # dominant (highest-residency) level is its own metric. Prediction side is
  # the resolved set clock (dvfs_breakdown), which feeds the clock ledger.
  clock.ip:
    category: clock
    canonical_unit: MHz
    allowed_scopes: [ip]
    compare_statistic: mean
    polarity: neutral
  clock.ip_dominant:
    category: clock
    canonical_unit: MHz
    allowed_scopes: [ip]
    compare_statistic: value
    polarity: neutral
  # Time share at one DVFS level (scope ref "<ip>@<MHz>"); keeps the level
  # distribution so power is not evaluated at a snapped-up mean clock.
  clock.ip_residency:
    category: clock
    canonical_unit: ratio
    allowed_scopes: [ip_freq]
    compare_statistic: value
    polarity: neutral
  # Memory-controller (MIF / DRAM) traffic. Measured includes CPU/GPU/other
  # masters; the prediction side only covers modelled IP DMA, so the gap is
  # the non-IP traffic.
  bandwidth.mem_read:
    category: bandwidth
    canonical_unit: MB/s
    allowed_scopes: [mif, dram]
    compare_statistic: mean
    polarity: neutral
  bandwidth.mem_write:
    category: bandwidth
    canonical_unit: MB/s
    allowed_scopes: [mif, dram]
    compare_statistic: mean
    polarity: neutral
  cpu.cycles:
    category: cpu
    canonical_unit: count
    allowed_scopes: [cluster]
    compare_statistic: value
    polarity: neutral
  cpu.instructions:
    category: cpu
    canonical_unit: count
    allowed_scopes: [cluster]
    compare_statistic: value
    polarity: neutral
  cpu.ipc:
    category: cpu
    canonical_unit: ipc
    allowed_scopes: [cluster]
    compare_statistic: value
    polarity: higher_is_better
  # --- Per-frame CPU profile (sim/cpu_profile.py): measured placement ---
  # Counters are normalised by the capture window (frames) at import.
  cpu.cycles_pf:
    category: cpu
    canonical_unit: count
    allowed_scopes: [task_cluster, cluster]
    compare_statistic: value
    polarity: neutral
  cpu.instructions_pf:
    category: cpu
    canonical_unit: count
    allowed_scopes: [task_cluster, cluster]
    compare_statistic: value
    polarity: neutral
  cpu.stall_cycles_pf:
    category: cpu
    canonical_unit: count
    allowed_scopes: [task_cluster, cluster]
    compare_statistic: value
    polarity: neutral
  cpu.bus_bytes_pf:
    category: cpu
    canonical_unit: bytes
    allowed_scopes: [task_cluster, cluster]
    compare_statistic: value
    polarity: neutral
  # Time share at one cluster frequency (scope ref "<cluster>@<MHz>").
  cpu.freq_residency:
    category: cpu
    canonical_unit: ratio
    allowed_scopes: [cluster_freq]
    compare_statistic: value
    polarity: neutral
  cpu.clock_gated_ratio:
    category: cpu
    canonical_unit: ratio
    allowed_scopes: [cluster]
    compare_statistic: value
    polarity: neutral
  cpu.power_gated_ratio:
    category: cpu
    canonical_unit: ratio
    allowed_scopes: [cluster]
    compare_statistic: value
    polarity: neutral
  cpu.active_ratio:
    category: cpu
    canonical_unit: ratio
    allowed_scopes: [cluster]
    compare_statistic: value
    polarity: neutral
