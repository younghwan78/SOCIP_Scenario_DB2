id: ip-dpu-v9
schema_version: "2.2"
kind: ip
category: display
rtl_version: "9.0"
compatible_soc:
  - soc-exynos2500

hierarchy:
  type: simple

capabilities:
  operating_modes:
    - id: normal
      throughput_mpps: 800
    - id: low_power
      throughput_mpps: 400

  supported_features:
    bitdepth: [8, 10]
    hdr_formats: [HDR10, HDR10plus, DolbyVision]
    compression: [AFBC_v2, SBWC_v4]
  sim:
    hw_name: DPU
    source: legacy_project_info_csv
    source_project: A
    modes:
      Normal:
        unit_power_mw_mp: 1.0
        idc: 0.0
        ppc: 4.0
        vdd: VDD_INT
        dvfs_group: INT
  properties:
    legacy_name: DPU
    modules:
    - name: DPU_RDMA
      type: DMA
      direction: read
      role: layer_input
      max_bandwidth: 4096000000
      supported_compressions:
      - SBWC_v4
