id: ip-isp-v12
schema_version: "2.2"
kind: ip
category: camera
rtl_version: "12.0"
compatible_soc:
  - soc-exynos2500

hierarchy:
  type: composite
  submodules:
    - ref: sub-3aa-v4
      instance_id: ISP.3AA0
    - ref: sub-tnr-v3
      instance_id: ISP.TNR
    - ref: sub-dns-v2
      instance_id: ISP.DNS

capabilities:
  operating_modes:
    - id: normal
      throughput_mpps: 500
    - id: low_power
      max_clock_mhz: 266.0
      throughput_mpps: 250
    - id: high_throughput
      min_clock_mhz: 533.0
      throughput_mpps: 800

  supported_features:
    bitdepth: [8, 10, 12]
    hdr_formats: [HDR10, HDR10plus, DolbyVision]
    compression: [SBWC_v4, AFBC_v2]
  properties:
    ip_group: ISP
    subblocks:
    - PDP
    - PREP
    - CSTAT
    - BYRP
    - RGBP
    - MLSC
    - MTNR0
    - MTNR1
    - MSNR
    - YUVP
    - MCSC
    pipeline_description: 'OTF: PREP -> CSTAT, BYRP -> RGBP -> MLSC

      M2M: CSIS => BYRP (COMP_RD0_RDMA), MLSC pyramid => MTNR0/MTNR1 via postIRTA

      OTF: MTNR0/MTNR1 -> MSNR -> YUVP -> MCSC

      '
    modules:
    - name: COMP_RD0_RDMA
      type: DMA
      direction: read
      max_bandwidth: 8192000000
      supported_compressions:
      - SBWC_v4
    - name: L0_WDMA
      type: DMA
      direction: write
      role: pyramid_l0_output
      max_bandwidth: 4096000000
    - name: L1_WDMA
      type: DMA
      direction: write
      role: pyramid_l1_output
      max_bandwidth: 2048000000
    - name: L2_WDMA
      type: DMA
      direction: write
      role: pyramid_l2_output
      max_bandwidth: 1024000000
    - name: L3_WDMA
      type: DMA
      direction: write
      role: pyramid_l3_output
      max_bandwidth: 1024000000
    - name: G4_WDMA
      type: DMA
      direction: write
      role: pyramid_g4_output
      max_bandwidth: 1024000000
    - name: L0_RDMA
      type: DMA
      direction: read
      role: pyramid_l0_input
      max_bandwidth: 4096000000
    - name: L1_RDMA
      type: DMA
      direction: read
      role: pyramid_l1_input
      max_bandwidth: 2048000000
    - name: L2_RDMA
      type: DMA
      direction: read
      role: pyramid_l2_input
      max_bandwidth: 1024000000
    - name: L3_RDMA
      type: DMA
      direction: read
      role: pyramid_l3_input
      max_bandwidth: 1024000000
    - name: G4_RDMA
      type: DMA
      direction: read
      role: pyramid_g4_input
      max_bandwidth: 1024000000
    - name: P0_WDMA
      type: DMA
      direction: write
      role: record_output
      max_bandwidth: 4096000000
      supported_compressions:
      - SBWC_v4
    - name: P1_WDMA
      type: DMA
      direction: write
      role: preview_output
      max_bandwidth: 4096000000
  sim:
    hw_name: ISP
    source: legacy_project_info_csv
    source_project: A
    source_note: projectA_info.csv has BYRP/RGBP/YUVP/MLSC/MCSC rows, but no aggregate ISP row.
    modes:
      Normal:
        unit_power_mw_mp: 0.0
        idc: 0.0
        ppc: 0.0
        vdd: VDD_CAM
        dvfs_group: CAM
    role_modes:
      main:
        hw_name: ISP
        modes:
          normal:
            unit_power_mw_mp: 9.92
            idc: 0.0
            ppc: 4.0
            vdd: VDD_CAM
            dvfs_group: CAM
          Normal:
            unit_power_mw_mp: 9.92
            idc: 0.0
            ppc: 4.0
            vdd: VDD_CAM
            dvfs_group: CAM
      isp0:
        hw_name: ISP
        modes:
          normal:
            unit_power_mw_mp: 9.92
            idc: 0.0
            ppc: 4.0
            vdd: VDD_CAM
            dvfs_group: CAM
          Normal:
            unit_power_mw_mp: 9.92
            idc: 0.0
            ppc: 4.0
            vdd: VDD_CAM
            dvfs_group: CAM
