id: ip-csis-v8
schema_version: "2.2"
kind: ip
category: camera
rtl_version: "8.0"
compatible_soc:
  - soc-exynos2500

hierarchy:
  type: simple

capabilities:
  operating_modes:
    - id: normal
      throughput_mpps: 600
    - id: low_power
      throughput_mpps: 300
  sim:
    hw_name: CSIS
    source: legacy_project_info_csv
    source_project: A
    modes:
      Normal:
        unit_power_mw_mp: 0.21
        idc: 0.0
        ppc: 8.0
        vdd: VDD_CAM
        dvfs_group: CSIS
  properties:
    legacy_name: CSIS
    modules:
    - name: CSIS_WDMA
      type: DMA
      direction: write
      max_bandwidth: 8192000000
      supported_compressions:
      - SBWC_v4
    - name: LINK
      type: FIFO
      direction: write
    - name: NFI_DEC
      type: FIFO
      direction: read
    - name: IBUF
      type: FIFO
      direction: write
