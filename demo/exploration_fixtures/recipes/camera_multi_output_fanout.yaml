  target_soc_ref: soc-exynos2500
  role_mappings:
    yuvp_like:
      source_ip_ref: ip-isp-v12
      target_ip_ref: ip-isp-v12
      source_role: yuvp
      target_role: yuvp
      confidence: borrowed
      ip_params:
        hw_name: YUVP
        ppc: 4
        unit_power_mw_mp: 0.403
        vdd: VDD_CAM
        dvfs_group: CAM
pipeline:
