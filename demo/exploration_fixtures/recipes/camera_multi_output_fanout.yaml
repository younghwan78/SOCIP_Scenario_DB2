        port: ANALYTICS_WDMA
        width: 960
        height: 540
        format: YUV422
        bitwidth: 10
        compression: COMP_OFF
        llc_enabled: true
design_conditions:
  exploration_stage: pre_architecture
  outputs: preview_video_analytics
