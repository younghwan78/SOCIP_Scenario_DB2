id: explore-codec-display-path
scenario_id: uc-explore-codec-display
variant_id: codec-display-fhd60
project_ref: proj-A-exynos2500
soc_ref: soc-exynos2500
name: Codec Display Path Exploration
category: [video_playback, display, exploration]
source:
  type: buffer
  node_id: compressed_src
  ip_ref: ip-llc-v2
  width: 1920
  height: 1080
  fps: 60
  format: H265
  bitwidth: 8
  compression: COMP_OFF
mapping_profile:
  id: map-explore-from-projectA-video
  source_project_ref: proj-A-exynos2500
  target_soc_ref: soc-exynos2500
  role_mappings:
    mfc_decode_like:
      source_ip_ref: ip-mfc-v14
      target_ip_ref: ip-mfc-v14
      source_role: decoder
      target_role: decoder
      confidence: borrowed
      ip_params:
        hw_name: MFC
        ppc: 4
        unit_power_mw_mp: 1.0
        vdd: VDD_INT
        dvfs_group: INT
    dpu_like:
      source_ip_ref: ip-dpu-v9
      target_ip_ref: ip-dpu-v9
      source_role: display_controller
      target_role: display_controller
      confidence: borrowed
      ip_params:
        hw_name: DPU
        ppc: 4
        unit_power_mw_mp: 1.0
        vdd: VDD_INT
        dvfs_group: INT
pipeline:
  - id: mfc_dec
    template: mfc_decode_like
    selected_mode: Normal
    inputs:
      - type: RDMA
        port: MFC_BS_RDMA
        format: H265
        bitwidth: 8
    outputs:
      - type: WDMA
        port: MFC_YUV_WDMA
        format: YUV420
        bitwidth: 8
        compression: COMP_SBWC_LOSSLESS
        comp_ratio: 0.5
    output_format: YUV420
  - id: dpu0
    template: dpu_like
    selected_mode: Normal
    inputs:
      - type: RDMA
        port: DPU_LAYER0_RDMA
        format: YUV420
        bitwidth: 8
        compression: COMP_SBWC_LOSSLESS
        comp_ratio: 0.5
    outputs:
      - type: COUT
        port: DPU_PANEL_OUT
        format: RGB888
        bitwidth: 8
design_conditions:
  exploration_stage: pre_architecture
  playback_fps: 60
  output_resolution: FHD
