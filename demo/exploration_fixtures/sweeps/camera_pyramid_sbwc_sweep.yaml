id: camera-pyramid-sbwc-sweep
base_recipe:
  id: explore-camera-pyramid-sbwc
  scenario_id: uc-explore-camera-pyramid-sbwc
  variant_id: pyramid
  project_ref: proj-A-exynos2500
  soc_ref: soc-exynos2500
  name: Camera Pyramid SBWC Sweep
  category: [camera, exploration]
  tags: [exploration, camera, pyramid, sbwc]
  source:
    type: sensor
    node_id: sensor_src
    ip_ref: ip-sensor-hp2-projectA
    width: 4080
    height: 2296
    fps: 30
    format: RAW_BAYER_16
    bitwidth: 12
    compression: COMP_BAYER_LOSSLESS
  design_conditions:
    scenario_note: FHD30 recording pyramid exploration with MLSC L0-L3/G4 SBWC combinations.
    topology_note: Compiler keeps the main data path linear; multi-output MLSC and multi-RDMA MTNR ports preserve the intended pyramid DMA fanout/fanin for BW and power preview.
    mcsc_display_output: MCSC_WDMA0_DISPLAY, 1920x1080, YUV420, 8bit
    mcsc_codec_output: MCSC_WDMA1_CODEC, 1920x1080, YUV420, 10bit
  mapping_profile:
    id: map-explore-pyramid-from-projectA-camera
    source_project_ref: proj-A-exynos2500
    target_soc_ref: soc-exynos2500
    role_mappings:
      csis_like:
        source_ip_ref: ip-csis-v8
        target_ip_ref: ip-csis-v8
        source_role: csis
        target_role: csis
        confidence: borrowed
        ip_params: {hw_name: CSIS, ppc: 8, unit_power_mw_mp: 0.21, vdd: VDD_CAM, dvfs_group: CAM}
      pdp_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: pdp
        target_role: pdp
        confidence: borrowed
        ip_params: {hw_name: PDP, ppc: 4, unit_power_mw_mp: 2.0, vdd: VDD_CAM, dvfs_group: CAM}
      byrp_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: byrp
        target_role: byrp
        confidence: borrowed
        ip_params: {hw_name: BYRP, ppc: 4, unit_power_mw_mp: 4.34, vdd: VDD_CAM, dvfs_group: CAM}
      rgbp_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: rgbp
        target_role: rgbp
        confidence: borrowed
        ip_params: {hw_name: RGBP, ppc: 4, unit_power_mw_mp: 3.2, vdd: VDD_CAM, dvfs_group: CAM}
      yuvp_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: yuvp
        target_role: yuvp
        confidence: borrowed
        ip_params: {hw_name: YUVP, ppc: 4, unit_power_mw_mp: 0.4, vdd: VDD_CAM, dvfs_group: CAM}
      mlsc_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: mlsc
        target_role: mlsc
        confidence: borrowed
        ip_params: {hw_name: MLSC, ppc: 4, unit_power_mw_mp: 1.0, vdd: VDD_CAM, dvfs_group: CAM}
      mtnr_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: mtnr
        target_role: mtnr
        confidence: borrowed
        ip_params: {hw_name: MTNR, ppc: 4, unit_power_mw_mp: 1.3, vdd: VDD_INTCAM, dvfs_group: INTCAM}
      msnr_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: msnr
        target_role: msnr
        confidence: borrowed
        ip_params: {hw_name: MSNR, ppc: 4, unit_power_mw_mp: 1.3, vdd: VDD_INTCAM, dvfs_group: INTCAM}
      mcsc_like:
        source_ip_ref: ip-isp-v12
        target_ip_ref: ip-isp-v12
        source_role: mcsc
        target_role: mcsc
        confidence: borrowed
        ip_params: {hw_name: MCSC, ppc: 4, unit_power_mw_mp: 1.0, vdd: VDD_INT, dvfs_group: INT}
  pipeline:
    - id: csis0
      template: csis_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: CSIS_CIN
      outputs:
        - type: COUT
          port: CSIS_COUT_TO_PDP
        - type: WDMA
          port: CSIS_WDMA_RAW
          width: 4080
          height: 2296
          format: RAW_BAYER_16
          bitwidth: 12
          compression: COMP_BAYER_LOSSLESS
          comp_ratio: 0.5
    - id: pdp0
      template: pdp_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: PDP_CIN
      outputs:
        - type: WDMA
          port: PDP_WDMA_TO_BYRP
          width: 2400
          height: 1350
          format: RAW_BAYER_16
          bitwidth: 12
          compression: COMP_BAYER_LOSSLESS
          comp_ratio: 0.5
    - id: byrp0
      template: byrp_like
      selected_mode: Normal
      inputs:
        - type: RDMA
          port: BYRP_RDMA
          width: 2400
          height: 1350
          format: RAW_BAYER_16
          bitwidth: 12
          compression: COMP_BAYER_LOSSLESS
          comp_ratio: 0.5
      outputs:
        - type: COUT
          port: BYRP_COUT
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
    - id: rgbp0
      template: rgbp_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: RGBP_CIN
      outputs:
        - type: COUT
          port: RGBP_COUT
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
    - id: yuvp0
      template: yuvp_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: YUVP_CIN
      outputs:
        - type: COUT
          port: YUVP_COUT_TO_MLSC
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
    - id: mlsc0
      template: mlsc_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: MLSC_CIN
      outputs:
        - type: WDMA
          port: MLSC_WDMA0_L0
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
          compression: COMP_OFF
        - type: WDMA
          port: MLSC_WDMA1_L1
          width: 1200
          height: 675
          format: YUV420
          bitwidth: 10
          compression: COMP_OFF
        - type: WDMA
          port: MLSC_WDMA2_L2
          width: 600
          height: 338
          format: YUV420
          bitwidth: 10
          compression: COMP_OFF
        - type: WDMA
          port: MLSC_WDMA3_L3
          width: 300
          height: 169
          format: YUV420
          bitwidth: 10
          compression: COMP_OFF
        - type: WDMA
          port: MLSC_WDMA4_G4
          width: 150
          height: 85
          format: YUV420
          bitwidth: 10
          compression: COMP_OFF
    - id: mtnr0
      template: mtnr_like
      selected_mode: Normal
      inputs:
        - type: RDMA
          port: MTNR_RDMA0_L0
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
        - type: RDMA
          port: MTNR_RDMA1_L1
          width: 1200
          height: 675
          format: YUV420
          bitwidth: 10
        - type: RDMA
          port: MTNR_RDMA2_L2
          width: 600
          height: 338
          format: YUV420
          bitwidth: 10
        - type: RDMA
          port: MTNR_RDMA3_L3
          width: 300
          height: 169
          format: YUV420
          bitwidth: 10
        - type: RDMA
          port: MTNR_RDMA4_G4
          width: 150
          height: 85
          format: YUV420
          bitwidth: 10
      outputs:
        - type: COUT
          port: MTNR_COUT
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
    - id: msnr0
      template: msnr_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: MSNR_CIN
      outputs:
        - type: COUT
          port: MSNR_COUT
          width: 2400
          height: 1350
          format: YUV420
          bitwidth: 10
    - id: mcsc0
      template: mcsc_like
      selected_mode: Normal
      inputs:
        - type: CIN
          port: MCSC_CIN
      outputs:
        - type: WDMA
          port: MCSC_WDMA0_DISPLAY
          width: 1920
          height: 1080
          format: YUV420
          bitwidth: 8
          compression: COMP_OFF
        - type: WDMA
          port: MCSC_WDMA1_CODEC
          width: 1920
          height: 1080
          format: YUV420
          bitwidth: 10
          compression: COMP_OFF
axes:
  - name: l0
