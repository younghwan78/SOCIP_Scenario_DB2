- id: game-stream-fhd60-hevc-gpu-overlay
  severity: medium
  design_conditions:
    codec_mfc: HEVC_DEC
    resolution: FHD
    fps: 60
    dpu_layer_count: 13
    dpu_composer: GPU_FALLBACK
    note: 게임+스트리밍 컨트롤 UI+채팅+알림 레이어 합산 >12 → GPU fallback
    panel_resolution: 1440x3120
    panel_fps_hz: 60
    source_resolution: 1920x1080
    sw_timing_source: assumed
    design_review: GPU fallback is asserted at 13 layers, but S5E9965 has 16 DPP channels and max_win = 16, so the DPU can
      compose this directly. The real limits are >16 layers, or more than 8 layers needing scale/CSC (only the odd DPPs are
      VG). Confirm the intended trigger and either raise the layer count or state the other reason.
    bitrate_mbps: 16
    bitrate_value_source: assumed
  routing_switch:
    disabled_nodes:
    - m2m_scaler
    disabled_edges:
    - from: mfc_dec
      to: dpu
    - from: mfc_dec
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    mfc_dec:
      selected_mode: Normal
      codec: HEVC_DEC
      sim:
        width: 1920
        height: 1080
        fps: 60
        bitdepth: 8
        sbwc: false
      bw_kb_s:
        peak: 452925
        read: 435971
        write: 265019
      dvfs:
        weighted_mb: 489600
        freq_mfc_khz: 400000
        freq_int_khz: 133000
        freq_mif_khz: 676000
        time_fw_us: 1187
        bts_scen: default
      model_ref: ip-mfc-s5e9965.capabilities.bw_model / dvfs_model
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: GPU_FALLBACK
        layers:
        - name: gpu_composed
          src:
          - 1440
          - 3120
          dst:
          - 1440
          - 3120
          bpp: 32
          note: single RGBA8888 surface produced by SurfaceFlinger
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 1218444
