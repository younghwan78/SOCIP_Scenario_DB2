id: uc-youtube-playback
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: YouTube Playback
  category:
  - video_playback
  - video
  domain:
  - video_playback
pipeline:
  nodes:
  - id: network
    ip_ref: ip-cpu-s5e9965
    role: source
    instance_index: 0
  - id: sw_demux
    ip_ref: ip-cpu-s5e9965
    role: demux
    instance_index: 0
  - id: mfc_dec
    ip_ref: ip-mfc-s5e9965
    role: decoder
    instance_index: 0
  - id: gpu
    ip_ref: ip-gpu-s5e9965
    role: composer
    instance_index: 0
  - id: m2m_scaler
    ip_ref: ip-m2m-scaler-s5e9965
    role: m2m_scaler
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: network
    to: sw_demux
    type: control
  - from: sw_demux
    to: mfc_dec
    type: M2M
    buffer: NET_ES_BUF
  - from: mfc_dec
    to: dpu
    type: M2M
    buffer: MFC_DPU_BUF
  - from: mfc_dec
    to: gpu
    type: M2M
    buffer: MFC_GPU_BUF
  - from: gpu
    to: dpu
    type: M2M
    buffer: GPU_DPU_BUF
  - from: mfc_dec
    to: m2m_scaler
    type: M2M
    buffer: MFC_M2M_BUF
  - from: m2m_scaler
    to: dpu
    type: M2M
    buffer: M2M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    NET_ES_BUF:
      format: BITSTREAM
      compression: COMP_OFF
    MFC_DPU_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    MFC_GPU_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    MFC_M2M_BUF:
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
variants:
- id: yt-1080p30-h264-sdr
  severity: light
  design_conditions:
    codec_mfc: H264_DEC
    resolution: FHD
    fps: 30
    hdr: SDR
    dpu_layer_count: 4
    dpu_composer: DPU_DIRECT
    panel_resolution: 1440x3120
    panel_fps_hz: 60
    source_resolution: 1920x1080
    sw_timing_source: assumed
    bitrate_mbps: 10
    bitrate_value_source: assumed
  routing_switch:
    disabled_nodes:
    - gpu
    - m2m_scaler
    disabled_edges:
    - from: mfc_dec
      to: gpu
    - from: gpu
      to: dpu
    - from: mfc_dec
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    mfc_dec:
      selected_mode: Normal
      codec: H264_DEC
      sim:
        width: 1920
        height: 1080
        fps: 30
        bitdepth: 8
        sbwc: false
      bw_kb_s:
        peak: 246349
        read: 259768
        write: 160654
      dvfs:
        weighted_mb: 244800
        freq_mfc_khz: 400000
        freq_int_khz: 133000
        freq_mif_khz: 676000
        time_fw_us: 1187
        bts_scen: default
      model_ref: ip-mfc-s5e9965.capabilities.bw_model / dvfs_model
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: DPU_DIRECT
        layers:
        - name: video
          src:
          - 1920
          - 1080
          bpp: 12
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 4264554
        surface_traffic: 577125
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    m2m_scaler:
      sim:
        active: false
    gpu:
      sim:
        active: false
    network:
      sim:
        bitrate_mbps: 10
      bw_kb_s:
        write: 1250
      model_ref: ip-cpu-s5e9965.capabilities.sw_task_model
      sw_timing:
        min_ms: 0.5
        mean_ms: 1.0
        max_ms: 3.0
        start_latency_ref: packet_arrival
        start_latency_mean_ms: 0.0
        rate_hz: 30.0
        cpu_affinity: CPUCL0
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
      bw_note: Link traffic landing in DRAM through the modem/WiFi driver. It is not an IP DMA port; charge it to MIF but
        not to a codec or display IP.
    sw_demux:
      sw_timing:
        min_ms: 0.3
        mean_ms: 0.6
        max_ms: 1.2
        start_latency_ref: bitstream_available
        start_latency_mean_ms: 0.5
