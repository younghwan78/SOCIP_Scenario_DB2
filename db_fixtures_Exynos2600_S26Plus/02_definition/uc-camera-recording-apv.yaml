    to: apv_enc
    type: M2M
    buffer: GDC_VIDEO
    port_pairs:
    - src: GDC_WDMA
      dst: APV_RDMA_FRAME
  - from: dpu
    to: panel
    type: OTF
  - from: rgbp
    to: yuvp
    type: M2M
    buffer: RGBP_DRC
    port_pairs:
    - src: RGBP_WDMA_DRC
      dst: YUVP_RDMA_DRC0
    - src: RGBP_WDMA_DRC
      dst: YUVP_RDMA_DRC1
  - from: mlsc
    to: yuvp
    type: M2M
    buffer: MLSC_SVHIST
    port_pairs:
    - src: MLSC_W_SVHIST
      dst: YUVP_RDMA_SVHIST
  buffers:
    PYRAMID_L0:
      size_ref: mlsc_out
      format: Y
      bitdepth: 12
      compression: COMP_OFF
      layer: 0
    TNR_PREV_L0:
      size_ref: mlsc_out
      format: Y
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR0_RDMA_PREV_L0_Y
        write_ports:
        - MTNR0_WDMA_PREV_L0_Y
        initialization: warm_start_steady_state
    PYRAMID_L1:
      size_ref: pyramid_l1
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 1
    TNR_PREV_L1:
      size_ref: pyramid_l1
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L1_Y
        - MTNR1_RDMA_PREV_L1_U
        - MTNR1_RDMA_PREV_L1_V
        write_ports:
        - MTNR1_WDMA_PREV_L1_Y
        - MTNR1_WDMA_PREV_L1_U
        - MTNR1_WDMA_PREV_L1_V
        initialization: warm_start_steady_state
    PYRAMID_L2:
      size_ref: pyramid_l2
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 2
    TNR_PREV_L2:
      size_ref: pyramid_l2
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L2_Y
        - MTNR1_RDMA_PREV_L2_U
        - MTNR1_RDMA_PREV_L2_V
        write_ports:
        - MTNR1_WDMA_PREV_L2_Y
        - MTNR1_WDMA_PREV_L2_U
        - MTNR1_WDMA_PREV_L2_V
        initialization: warm_start_steady_state
    PYRAMID_L3:
      size_ref: pyramid_l3
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 3
    TNR_PREV_L3:
      size_ref: pyramid_l3
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L3_Y
        - MTNR1_RDMA_PREV_L3_U
        - MTNR1_RDMA_PREV_L3_V
        write_ports:
        - MTNR1_WDMA_PREV_L3_Y
        - MTNR1_WDMA_PREV_L3_U
        - MTNR1_WDMA_PREV_L3_V
        initialization: warm_start_steady_state
    PYRAMID_L4:
      size_ref: pyramid_l4
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 4
    TNR_PREV_L4:
      size_ref: pyramid_l4
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L4_Y
        - MTNR1_RDMA_PREV_L4_U
        - MTNR1_RDMA_PREV_L4_V
        write_ports:
        - MTNR1_WDMA_PREV_L4_Y
        - MTNR1_WDMA_PREV_L4_U
        - MTNR1_WDMA_PREV_L4_V
        initialization: warm_start_steady_state
    LME_INPUT:
      size_ref: motion_estimation
      format: Y
      bitdepth: 8
      compression: COMP_OFF
      source_note: MLSC LMEDS Y image for motion estimation; 1008x756 remains an unverified
        fixture assumption.
    OD_INPUT:
      size_ref: object_detection
      format: RGB
      bitdepth: 8
      compression: COMP_OFF
      size_status: assumed
      source_note: 'User fixture estimate: FDPIG RGB 512x288, 8 bits per channel assumed.'
    MCSC_PREVIEW:
      size_ref: preview_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    MCSC_VIDEO:
      size_ref: record_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    GDC_PREVIEW:
      size_ref: preview_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    GDC_VIDEO:
      size_ref: record_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    LME_PREV:
      size_ref: motion_estimation
      format: Y
      bitdepth: 8
      compression: COMP_OFF
      history:
        node_id: lme
        frame_offset: -1
        read_ports:
        - LME_RDMA_CACHE_IN_1
        write_ports: []
        producer: previous MLSC_W_LMEDS output; current write already counted
        initialization: warm_start_steady_state
    BYRP_BAYER_DUMP:
      size_ref: sensor_full
      format: BAYER
      bitdepth: 10
      compression: COMP_OFF
      source_note: Full-size video snapshot Bayer dump. Enable byrp.video_snapshot_enabled
        to include traffic.
      dma:
        node_id: byrp
        write_ports:
        - BYRP_WDMA_BYR
        activation_flag: video_snapshot_enabled
    CAV_OUTPUT:
      size_ref: cav
      format: RGB
      bitdepth: 8
      compression: COMP_OFF
      size_status: assumed
      source_note: User-approved 320x180 RGB fixture size; 8 bits per channel and
        activation require runtime confirmation.
      dma:
        node_id: mlsc
        write_ports:
        - MLSC_W_CAV
        enabled: false
    RGBP_HIST:
      size_status: unknown
      source_note: Kernel-declared output; size/format not yet characterized. Excluded
        from bandwidth.
      dma:
        node_id: rgbp
        write_ports:
        - IS_LVN_RGBP0_HIST
    RGBP_SAT:
      size_status: unknown
      source_note: Kernel-declared output; size/format not yet characterized. Excluded
        from bandwidth.
      dma:
        node_id: rgbp
        write_ports:
        - RGBP_WDMA_SAT
    RGBP_DRC:
      size_status: unknown
      source_note: DRC statistics input to YUVP; size/layout unknown, excluded from
        bandwidth.
    MLSC_SVHIST:
      size_status: unknown
      source_note: MLSC histogram input to YUVP per user. Exact YUVP physical port
        mapping/size unknown.
  architecture_graph:
    is_version: 15
    rt_chain:
    - csis
    - pdp
    - byrp
    - rgbp
    - yuvsc
    - mlsc
    nrt_chain:
    - mtnr
    - msnr
    - yuvp
    - mcsc
    rt_frame_sync: sensor_v_valid
    nrt_entry: MLSC pyramid WDMA to MTNR RDMA (M2M)
    provenance: kernel IS v15 + user-confirmed topology, 2026-09-13
    assumptions:
    - Pyramid dimensions use ceil(width/2^L), ceil(height/2^L); alignment/crop needs
      runtime confirmation.
    - Preview is FHD; LMEDS 1008x756, FDPIG RGB 512x288 and CAV RGB 320x180 are fixture
      assumptions.
    - MCSC channel assignment W0/W1 is logical policy; validate runtime port mapping.
    - History DMA models warmed-up steady state; first-frame initialization is not
      measured.
    - SW timings are assumed wall time. preME includes LME; CPU active time/power
      is not known.
    - PDP/BYRP statistic and MV result sizes are uncharacterized; their DMA availability
      is catalogued but their traffic is excluded from bandwidth totals.
    - NRT L0 chroma auxiliary input and MTNR weight/segmentation buffers require runtime
      format/size confirmation; not included in bandwidth totals.
    - CPU_CAMERA serializes CPU-only stages; preME is a composite SW+LME interval
      with unknown CPU duty.
    - RGBP DRC/HIST/SAT and MLSC SVHIST sizes are unknown; excluded from BW. BYRP
      Bayer snapshot and CAV are optional disabled outputs by default.
    pyramid_base: mlsc_out
    eis_chain: MCSC -> one EIS SW stage -> preview/video GDC instances
variants:
- id: cam-rec-apv-uhd30-422-sdr
  severity: heavy
  design_conditions:
    subscenario: UHD_VIDEO
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_VIDEO_UHD30
    sensor_place: rear
    resolution: UHD
    fps: 30
    hdr: SDR
    codec_mfc: HEVC_ENC
    dpu_layer_count: 3
    is_version: 15
    sw_timing_case: mean
    sw_timing_source: assumed
    sensor_board: m2s-GNG
    mcsc_dma_channels: 2
    sensor_input_fps: 30.0
    sensor_bitwidth: 10
    sensor_input_source: user_confirmed
    apv_chroma_format_idc: 1
    apv_chroma_format: '4:2:2'
    apv_band_idc: 0
    apv_enc_profile: 0
    priority_recording: true
    encoder_hw: APV
    sensor_runtime_confirmation: true
    record_bitrate_mbps: 1000.0
    bitrate_source: assumed
    writer_model: linear_bitrate_wall_time
    storage_model: sustained_write_assumed
  routing_switch:
    disabled_nodes:
    - sensor_rear2
    - sensor_rear3
    - sensor_front
    - vps_dof
    - vps_seg
    - eis
    - gdc_m
    - gdc_o
  node_configs:
    apv_enc:
      selected_mode: Normal
      codec: HEVC_ENC
      sim:
        width: 3840
        height: 2160
        inherit_shape: true
        format: YUV422
      chroma_format_idc: 1
      band_idc: 0
      enc_profile: 0
      memory_io:
      - port: APV_WDMA_BITSTREAM
        direction: write
        bitrate_condition: record_bitrate_mbps
    post_crta:
      sw_timing:
        min_ms: 0.1
        mean_ms: 0.3
        max_ms: 0.5
        start_jitter_mean_ms: 1.0
        value_source: assumed
        source_note: User-supplied fixture values, 2026-09-13; replace with internal
          measurements.
    pre_me_rta:
      sw_timing:
        min_ms: 2.5
        mean_ms: 3.0
        max_ms: 4.0
        includes_hw_nodes:
        - lme
        value_source: assumed
        source_note: User-supplied fixture values, 2026-09-13; replace with internal
          measurements.
    post_irta:
      sw_timing:
        min_ms: 3.0
        mean_ms: 4.0
        max_ms: 5.6
        value_source: assumed
        source_note: User-supplied fixture values, 2026-09-13; replace with internal
          measurements.
    eis:
      sw_timing:
        min_ms: 2.5
        mean_ms: 3.0
        max_ms: 6.0
        value_source: assumed
        source_note: User-supplied fixture values, 2026-09-13; replace with internal
          measurements.
    yuvsc:
      operations:
        scale: false
      bypass_downscale: true
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    mcsc:
      operations:
        crop: true
        scale: true
      active_output_ports:
      - MCSC_WDMA_W0
      - MCSC_WDMA_W1
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    byrp:
      video_snapshot_enabled: false
      stat_dma_note: IS_LVN_BYRP0_BYR / BYRP_WDMA_BYR dumps full sensor size when
        video_snapshot_enabled; OTF remains connected.
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    vps_od:
      selected_mode: Normal
      function: object_detection
      sim:
        width: 512
        height: 288
        inherit_shape: true
    lme:
      selected_mode: Normal
      sim:
        width: 1008
        height: 756
        inherit_shape: true
    sensor_rear:
      selected_mode: cis_4sum_ln4_raw10_4080x2296_30fps_3993msps
    csis:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    pdp:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    rgbp:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    mlsc:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    mtnr:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    msnr:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    yuvp:
      sim:
        width: 4080
        height: 2296
        inherit_shape: true
    gdc_m:
      sim:
        width: 1920
        height: 1080
        inherit_shape: true
      operations:
        crop: true
    gdc_o:
      sim:
        width: 3840
        height: 2160
        inherit_shape: true
      operations:
        crop: true
    dpu:
      sim:
        width: 1920
        height: 1080
        inherit_shape: true
    mpeg_writer:
      sw_timing:
        min_ms: 2
        mean_ms: 4
        max_ms: 8
        value_source: assumed
        source_note: Engineering assumption approved for fixture exploration; replace
          with internal measurements.
      sw_bitrate_scaling:
        reference_bitrate_mbps: 1000
      memory_io:
      - port: CPU_BITSTREAM_READ
        direction: read
        bitrate_condition: record_bitrate_mbps
      - port: CPU_BITSTREAM_WRITE
        direction: write
        bitrate_condition: record_bitrate_mbps
      timeline_resource_id: CPU_WRITER
      source_note: Engineering assumption approved for fixture exploration; replace
        with internal measurements.
    storage_write:
      sw_timing:
        min_ms: 4
        mean_ms: 8
        max_ms: 16
        value_source: assumed
        source_note: Engineering assumption approved for fixture exploration; replace
          with internal measurements.
      sw_bitrate_scaling:
        reference_bitrate_mbps: 1000
      timeline_resource_id: STORAGE_IO
      memory_io:
      - port: STORAGE_BITSTREAM_READ
        direction: read
        bitrate_condition: record_bitrate_mbps
      source_note: I/O completion wall time, not CPU active execution; no UFS capacity
        sign-off. Engineering assumption approved for fixture exploration; replace
        with internal measurements.
  topology_patch:
    add_edges:
    - from: mcsc
      to: dpu
