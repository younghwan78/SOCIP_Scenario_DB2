  - from: mcsc
    to: gdc_o
    type: M2M
    buffer: MCSC_VIDEO
    port_pairs:
    - src: MCSC_WDMA_W1
      dst: GDC_RDMA
  - from: mcsc
    to: eis
    type: control
  - from: eis
    to: gdc_m
    type: control
  - from: eis
    to: gdc_o
    type: control
  - from: gdc_m
    to: dpu
    type: M2M
    buffer: GDC_PREVIEW
    port_pairs:
