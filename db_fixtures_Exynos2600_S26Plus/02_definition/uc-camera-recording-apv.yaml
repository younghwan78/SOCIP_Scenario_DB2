      dst: CINFIFO
  - from: mtnr
    to: msnr
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: msnr
    to: yuvp
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: yuvp
    to: mcsc
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: mlsc
