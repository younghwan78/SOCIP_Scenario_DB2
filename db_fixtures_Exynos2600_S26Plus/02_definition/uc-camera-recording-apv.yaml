      dst: MTNR1_RDMA_CUR_L1_Y
    - src: MLSC_W_GLPG1_U
      dst: MTNR1_RDMA_CUR_L1_U
    - src: MLSC_W_GLPG1_V
      dst: MTNR1_RDMA_CUR_L1_V
  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L2
    port_pairs:
    - src: MLSC_W_GLPG2_Y
      dst: MTNR1_RDMA_CUR_L2_Y
    - src: MLSC_W_GLPG2_U
      dst: MTNR1_RDMA_CUR_L2_U
    - src: MLSC_W_GLPG2_V
      dst: MTNR1_RDMA_CUR_L2_V
  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L3
    port_pairs:
    - src: MLSC_W_GLPG3_Y
      dst: MTNR1_RDMA_CUR_L3_Y
    - src: MLSC_W_GLPG3_U
      dst: MTNR1_RDMA_CUR_L3_U
    - src: MLSC_W_GLPG3_V
      dst: MTNR1_RDMA_CUR_L3_V
  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L4
    port_pairs:
    - src: MLSC_W_GLPG4_Y
      dst: MTNR1_RDMA_CUR_L4_Y
    - src: MLSC_W_GLPG4_U
      dst: MTNR1_RDMA_CUR_L4_U
    - src: MLSC_W_GLPG4_V
      dst: MTNR1_RDMA_CUR_L4_V
  - from: mlsc
    to: post_crta
    type: control
  - from: pdp
    to: post_crta
    type: control
  - from: byrp
    to: post_crta
    type: control
  - from: post_crta
    to: pre_me_rta
    type: control
  - from: pre_me_rta
    to: lme
    type: control
  - from: lme
    to: post_irta
    type: control
  - from: post_irta
    to: mtnr
    type: control
  - from: mlsc
    to: lme
    type: M2M
    buffer: LME_INPUT
    port_pairs:
    - src: MLSC_W_LMEDS
      dst: LME_RDMA_CACHE_IN_0
  - from: mlsc
    to: vps_od
    type: M2M
    buffer: OD_INPUT
    port_pairs:
    - src: MLSC_W_FDPIG
      dst: VPS_RDMA
  - from: pre_me_rta
    to: vps_dof
    type: control
  - from: vps_dof
    to: post_irta
    type: control
  - from: mlsc
    to: vps_seg
    type: control
  - from: vps_seg
    to: mtnr
    type: control
  - from: mcsc
    to: gdc_m
    type: M2M
    buffer: MCSC_PREVIEW
    port_pairs:
    - src: MCSC_WDMA_W0
