id: uc-audio-mp3-playback
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: Audio MP3 Playback
  category:
  - audio
  - audio
  domain:
  - audio
pipeline:
  nodes:
  - id: storage
    ip_ref: ip-ufs-s5e9965
    role: source
    instance_index: 0
  - id: sw_decoder
    ip_ref: ip-cpu-s5e9965
    role: audio_decode
    instance_index: 0
  - id: dsp_offload
    ip_ref: ip-abox-s5e9965
    role: dsp_offload
    instance_index: 0
  - id: audio_hal
    ip_ref: ip-abox-s5e9965
    role: audio_hal
    instance_index: 0
  - id: speaker
    ip_ref: ip-abox-s5e9965
    role: audio_output
    instance_index: 0
  - id: bt_codec
    ip_ref: ip-abox-s5e9965
    role: bt_output
    instance_index: 0
  - id: abox
    ip_ref: ip-abox-s5e9965
    role: audio_offload
    instance_index: 0
  edges:
  - from: storage
    to: sw_decoder
    type: M2M
    buffer: AUDIO_ES_BUF
  - from: storage
    to: dsp_offload
    type: M2M
    buffer: AUDIO_OFFLOAD_BUF
  - from: sw_decoder
    to: audio_hal
    type: control
  - from: dsp_offload
    to: audio_hal
    type: control
  - from: audio_hal
    to: speaker
    type: control
  - from: audio_hal
    to: bt_codec
    type: control
  buffers:
    AUDIO_ES_BUF:
      format: AUDIO_PCM
      bitdepth: 16
      compression: COMP_OFF
    AUDIO_OFFLOAD_BUF:
      format: AUDIO_PCM
      bitdepth: 16
      compression: COMP_OFF
variants:
- id: audio-mp3-screen-on
  severity: light
  design_conditions:
    format: MP3
    bitrate_kbps: 320
    screen_on: true
    offload: false
    output: speaker
    panel_resolution: 1440x3120
    panel_fps_hz: 60
    sw_timing_source: assumed
    bitrate_mbps: 0.32
    bitrate_value_source: assumed
  routing_switch:
    disabled_nodes:
    - dsp_offload
    - bt_codec
    disabled_edges:
    - from: storage
      to: dsp_offload
    - from: dsp_offload
      to: audio_hal
    - from: audio_hal
      to: bt_codec
  node_configs:
    storage:
      sim:
        bitrate_mbps: 0.32
      bw_kb_s:
        read: 40
      model_ref: ip-ufs-s5e9965.capabilities.bw_model
    abox:
      selected_mode: Normal
      sim:
        sample_rate_khz: 48.0
        bit_depth: 16
        channels: 2
        playback_streams: 1
        capture_streams: 0
        offload: false
        output: speaker
      bw_kb_s:
        read: 188
        write: 0
      dvfs:
        aud_freq_khz: 400000
        value_source: assumed
        note: AUD operating point is not derivable from design_conditions; lowest level assumed for offload, a mid level for
          the CPU-fed path.
      model_ref: ip-abox-s5e9965.capabilities.bw_model / dvfs_model
    audio_hal:
      executes_on: ip-abox-s5e9965
    speaker:
      executes_on: ip-abox-s5e9965
    bt_codec:
      executes_on: ip-abox-s5e9965
    dsp_offload:
      executes_on: ip-abox-s5e9965
    sw_decoder:
      sw_timing:
        min_ms: 1.5
        mean_ms: 3.0
        max_ms: 6.0
        start_latency_ref: bitstream_available
        start_latency_mean_ms: 0.5
        rate_hz: 30.0
        cpu_affinity: CPUCL1
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
