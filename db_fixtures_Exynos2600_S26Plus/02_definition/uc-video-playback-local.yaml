    fps: 30
    hdr: SDR
    bit_depth: 8
    panel_resolution: 1440x3120
    panel_fps_hz: 60
    source_resolution: 1920x1080
    sw_timing_source: assumed
    bitrate_mbps: 10
    bitrate_value_source: assumed
  routing_switch:
    disabled_nodes:
    - apv_dec
    - drm_dec
    - gpu
    - m2m_scaler
    disabled_edges:
    - from: storage
      to: apv_dec
    - from: storage
      to: drm_dec
    - from: drm_dec
      to: mfc_dec
    - from: apv_dec
      to: dpu
    - from: mfc_dec
      to: gpu
    - from: gpu
      to: dpu
    - from: apv_dec
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    mfc_dec:
      selected_mode: Normal
      codec: H264_DEC
      sim:
        width: 1920
        height: 1080
        fps: 30
        bitdepth: 8
        sbwc: false
      bw_kb_s:
        peak: 246349
        read: 259768
        write: 160654
      dvfs:
        weighted_mb: 244800
        freq_mfc_khz: 400000
        freq_int_khz: 133000
        freq_mif_khz: 676000
        time_fw_us: 1187
        bts_scen: default
      model_ref: ip-mfc-s5e9965.capabilities.bw_model / dvfs_model
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: DPU_DIRECT
        layers:
        - name: video
          src:
          - 1920
          - 1080
          bpp: 12
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 4264554
        surface_traffic: 577125
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    m2m_scaler:
      sim:
        active: false
    gpu:
      sim:
        active: false
    storage:
      sim:
        bitrate_mbps: 10
      bw_kb_s:
        read: 1250
      model_ref: ip-ufs-s5e9965.capabilities.bw_model
    drm_dec:
      sw_timing:
        min_ms: 0.4
        mean_ms: 0.8
        max_ms: 1.6
        start_latency_ref: bitstream_available
        start_latency_mean_ms: 0.3
        rate_hz: 30.0
        cpu_affinity: CPUCL1
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
    apv_dec:
      sim:
        active: false
