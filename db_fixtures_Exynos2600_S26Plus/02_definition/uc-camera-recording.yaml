  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L1
    port_pairs:
    - src: MLSC_W_GLPG1_Y
      dst: MTNR1_RDMA_CUR_L1_Y
    - src: MLSC_W_GLPG1_U
      dst: MTNR1_RDMA_CUR_L1_U
    - src: MLSC_W_GLPG1_V
      dst: MTNR1_RDMA_CUR_L1_V
  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L2
    port_pairs:
    - src: MLSC_W_GLPG2_Y
      dst: MTNR1_RDMA_CUR_L2_Y
    - src: MLSC_W_GLPG2_U
      dst: MTNR1_RDMA_CUR_L2_U
    - src: MLSC_W_GLPG2_V
      dst: MTNR1_RDMA_CUR_L2_V
  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L3
    port_pairs:
    - src: MLSC_W_GLPG3_Y
      dst: MTNR1_RDMA_CUR_L3_Y
    - src: MLSC_W_GLPG3_U
      dst: MTNR1_RDMA_CUR_L3_U
    - src: MLSC_W_GLPG3_V
      dst: MTNR1_RDMA_CUR_L3_V
  - from: mlsc
    to: mtnr
    type: M2M
    buffer: PYRAMID_L4
    port_pairs:
    - src: MLSC_W_GLPG4_Y
      dst: MTNR1_RDMA_CUR_L4_Y
    - src: MLSC_W_GLPG4_U
      dst: MTNR1_RDMA_CUR_L4_U
    - src: MLSC_W_GLPG4_V
      dst: MTNR1_RDMA_CUR_L4_V
  - from: mlsc
    to: post_crta
    type: control
  - from: pdp
    to: post_crta
    type: control
  - from: byrp
    to: post_crta
    type: control
  - from: post_crta
    to: pre_me_rta
    type: control
  - from: pre_me_rta
    to: lme
    type: control
  - from: lme
    to: post_irta
    type: control
  - from: post_irta
    to: mtnr
    type: control
  - from: mlsc
    to: lme
    type: M2M
    buffer: LME_INPUT
    port_pairs:
    - src: MLSC_W_LMEDS
      dst: LME_RDMA_CACHE_IN_0
  - from: mlsc
    to: vps_od
    type: M2M
    buffer: OD_INPUT
    port_pairs:
    - src: MLSC_W_FDPIG
      dst: VPS_RDMA
  - from: pre_me_rta
    to: vps_dof
    type: control
  - from: vps_dof
    to: post_irta
    type: control
  - from: mlsc
    to: vps_seg
    type: control
  - from: vps_seg
    to: mtnr
    type: control
  - from: mcsc
    to: gdc_m
    type: M2M
    buffer: MCSC_PREVIEW
    port_pairs:
    - src: MCSC_WDMA_W0
      dst: GDC_RDMA
  - from: mcsc
    to: gdc_o
    type: M2M
    buffer: MCSC_VIDEO
    port_pairs:
    - src: MCSC_WDMA_W1
      dst: GDC_RDMA
  - from: mcsc
    to: eis
    type: control
  - from: eis
    to: gdc_m
    type: control
  - from: eis
    to: gdc_o
    type: control
  - from: gdc_m
    to: dpu
    type: M2M
    buffer: GDC_PREVIEW
    port_pairs:
    - src: GDC_WDMA
      dst: DPU_RDMA
  - from: gdc_o
    to: mfc_enc
    type: M2M
    buffer: GDC_VIDEO
    port_pairs:
    - src: GDC_WDMA
      dst: MFC_RDMA
  - from: dpu
    to: panel
    type: OTF
  - from: rgbp
    to: yuvp
    type: M2M
    buffer: RGBP_DRC
    port_pairs:
    - src: RGBP_WDMA_DRC
      dst: YUVP_RDMA_DRC0
    - src: RGBP_WDMA_DRC
      dst: YUVP_RDMA_DRC1
  - from: mlsc
    to: yuvp
    type: M2M
    buffer: MLSC_SVHIST
    port_pairs:
    - src: MLSC_W_SVHIST
      dst: YUVP_RDMA_SVHIST
  buffers:
    PYRAMID_L0:
      size_ref: mlsc_out
      format: Y
      bitdepth: 12
      compression: COMP_OFF
      layer: 0
    TNR_PREV_L0:
      size_ref: mlsc_out
      format: Y
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR0_RDMA_PREV_L0_Y
        write_ports:
        - MTNR0_WDMA_PREV_L0_Y
        initialization: warm_start_steady_state
    PYRAMID_L1:
      size_ref: pyramid_l1
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 1
    TNR_PREV_L1:
      size_ref: pyramid_l1
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L1_Y
        - MTNR1_RDMA_PREV_L1_U
        - MTNR1_RDMA_PREV_L1_V
        write_ports:
        - MTNR1_WDMA_PREV_L1_Y
        - MTNR1_WDMA_PREV_L1_U
        - MTNR1_WDMA_PREV_L1_V
        initialization: warm_start_steady_state
    PYRAMID_L2:
      size_ref: pyramid_l2
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 2
    TNR_PREV_L2:
      size_ref: pyramid_l2
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L2_Y
        - MTNR1_RDMA_PREV_L2_U
        - MTNR1_RDMA_PREV_L2_V
        write_ports:
        - MTNR1_WDMA_PREV_L2_Y
        - MTNR1_WDMA_PREV_L2_U
        - MTNR1_WDMA_PREV_L2_V
        initialization: warm_start_steady_state
    PYRAMID_L3:
      size_ref: pyramid_l3
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 3
    TNR_PREV_L3:
      size_ref: pyramid_l3
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L3_Y
        - MTNR1_RDMA_PREV_L3_U
        - MTNR1_RDMA_PREV_L3_V
        write_ports:
        - MTNR1_WDMA_PREV_L3_Y
        - MTNR1_WDMA_PREV_L3_U
        - MTNR1_WDMA_PREV_L3_V
        initialization: warm_start_steady_state
    PYRAMID_L4:
      size_ref: pyramid_l4
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      layer: 4
    TNR_PREV_L4:
      size_ref: pyramid_l4
      format: YUV444
      bitdepth: 12
      compression: COMP_OFF
      history:
        node_id: mtnr
        frame_offset: -1
        read_ports:
        - MTNR1_RDMA_PREV_L4_Y
        - MTNR1_RDMA_PREV_L4_U
        - MTNR1_RDMA_PREV_L4_V
        write_ports:
        - MTNR1_WDMA_PREV_L4_Y
        - MTNR1_WDMA_PREV_L4_U
        - MTNR1_WDMA_PREV_L4_V
        initialization: warm_start_steady_state
    LME_INPUT:
      size_ref: motion_estimation
      format: Y
      bitdepth: 8
      compression: COMP_OFF
      source_note: MLSC LMEDS Y image for motion estimation; 1008x756 remains an unverified
        fixture assumption.
    OD_INPUT:
      size_ref: object_detection
      format: RGB
      bitdepth: 8
      compression: COMP_OFF
      size_status: assumed
      source_note: 'User fixture estimate: FDPIG RGB 512x288, 8 bits per channel assumed.'
    MCSC_PREVIEW:
      size_ref: preview_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    MCSC_VIDEO:
      size_ref: record_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    GDC_PREVIEW:
      size_ref: preview_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    GDC_VIDEO:
      size_ref: record_out
      format: YUV420
      bitdepth: 8
      compression: COMP_OFF
    LME_PREV:
      size_ref: motion_estimation
      format: Y
      bitdepth: 8
      compression: COMP_OFF
      history:
        node_id: lme
        frame_offset: -1
        read_ports:
        - LME_RDMA_CACHE_IN_1
        write_ports: []
        producer: previous MLSC_W_LMEDS output; current write already counted
        initialization: warm_start_steady_state
    BYRP_BAYER_DUMP:
      size_ref: sensor_full
      format: BAYER
      bitdepth: 10
      compression: COMP_OFF
      source_note: Full-size video snapshot Bayer dump. Enable byrp.video_snapshot_enabled
        to include traffic.
      dma:
        node_id: byrp
        write_ports:
        - BYRP_WDMA_BYR
        activation_flag: video_snapshot_enabled
    CAV_OUTPUT:
      size_ref: cav
      format: RGB
      bitdepth: 8
      compression: COMP_OFF
      size_status: assumed
      source_note: User-approved 320x180 RGB fixture size; 8 bits per channel and
        activation require runtime confirmation.
      dma:
        node_id: mlsc
        write_ports:
        - MLSC_W_CAV
        enabled: false
    RGBP_HIST:
      size_status: unknown
      source_note: Kernel-declared output; size/format not yet characterized. Excluded
        from bandwidth.
      dma:
        node_id: rgbp
        write_ports:
        - IS_LVN_RGBP0_HIST
    RGBP_SAT:
      size_status: unknown
      source_note: Kernel-declared output; size/format not yet characterized. Excluded
        from bandwidth.
      dma:
        node_id: rgbp
        write_ports:
        - RGBP_WDMA_SAT
    RGBP_DRC:
      size_status: unknown
      source_note: DRC statistics input to YUVP; size/layout unknown, excluded from
        bandwidth.
    MLSC_SVHIST:
      size_status: unknown
      source_note: MLSC histogram input to YUVP per user. Exact YUVP physical port
        mapping/size unknown.
  architecture_graph:
    is_version: 15
    rt_chain:
    - csis
    - pdp
    - byrp
    - rgbp
    - yuvsc
    - mlsc
    nrt_chain:
    - mtnr
    - msnr
    - yuvp
    - mcsc
    rt_frame_sync: sensor_v_valid
    nrt_entry: MLSC pyramid WDMA to MTNR RDMA (M2M)
    provenance: kernel IS v15 + user-confirmed topology, 2026-09-13
    assumptions:
    - Pyramid dimensions use ceil(width/2^L), ceil(height/2^L); alignment/crop needs
      runtime confirmation.
    - Preview is FHD; LMEDS 1008x756, FDPIG RGB 512x288 and CAV RGB 320x180 are fixture
      assumptions.
    - MCSC channel assignment W0/W1 is logical policy; validate runtime port mapping.
    - History DMA models warmed-up steady state; first-frame initialization is not
      measured.
    - SW timings are assumed wall time. preME includes LME; CPU active time/power
      is not known.
    - PDP/BYRP statistic and MV result sizes are uncharacterized; their DMA availability
      is catalogued but their traffic is excluded from bandwidth totals.
    - NRT L0 chroma auxiliary input and MTNR weight/segmentation buffers require runtime
      format/size confirmation; not included in bandwidth totals.
    - CPU_CAMERA serializes CPU-only stages; preME is a composite SW+LME interval
      with unknown CPU duty.
    - RGBP DRC/HIST/SAT and MLSC SVHIST sizes are unknown; excluded from BW. BYRP
      Bayer snapshot and CAV are optional disabled outputs by default.
    pyramid_base: mlsc_out
    eis_chain: MCSC -> one EIS SW stage -> preview/video GDC instances
variants:
