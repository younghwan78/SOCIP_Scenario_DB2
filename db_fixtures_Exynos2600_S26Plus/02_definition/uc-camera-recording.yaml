      dst: CINFIFO
  - from: pdp
    to: byrp
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: byrp
    to: rgbp
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: rgbp
    to: yuvsc
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: yuvsc
    to: mlsc
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: mtnr
    to: msnr
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: msnr
    to: yuvp
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: yuvp
    to: mcsc
    type: OTF
    port_pairs:
    - src: COUTFIFO
      dst: CINFIFO
  - from: mlsc
