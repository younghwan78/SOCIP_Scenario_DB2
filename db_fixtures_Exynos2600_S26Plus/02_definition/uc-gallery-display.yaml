- id: disp-gallery-fhd-sdr-gpu-heavy
  severity: light
  design_conditions:
    resolution: FHD
    hdr: SDR
    panel_fps_hz: 60
    dpu_layer_count: 15
    dpu_composer: GPU_FALLBACK
    note: 'layer_count > 12: SurfaceFlinger GPU fallback (RenderThread GLES)'
    panel_resolution: 1440x3120
    source_resolution: 1920x1080
    sw_timing_source: assumed
    design_review: GPU fallback is asserted at 15 layers, but S5E9965 has 16 DPP channels and max_win = 16, so the DPU can
      compose this directly. The real limits are >16 layers, or more than 8 layers needing scale/CSC (only the odd DPPs are
      VG). Confirm the intended trigger and either raise the layer count or state the other reason.
  routing_switch:
    disabled_nodes:
    - m2m_scaler
    disabled_edges:
    - from: storage
      to: dpu
    - from: storage
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: GPU_FALLBACK
        layers:
        - name: gpu_composed
          src:
          - 1440
          - 3120
          dst:
          - 1440
          - 3120
          bpp: 32
          note: single RGBA8888 surface produced by SurfaceFlinger
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 1218444
        surface_traffic: 1053000
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    m2m_scaler:
      sim:
        active: false
    gpu:
      selected_mode: Normal
      sim:
        width: 1920
        height: 1080
        fps: 30
        workload: composition
        input_layers: 15
      bw_kb_s:
        note: GPU traffic is not kernel-declared; see ip-gpu bw_model
        composition_write: 1053000
      model_ref: ip-gpu-s5e9965.capabilities.dvfs_model / power_model
      sw_timing:
        min_ms: 1.0
        mean_ms: 2.0
        max_ms: 4.0
        start_latency_ref: layers_ready
        start_latency_mean_ms: 0.5
        rate_hz: 60.0
        cpu_affinity: CPUCL2
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
    storage:
      sim:
        bitrate_mbps: null
      note: no bitrate in design_conditions; set bitrate_mbps or bitrate_kbps to model this traffic
