          bpp: 32
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
