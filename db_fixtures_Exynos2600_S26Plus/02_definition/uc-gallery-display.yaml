    - from: m2m_scaler
      to: dpu
  node_configs:
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
