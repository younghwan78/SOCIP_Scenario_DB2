id: uc-voice-call
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: Voice Call
  category:
  - voice_call
  - audio
  domain:
  - voice_call
pipeline:
  nodes:
  - id: modem
    ip_ref: ip-cpu-s5e9965
    role: modem
    instance_index: 0
  - id: audio_hal
    ip_ref: ip-abox-s5e9965
    role: audio_hal
    instance_index: 0
  - id: speaker
    ip_ref: ip-abox-s5e9965
    role: earpiece
    instance_index: 0
  - id: mic
    ip_ref: ip-abox-s5e9965
    role: microphone
    instance_index: 0
  - id: abox
    ip_ref: ip-abox-s5e9965
    role: audio_offload
    instance_index: 0
  edges:
  - from: modem
    to: audio_hal
    type: control
  - from: audio_hal
    to: speaker
    type: control
  - from: mic
    to: audio_hal
    type: control
  - from: audio_hal
    to: modem
    type: control
  buffers: {}
variants:
- id: voice-call-volte
  severity: light
  design_conditions:
    call_type: VoLTE
    camera_active: false
    dvfs_sn: IS_DVFS_SN_REAR_SINGLE_VT
    panel_resolution: 1440x3120
    panel_fps_hz: 60
    sw_timing_source: assumed
  node_configs:
    abox:
      selected_mode: Normal
      sim:
        sample_rate_khz: 48.0
        bit_depth: 16
        channels: 1
        playback_streams: 1
        capture_streams: 1
        offload: false
        output: speaker
      bw_kb_s:
        read: 94
        write: 94
      dvfs:
        aud_freq_khz: 400000
        value_source: assumed
        note: AUD operating point is not derivable from design_conditions; lowest level assumed for offload, a mid level for
          the CPU-fed path.
      model_ref: ip-abox-s5e9965.capabilities.bw_model / dvfs_model
    audio_hal:
      executes_on: ip-abox-s5e9965
    speaker:
      executes_on: ip-abox-s5e9965
    mic:
      executes_on: ip-abox-s5e9965
    modem:
      sw_timing:
        min_ms: 0.2
        mean_ms: 0.4
        max_ms: 1.0
        start_latency_ref: modem_irq
        start_latency_mean_ms: 0.0
        rate_hz: 50.0
        cpu_affinity: CPUCL0
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
