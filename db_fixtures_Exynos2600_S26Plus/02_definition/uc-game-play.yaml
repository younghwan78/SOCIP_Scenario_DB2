id: uc-game-play
schema_version: '2.2'
kind: scenario.usecase
project_ref: proj-sm-s947b
metadata:
  name: Game Play
  category:
  - game
  - game
  domain:
  - game
pipeline:
  nodes:
  - id: cpu
    ip_ref: ip-cpu-s5e9965
    role: cpu
    instance_index: 0
  - id: gpu
    ip_ref: ip-gpu-s5e9965
    role: gpu_renderer
    instance_index: 0
  - id: npu
    ip_ref: ip-npu-s5e9965
    role: npu
    instance_index: 0
  - id: m2m_scaler
    ip_ref: ip-m2m-scaler-s5e9965
    role: m2m_scaler
    instance_index: 0
  - id: dpu
    ip_ref: ip-dpu-s5e9965
    role: display_controller
    instance_index: 0
  - id: panel
    ip_ref: ip-display-panel-s5e9965
    role: display_output
    instance_index: 0
  edges:
  - from: cpu
    to: gpu
    type: control
  - from: gpu
    to: dpu
    type: M2M
    buffer: GPU_DPU_BUF
  - from: gpu
    to: npu
    type: M2M
    buffer: GPU_NPU_BUF
  - from: npu
    to: dpu
    type: M2M
    buffer: NPU_DPU_BUF
  - from: gpu
    to: m2m_scaler
    type: M2M
    buffer: GPU_M2M_BUF
  - from: m2m_scaler
    to: dpu
    type: M2M
    buffer: M2M_DPU_BUF
  - from: dpu
    to: panel
    type: OTF
  buffers:
    GPU_NPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    GPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    NPU_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    GPU_M2M_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
    M2M_DPU_BUF:
      format: RGBA8888
      bitdepth: 8
      compression: COMP_OFF
variants:
- id: game-fhd-60fps-sdr
  severity: light
  design_conditions:
    resolution: FHD
    target_fps: 60
    hdr: SDR
    gpu_governor: performance
    panel_fps_hz: 60
    npu_used: false
    dpu_layer_count: 5
    dpu_composer: DPU_DIRECT
    panel_resolution: 1440x3120
    source_resolution: 1920x1080
    sw_timing_source: assumed
  routing_switch:
    disabled_nodes:
    - npu
    - m2m_scaler
    disabled_edges:
    - from: gpu
      to: npu
    - from: npu
      to: dpu
    - from: gpu
      to: m2m_scaler
    - from: m2m_scaler
      to: dpu
  node_configs:
    gpu:
      selected_mode: Normal
      sim:
        width: 1920
        height: 1080
        fps: 60
        workload: render
      bw_kb_s:
        note: GPU traffic is not kernel-declared; see ip-gpu bw_model
        composition_write: 0
      model_ref: ip-gpu-s5e9965.capabilities.dvfs_model / power_model
    panel:
      selected_mode: 60hz
      sim:
        refresh_hz: 60
        screen_on: true
    dpu:
      selected_mode: Normal
      sim:
        panel_width: 1440
        panel_height: 3120
        refresh_hz: 60
        composer: DPU_DIRECT
        layers:
        - name: rendered_frame
          src:
          - 1920
          - 1080
          bpp: 32
          dst:
          - 1440
          - 3120
        - name: ui0
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui1
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui2
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
        - name: ui3
          src:
          - 1440
          - 390
          dst:
          - 1440
          - 390
          bpp: 32
          value_source: assumed
      resol_clk_khz: 304611
      bw_kb_s:
        bts_read_vote: 6498368
        surface_traffic: 1012500
        write: 0
      bw_note: bts_read_vote is what the driver votes to BTS (worst case, each layer charged at full-frame rate); surface_traffic
        is the bytes actually fetched. Use the vote for MIF/INT frequency, the traffic for energy.
      model_ref: ip-dpu-s5e9965.capabilities.bw_model
    m2m_scaler:
      sim:
        active: false
    npu:
      sim:
        active: false
        width: 1920
        height: 1080
        fps: 0
      dvfs: null
      dvfs_note: null
    cpu:
      sw_timing:
        min_ms: 2.0
        mean_ms: 4.0
        max_ms: 8.0
        start_latency_ref: frame_start
        start_latency_mean_ms: 0.0
        rate_hz: 60.0
        cpu_affinity: CPUCL3
        value_source: assumed
        source_note: Execution time and CPU affinity are fixture assumptions (2026-09-16), not measurements. Replace with
          internal per-task avg/min/max and the cluster the task actually ran on; CPU energy = ip-cpu power_model at that
          cluster/frequency x exec_ms x rate_hz.
