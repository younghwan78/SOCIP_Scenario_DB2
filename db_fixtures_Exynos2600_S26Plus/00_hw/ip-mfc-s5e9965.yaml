  dvfs_model:
    source: kernel_dt
    reference: 'exynos/soc-series/t-android16/arch/arm64/boot/dts/exynos/s5e9965-video.dtsi:
      mfc_default_qos_table / mfc_encoder_qos_table'
    formula:
    - weighted_mb = mb * 1000 / weight(codec, planes, bitdepth, 422, bframe, tiles,
      ...)
    - pick the highest step whose thrd_mb <= total weighted_mb across contexts
    - -> freq_mfc_khz (MFC devfreq), freq_int_khz (INT), freq_mif_khz (MIF), bts_scen
    mfc_freqs_khz:
    - 160000
    - 234000
    - 267000
    - 332000
    - 400000
    - 467000
    - 533000
    - 664000
    - 800000
    max_mb: 5711867
    max_hw_mb: 3888000
    dynamic_weight: true
    qos_weight_pct:
      h264_hevc: 100
      vp8_vp9: 100
      av1: 70
      other_codec: 25
      3plane: 80
      10bit: 75
      '422': 70
      bframe: 50
      num_of_tile: 75
      gpb: 50
      num_of_ref: 60
      mbaff: 60
      super64_bframe: 60
    weight_note: weight is applied as weight = weight * 100 / qos_weight_<x>, so a
      lower percentage means more load.
    default_qos_table:
    - thrd_mb: 0
