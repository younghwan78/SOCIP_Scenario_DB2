          name: VP9
          max_resolution: UHD
          max_fps: 30
    format_flags:
      MFC_FMT_STREAM: 1
      MFC_FMT_FRAME: 2
      MFC_FMT_10BIT: 4
      MFC_FMT_422: 8
      MFC_FMT_RGB: 16
      MFC_FMT_SBWC: 32
      MFC_FMT_SBWCL: 64
      MFC_FMT_DEC: 128
      MFC_FMT_ENC: 256
    sbwc_support: true
    secure_mode: true
  bw_model:
    source: kernel_driver
    reference: 'exynos/soc-series/common/drivers/mfc/base/mfc_qos.c: __mfc_qos_get_bw_per_second'
    unit: KB/s
    table_unit: KB per UHD frame (32400 macroblocks)
    formula:
    - mb    = ceil(w/16) * ceil(h/16) * fps,  clamped to 32400 * 120
    - bw_x  = table[codec].x * mb / 32400            for x in (peak, read, write)
    - 'add   = ((rgb_bpp - 12) / 8) * w * h * fps / 1024   # RGB source only, rgb_bpp
      > 12'
    - bw_x += add
    mb_count_per_uhd_frame: 32400
    max_fps_per_uhd_frame: 120
    table_select: sbwc table when ctx->is_sbwc or is_sbwc_lossy, else the plain table
    tables:
      non_sbwc:
