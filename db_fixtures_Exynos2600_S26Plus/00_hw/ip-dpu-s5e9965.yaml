id: ip-dpu-s5e9965
schema_version: '2.2'
kind: ip
category: display
hierarchy:
  type: simple
capabilities:
  operating_modes:
  - id: Normal
  - id: LowPower
  - id: VRR
  - id: Hibernation
  - id: Writeback
  sim:
    hw_name: DPU
    source: legacy_project_info_csv
    source_project: A
    modes:
      Normal:
        unit_power_mw_mp: 1.0
        idc: 0.0
        ppc: 4.0
        vdd: VDD_INT
        dvfs_group: INT
  supported_features:
    bitdepth:
    - 8
    - 10
    hdr_formats:
    - SDR
    - HDR10
    - HDR10_PLUS
    - HLG
    compression:
    - COMP_OFF
    - COMP_YUV_LOSSLESS
    - COMP_YUV_LOSSY
  properties:
    modules:
    - name: DPU_RDMA
      type: DMA
      direction: read
      role: layer_input
      max_bandwidth: 8192000000
      supported_compressions:
      - COMP_OFF
      - COMP_YUV_LOSSLESS
    ip_group: DPU
    hierarchy_group: Display
    subblocks:
    - DECON
    - DPP
    - DSIM
    hdr_bitmask:
      HDR_DOLBY_VISION: 1
      HDR_HDR10: 4
      HDR_HLG: 8
      HDR_HDR10_PLUS: 16
    vrr:
      bts_fps_field: bts_fps
      esync_hz_field: esync_hz
      min_frame_interval_hz_field: min_frame_interval_hz
    sbwc_consumer: true
    secure_layer: true
    composition:
      max_hw_layers: 12
      dpp_planes: 12
      supported_input_formats:
      - RGBA8888
      - BGRA8888
      - RGB565
      - NV12
      - NV21
      - NV16
      - RGBA1010102
      - NV12_10BIT
      - YUV420_SBWC
      - YUV420_SBWCL
      fallback:
        gpu:
          trigger:
          - dpu_layer_count > 12
          - layer format not in supported_input_formats
          - blend mode not supported by DPP (e.g. multiply, overlay)
          - rotation other than 0/90/180/270
          composer: SurfaceFlinger RenderThread (OpenGL ES / Vulkan)
          output_format: RGBA8888
        m2m_scaler:
          trigger:
          - input scaling ratio outside DPP limits
          - YUV422 / YUV444 format conversion required before DPU
          - pre-compositing required to reduce layer count
          composer: G2D or MCSC M2M path
          output_format: RGBA8888
  bw_model:
    source: kernel_driver
    reference: 'exynos/soc-series/common/drivers/dpu/exynos_drm_bts.c: __get_bts_margin
      / __get_resol_clock_internal / dpu_bts_calc_dpp_bw'
    unit: KB/s
    formula:
    - 'margin        = 1100 + (12000*dsc_slice_count + 20000) / xres   # x1000 fixed
      point'
    - resol_clk_khz = xres * yres * max(fps, 60) * margin / 1e6
    - layer_bw      = h_scale_ratio * v_scale_ratio * bpp/8 * resol_clk_khz
    - '                * (dst_w / xres  if fps <= 60 else 1)'
    - read_bw       = sum(layer_bw) + (resol_clk_khz if rcd_en) + bus_overhead + customer_bw
    - write_bw      = writeback layer_bw
    - total_bw      = read_bw + write_bw
    notes:
    - scale ratios are >= 1 only for downscale (upscale does not add read BW).
    - Rotation replaces layer_bw with src_w * rot_read_line * bpp/8 * 1e6 / tx_allow_ns
      when that is larger; rot_read_line is 32 lines uncompressed.
    - fps below 60 is clamped to 60 (DISP_REFRESH_RATE), so a 30 Hz panel votes 60
      Hz BW.
    params:
      ppc: 2
      ppc_rotator: 8
      ppc_scaler: 4
      ppc_scaler_comp: 3.2
      delay_comp_lines: 4
      delay_scaler_lines: 3
      inner_width_byte: 32
      inner_util_pct: 70
      bus_width_byte: 32
      rot_util_pct: 60
      disp_factor_pct: 100
      disp_refresh_rate_floor_hz: 60
      vote_overlap_bw: true
      dsc_slice_count:
        value: 2
        value_source: assumed
        note: The panel driver is not in this release; slice_count drives the BTS
          margin term. 2 slices assumed for the 1440x3120 mode.
    disp_dfs_lv_khz:
    - 800000
    - 663000
    - 533000
    - 468000
    - 400000
    - 332000
    - 267000
    - 200000
    - 89000
    disp_freq_formula: max_disp_freq = max over DECONs of resol_clk / effective_ppc,
      clamped to disp_dfs_lv_khz
compatible_soc:
- soc-exynos2600
