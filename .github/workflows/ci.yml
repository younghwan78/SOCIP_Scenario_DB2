name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR commits need no result; keep every main push validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim --extra profiling
      - run: uv run --extra profiling ruff check .
      - run: uv run --extra profiling mypy
      - run: uv export --frozen --no-dev --group dashboard --group sim --extra profiling --no-emit-project --quiet -o "${RUNNER_TEMP}/runtime-requirements.txt"
      - run: uv run --extra profiling pip-audit -r "${RUNNER_TEMP}/runtime-requirements.txt" --progress-spinner off
      # pytest-cov combines worker coverage before enforcing the existing 80% gate.
      - run: uv run --extra profiling pytest tests/unit -n 4 --dist worksteal --durations=25 --cov=scenario_db --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim --extra profiling
      # Each worker owns its session-scoped PostgreSQL testcontainer. Keep tests
      # from one file together to preserve module fixtures and mutation ordering.
      - run: uv run --extra profiling pytest tests/integration -n 4 --dist loadfile --durations=25 -q
