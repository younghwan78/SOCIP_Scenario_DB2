name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR commits need no result; keep every main push validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim --extra profiling
      - run: uv run --extra profiling ruff check .
      - run: uv run --extra profiling mypy
      - run: uv export --frozen --no-dev --group dashboard --group sim --extra profiling --no-emit-project --quiet -o "${RUNNER_TEMP}/runtime-requirements.txt"
      - run: uv run --extra profiling pip-audit -r "${RUNNER_TEMP}/runtime-requirements.txt" --progress-spinner off

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: authoring
            tests: tests/unit/authoring
          - shard: remaining
            tests: tests/unit --ignore=tests/unit/authoring
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim --extra profiling
      # Shard coverage is partial; quality enforces 80% on the combined result.
      - run: uv run --extra profiling pytest ${{ matrix.tests }} -n 4 --dist worksteal --durations=25 --cov=scenario_db --cov-report= --cov-fail-under=0
      - run: mv .coverage .coverage.${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Keep the protected branch's existing required check name. Upstream failures
  # must fail this gate rather than leave a skipped (non-blocking) check.
  quality:
    runs-on: ubuntu-latest
    needs: [static-quality, unit]
    if: ${{ always() }}
    steps:
      - name: Require every upstream check
        env:
          STATIC_RESULT: ${{ needs.static-quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: test "$STATIC_RESULT" = success && test "$UNIT_RESULT" = success
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim --extra profiling
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Require both coverage files
        run: test -s .coverage.authoring && test -s .coverage.remaining
      - run: uv run --extra profiling coverage combine
      - run: uv run --extra profiling coverage report --fail-under=80

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim --extra profiling
      # Each worker owns its session-scoped PostgreSQL testcontainer. Keep tests
      # from one file together to preserve module fixtures and mutation ordering.
      - run: uv run --extra profiling pytest tests/integration -n 4 --dist loadfile --durations=25 -q
