name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv export --frozen --no-dev --group dashboard --group sim --no-emit-project --quiet -o "${RUNNER_TEMP}/runtime-requirements.txt"
      - run: uv run pip-audit -r "${RUNNER_TEMP}/runtime-requirements.txt" --progress-spinner off
      - run: uv run pytest tests/unit --cov=scenario_db --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --group dev --group dashboard --group sim
      - run: uv run pytest tests/integration -q
