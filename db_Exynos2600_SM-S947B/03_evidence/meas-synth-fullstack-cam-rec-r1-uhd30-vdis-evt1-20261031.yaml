  - {id: hw.ufs, layer: hw, name: UFS, detail: write}
  cadences:
  - {id: frame, name: Sensor frame, kind: frame, period_ms: 33.3333}
  - {id: vsync, name: Display vsync, kind: vsync, period_ms: 16.6667}
  - {id: od, name: VPS OD, kind: divided, of: frame, every: 5, note: object detection every 5th frame}
  - {id: abox, name: ABOX period, kind: period, period_ms: 20.0, note: 48 kHz · 960 samples}
  - {id: aac, name: AAC frame, kind: period, period_ms: 21.3333, note: 1024 samples @ 48 kHz}
  - {id: mux, name: MPEG4 chunk, kind: chunk, period_ms: 1000.0, note: interleave chunk write}
  - {id: ui, name: Camera UI, kind: period, period_ms: 1000.0, note: recording timer / OSD · 애니메이션 중에는 vsync마다}
  flows:
  - id: sensor-frame
    name: Sensor frame
    cadence: frame
    summary: request (n−4) → sensor → ISP RT → RTA → ISP NRT → EIS → GDC → preview / encode / app
    steps:
    - {to: framework.cameraserver, call: processCaptureRequest, task: cs.request, slice: cs.request#f4, frame_offset: -4, t_ms: 0.0, dur_ms: 0.283}
    - {from: framework.cameraserver, to: hal.camera-provider, call: request, task: hal.request, slice: hal.request#f4, handoff: ipc, frame_offset: -4, t_ms: 0.333, dur_ms: 1.886}
    - {from: hal.camera-provider, to: kernel.pablo-is, call: shot · QBUF, task: is.shot, slice: is.shot#f4, handoff: kick, frame_offset: -4, t_ms: 2.269, dur_ms: 0.05}
    - {note: request는 4 frame 앞서 들어감 · 영상 buffer는 app을 거치지 않음, over: [hw.sensor]}
    - {from: kernel.pablo-is, to: hw.sensor, call: SOF · readout, task: sensor.readout, slice: sensor.readout#f4, node: sensor_rear, handoff: kick, t_ms: 131.333, dur_ms: 10.204}
    - {from: hw.sensor, to: hw.isp-rt, call: CSIS OTF, task: csis, slice: csis#f4, node: csis, t_ms: 131.483, dur_ms: 10.205}
    - {from: hw.isp-rt, to: hw.isp-rt, call: PDP OTF, task: pdp, slice: pdp#f4, node: pdp, t_ms: 131.583, dur_ms: 10.143}
    - {from: hw.isp-rt, to: hw.isp-rt, call: BYRP OTF, task: byrp, slice: byrp#f4, node: byrp, t_ms: 131.683, dur_ms: 10.03}
    - {from: hw.isp-rt, to: hw.isp-rt, call: RGBP OTF, task: rgbp, slice: rgbp#f4, node: rgbp, t_ms: 131.783, dur_ms: 10.033}
    - {from: hw.isp-rt, to: hw.isp-rt, call: YUVSC OTF, task: yuvsc, slice: yuvsc#f4, node: yuvsc, t_ms: 131.883, dur_ms: 10.067}
    - {from: hw.isp-rt, to: hw.isp-rt, call: MLSC OTF, task: mlsc, slice: mlsc#f4, node: mlsc, t_ms: 131.983, dur_ms: 10.038}
    - {from: hw.isp-rt, to: kernel.pablo-is, call: MLSC done IRQ, task: is.irq, slice: is.irq#f4, handoff: irq, t_ms: 142.072, dur_ms: 0.032}
    - {from: kernel.pablo-is, to: fw.rta, call: stats → CRTA, task: rta.post_crta, slice: rta.post_crta#f4, node: post_crta, handoff: kick, t_ms: 142.153, dur_ms: 0.307}
    - {from: fw.rta, to: fw.rta, call: preME, task: rta.pre_me, slice: rta.pre_me#f4, node: pre_me_rta, handoff: kick, t_ms: 142.561, dur_ms: 2.887}
    - {note: VPS OD는 5 frame에 한 번 (6 Hz), over: [hw.vps]}
    - {from: hw.isp-rt, to: hw.vps, call: OD kick, task: vps.od, slice: vps.od#f4, node: vps_od, handoff: kick, cadence: od, every: 5, t_ms: 142.622, dur_ms: 1.902}
    - {from: fw.rta, to: hw.lme, call: LME kick, task: lme, slice: lme#f4, node: lme, handoff: kick, t_ms: 142.961, dur_ms: 1.949}
    - {from: fw.rta, to: fw.rta, call: IRTA, task: rta.post_irta, slice: rta.post_irta#f4, node: post_irta, t_ms: 145.497, dur_ms: 3.8}
    - {from: fw.rta, to: hw.isp-nrt, call: NRT kick, task: mtnr, slice: mtnr#f4, node: mtnr, handoff: kick, t_ms: 149.347, dur_ms: 8.86}
    - {from: hw.isp-nrt, to: hw.isp-nrt, call: MSNR OTF, task: msnr, slice: msnr#f4, node: msnr, t_ms: 149.547, dur_ms: 8.804}
    - {from: hw.isp-nrt, to: hw.isp-nrt, call: YUVP OTF, task: yuvp, slice: yuvp#f4, node: yuvp, t_ms: 149.747, dur_ms: 9.299}
    - {from: hw.isp-nrt, to: hw.isp-nrt, call: MCSC OTF, task: mcsc, slice: mcsc#f4, node: mcsc, t_ms: 149.947, dur_ms: 8.942}
    - {from: hw.isp-nrt, to: kernel.pablo-is, call: MCSC done IRQ, task: nrt.irq, slice: nrt.irq#f4, handoff: irq, t_ms: 158.939, dur_ms: 0.031}
    - {note: VDISCore가 gyro와 함께 warp matrix 계산, over: [hal.camera-provider]}
    - {from: kernel.pablo-is, to: hal.camera-provider, call: EIS + gyro, task: eis.warp, slice: eis.warp#f4, node: eis, handoff: complete, t_ms: 159.02, dur_ms: 8.097}
    - {from: hal.camera-provider, to: hw.gdc, call: GDC_M warp, task: gdc.m, slice: gdc.m#f4, node: gdc_m, handoff: kick, t_ms: 167.317, dur_ms: 2.018}
    - {from: hal.camera-provider, to: hw.gdc, call: GDC_O warp, task: gdc.o, slice: gdc.o#f4, node: gdc_o, handoff: kick, t_ms: 167.367, dur_ms: 4.428}
    - {from: hw.gdc, to: kernel.pablo-is, call: GDC done IRQ, task: gdc.irq, slice: gdc.irq#f4, handoff: irq, t_ms: 171.845, dur_ms: 0.032}
    - {from: kernel.pablo-is, to: hal.camera-provider, call: processCaptureResult, task: hal.result, slice: hal.result#f4, handoff: complete, t_ms: 171.926, dur_ms: 0.522}
    - {from: hal.camera-provider, to: framework.cameraserver, call: returnBuffer, task: cs.return, slice: cs.return#f4, handoff: ipc, t_ms: 172.498, dur_ms: 0.314}
    - {from: framework.cameraserver, to: framework.surfaceflinger, call: SurfaceView queueBuffer, task: sf.commit, slice: sf.commit#f4, handoff: ipc, branch: preview, t_ms: 186.633, dur_ms: 1.401}
    - {from: framework.surfaceflinger, to: hal.composer-hal, call: presentDisplay, task: hwc.present, slice: hwc.present#f4, handoff: ipc, branch: preview, t_ms: 188.084, dur_ms: 0.913}
    - {from: hal.composer-hal, to: kernel.exynos-drm, call: atomic commit, task: drm.commit, slice: drm.commit#f4, handoff: kick, branch: preview, t_ms: 189.047, dur_ms: 0.401}
    - {from: kernel.exynos-drm, to: hw.dpu, call: scanout, task: dpu.scan, slice: dpu.scan#c12, node: dpu, handoff: kick, branch: preview, cadence: vsync, t_ms: 203.0, dur_ms: 15.504}
    - {from: framework.cameraserver, to: framework.mediaserver, call: encoder input surface, task: enc.feed, slice: enc.feed#f4, handoff: ipc, branch: encode, t_ms: 172.862, dur_ms: 1.048}
    - {from: framework.mediaserver, to: hal.media-codec, call: C2 queue, task: enc.c2_queue, slice: enc.c2_queue#f4, handoff: ipc, branch: encode, t_ms: 173.96, dur_ms: 0.206}
    - {from: hal.media-codec, to: kernel.exynos-mfc, call: V4L2 QBUF, task: enc.drv, slice: enc.drv#f4, handoff: kick, branch: encode, t_ms: 174.217, dur_ms: 0.079}
    - {from: kernel.exynos-mfc, to: hw.mfc, call: HEVC encode, task: enc.hw, slice: enc.hw#f4, node: mfc_enc, handoff: kick, branch: encode, t_ms: 174.346, dur_ms: 7.858}
    - {from: hw.mfc, to: kernel.exynos-mfc, call: IRQ, task: enc.irq, slice: enc.irq#f4, handoff: irq, branch: encode, t_ms: 182.254, dur_ms: 0.047}
    - {from: kernel.exynos-mfc, to: hal.media-codec, call: bitstream, task: enc.done, slice: enc.done#f4, handoff: complete, branch: encode, t_ms: 182.351, dur_ms: 0.203}
    - {from: hal.media-codec, to: framework.mediaserver, call: writeSampleData, task: mux.queue, slice: mux.queue#f4, handoff: ipc, branch: encode, t_ms: 182.604, dur_ms: 0.288}
    - {from: framework.cameraserver, to: app.camera-app, call: onCaptureCompleted, task: app.result, slice: app.result#f4, handoff: ipc, branch: app result, t_ms: 173.012, dur_ms: 0.38}
  - id: audio-period
    name: Audio period
    cadence: abox
    summary: ABOX 20 ms period → audio HAL → AudioRecord → AAC (1024 sample)
    steps:
    - {note: App은 MediaRecorder start / stop 제어만 · 주기 처리는 audioserver · mediaserver, over: [hw.abox]}
    - {note: frame과 무관한 독립 주기 · muxer에서 timestamp로 합류, over: [hw.abox]}
    - {to: hw.abox, call: capture period, task: abox.dsp, slice: abox.dsp#c3, node: abox, t_ms: 0.0, dur_ms: 0.818}
    - {from: hw.abox, to: kernel.abox, call: period IRQ, task: abox.irq, slice: abox.irq#c3, handoff: irq, t_ms: 0.868, dur_ms: 0.029}
    - {from: kernel.abox, to: hal.audio-hal, call: pcm read, task: aud.hal_read, slice: aud.hal_read#c3, handoff: complete, t_ms: 0.947, dur_ms: 0.195}
    - {from: hal.audio-hal, to: framework.audioserver, call: AudioRecord read, task: aud.record, slice: aud.record#c3, handoff: ipc, t_ms: 1.192, dur_ms: 0.283}
    - {from: framework.audioserver, to: hal.media-swcodec, call: AAC encode, task: aud.aac, slice: aud.aac#c3, handoff: ipc, cadence: aac, t_ms: 8.0, dur_ms: 0.565}
  - id: camera-ui
    name: Camera UI
    cadence: ui
    summary: 'App main (timer) → RenderThread → SurfaceFlinger: preview와 별개 layer, 다음 vsync에 함께 합성'
    steps:
    - {note: frame과 무관한 App loop · OSD 변화가 있을 때만 그림, over: [app.camera-app]}
    - {to: app.camera-app, call: timer tick · invalidate, task: ui.tick, slice: ui.tick#c0, t_ms: 0.0, dur_ms: 0.287}
    - {from: app.camera-app, to: app.camera-app, call: draw OSD (HWUI), task: ui.draw, slice: ui.draw#c0, handoff: ipc, t_ms: 0.337, dur_ms: 1.187}
    - {from: app.camera-app, to: framework.surfaceflinger, call: latch UI layer, task: sf.ui_latch, slice: sf.ui_latch#c0, handoff: ipc, t_ms: 1.967, dur_ms: 0.29}
  - id: chunk
    name: MPEG4 chunk
    cadence: mux
    summary: frame마다 쌓인 video sample + AAC frame → 약 1 s chunk → UFS write
    steps:
    - {to: framework.mediaserver, call: writeSampleData, task: mux.queue, slice: mux.queue#f3, cadence: frame, t_ms: 0.0, dur_ms: 0.285}
    - {to: hal.media-swcodec, call: AAC encode, task: aud.aac, slice: aud.aac#c7, cadence: aac, t_ms: 6.321, dur_ms: 0.583}
    - {note: video (30 Hz)와 audio (46.9 Hz)가 여기서 만남, over: [framework.mediaserver]}
    - {from: hal.media-swcodec, to: framework.mediaserver, call: chunk interleave, task: mux.chunk, slice: mux.chunk#c0, node: mpeg_writer, t_ms: 19.987, dur_ms: 3.965}
    - {from: framework.mediaserver, to: kernel.ufs, call: blk submit, task: ufs.blk, slice: ufs.blk#c0, handoff: kick, t_ms: 24.003, dur_ms: 0.097}
    - {from: kernel.ufs, to: hw.ufs, call: UFS write, task: ufs.write, slice: ufs.write#c0, node: storage_write, handoff: kick, t_ms: 24.149, dur_ms: 7.601}
