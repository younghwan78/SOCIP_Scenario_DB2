  cadences:
  - {id: frame, name: Video frame, kind: frame, period_ms: 33.3333}
  - {id: tick, name: ExoPlayer tick, kind: period, period_ms: 10.0, note: doSomeWork 10 ms}
  - {id: adec, name: Opus frame, kind: period, period_ms: 20.0, note: 20 ms Opus packet decode}
  - {id: amix, name: AudioFlinger mix, kind: period, period_ms: 20.0, note: MixerThread period}
  - {id: abox, name: ABOX period, kind: period, period_ms: 10.0, note: 48 kHz · 480 samples}
  - {id: vsync, name: Display vsync, kind: vsync, period_ms: 16.6667}
  - {id: seg, name: Network segment, kind: chunk, period_ms: 5000.0, note: buffer 상태에 따라 가변}
  flows:
  - id: video-frame
    name: Video frame
    cadence: frame
    summary: sample read → MediaCodec → C2 → MFC decode → AV sync → SurfaceFlinger → DPU
    steps:
    - {to: app.youtube, call: readSample (fMP4), task: demux.read, slice: demux.read#f2, node: sw_demux, t_ms: 0.0, dur_ms: 0.631}
    - {from: app.youtube, to: framework.mediacodec, call: queueInputBuffer, task: vdec.feed, slice: vdec.feed#f2, handoff: ipc, t_ms: 0.681, dur_ms: 0.155}
    - {from: framework.mediacodec, to: hal.media-codec, call: C2 queue, task: vdec.c2_queue, slice: vdec.c2_queue#f2, handoff: ipc, t_ms: 0.886, dur_ms: 0.195}
    - {from: hal.media-codec, to: kernel.exynos-mfc, call: V4L2 QBUF, task: vdec.drv, slice: vdec.drv#f2, handoff: kick, t_ms: 1.131, dur_ms: 0.077}
    - {from: kernel.exynos-mfc, to: fw.mfc-fw, call: FW run, task: vdec.fw, slice: vdec.fw#f2, handoff: kick, t_ms: 1.258, dur_ms: 0.105}
    - {from: fw.mfc-fw, to: hw.mfc, call: H.264 decode, task: vdec.hw, slice: vdec.hw#f2, node: mfc_dec, handoff: kick, t_ms: 1.413, dur_ms: 5.767}
    - {from: hw.mfc, to: kernel.exynos-mfc, call: IRQ, task: vdec.irq, slice: vdec.irq#f2, handoff: irq, t_ms: 7.23, dur_ms: 0.047}
    - {from: kernel.exynos-mfc, to: hal.media-codec, call: DQBUF, task: vdec.done, slice: vdec.done#f2, handoff: complete, t_ms: 7.327, dur_ms: 0.191}
    - {from: hal.media-codec, to: framework.mediacodec, call: onWorkDone, task: vdec.out, slice: vdec.out#f2, handoff: ipc, t_ms: 7.567, dur_ms: 0.482}
    - {note: audio clock 기준으로 present 시각 결정, over: [app.youtube]}
    - {from: framework.mediacodec, to: app.youtube, call: releaseOutputBuffer (AV sync), task: play.release, slice: play.release#f2, handoff: ipc, t_ms: 9.55, dur_ms: 0.145}
    - {from: app.youtube, to: framework.surfaceflinger, call: queueBuffer → commit, task: sf.commit, slice: sf.commit#f2, handoff: ipc, t_ms: 21.967, dur_ms: 1.512}
    - {from: framework.surfaceflinger, to: hal.composer-hal, call: presentDisplay, task: hwc.present, slice: hwc.present#f2, handoff: ipc, t_ms: 23.529, dur_ms: 0.878}
    - {from: hal.composer-hal, to: kernel.exynos-drm, call: atomic commit, task: drm.commit, slice: drm.commit#f2, handoff: kick, t_ms: 24.457, dur_ms: 0.385}
    - {note: 다음 vsync부터 scanout, over: [hw.dpu]}
    - {from: kernel.exynos-drm, to: hw.dpu, call: scanout, task: dpu.scan, slice: dpu.scan#c6, node: dpu, handoff: kick, cadence: vsync, t_ms: 38.333, dur_ms: 15.481}
    - {from: hw.dpu, to: kernel.exynos-drm, call: frame done IRQ, task: decon.done, slice: decon.done#c6, handoff: irq, cadence: vsync, t_ms: 53.864, dur_ms: 0.04}
  - id: player-tick
    name: Player tick
    cadence: tick
    summary: 'ExoPlayer playback loop: buffer 확인 · decoder feed · decoded audio를 AudioTrack에 write'
    steps:
    - {to: hal.media-swcodec, call: Opus decode, task: aud.dec, slice: aud.dec#c1, cadence: adec, t_ms: 0.0, dur_ms: 0.248}
    - {note: 10 ms마다 깨어남 (video frame과 무관), over: [app.youtube]}
    - {to: app.youtube, call: doSomeWork, task: play.work, slice: play.work#c4, t_ms: 17.0, dur_ms: 0.611}
    - {from: app.youtube, to: app.youtube, call: AudioTrack.write, task: aud.write, slice: aud.write#c4, handoff: complete, t_ms: 17.661, dur_ms: 0.157}
  - id: audio
    name: Audio playback
    cadence: amix
    summary: AudioTrack shared buffer → AudioFlinger mix (20 ms) → audio HAL → ABOX (10 ms) → speaker
    steps:
    - {to: app.youtube, call: AudioTrack.write, task: aud.write, slice: aud.write#c4, cadence: tick, t_ms: 0.0, dur_ms: 0.157}
    - {note: audio clock이 video present 시각의 기준 (AV sync), over: [framework.audioserver]}
    - {from: app.youtube, to: framework.audioserver, call: mix (shared buffer), task: af.mix, slice: af.mix#c2, handoff: ipc, t_ms: 7.339, dur_ms: 0.427}
    - {from: framework.audioserver, to: hal.audio-hal, call: out_write, task: aud.hal, slice: aud.hal#c2, handoff: ipc, t_ms: 7.816, dur_ms: 0.21}
    - {note: Pipeline ABOX node · 독립 10 ms 주기 · video frame과 무관, over: [hw.abox]}
    - {from: hal.audio-hal, to: hw.abox, call: RDMA · SRC, task: abox.dma, slice: abox.dma#c6, node: abox, handoff: kick, cadence: abox, t_ms: 20.339, dur_ms: 0.585}
    - {from: hw.abox, to: kernel.abox, call: period IRQ, task: abox.irq, slice: abox.irq#c6, handoff: irq, cadence: abox, t_ms: 20.974, dur_ms: 0.029}
  - id: segment
    name: Network segment
    cadence: seg
    summary: wlan rx → Cronet segment fetch → buffer (수 초 앞서 채움)
    steps:
    - {to: kernel.net, call: wlan rx, task: net.rx, slice: net.rx#c0, t_ms: 0.0, dur_ms: 0.418}
    - {note: DB는 network를 frame마다(30 Hz) 모델링 · 실제는 segment 단위, over: [app.youtube]}
    - {from: kernel.net, to: app.youtube, call: segment fetch, task: net.fetch, slice: net.fetch#c0, node: network, handoff: irq, t_ms: 0.468, dur_ms: 2.938}
