    note: 'mif_min_lock is a floor, not a BW estimate: a GPU frequency step forces
      at least that MIF operating point regardless of measured traffic. Take max(mif_min_lock,
      bw-derived MIF) when combining with the SoC memory model.'
  power_model:
    source: kernel_dt
    reference: 'exynos/soc-series/t-android16/arch/arm64/boot/dts/exynos/s5e9965-sgpu.dtsi:
      gpu_power_coeff / ect-coeff-index; exynos/soc-series/t-android16/arch/arm64/boot/dts/exynos/s5e9965-profiler.dtsi:
      exynos-gpu-profiler'
    formula:
    - dynamic_mw = power_coefficient * freq_mhz * volt^2 * util   (profiler convention)
    - static_mw  = static_power_coefficient * volt * f(temperature)
    gpu_power_coeff: 625
    profiler_dynamic_coeff: 13360
    profiler_static_coeff: 400
    ect_coeff_index: 4
    note: 'Two coefficients exist: gpu_power_coeff (thermal/IPA cooling device) and
      the profiler power-coefficient. They are not the same scale; pick one convention
      and keep it. Voltage comes from ECT/ASV, which is not in this source release.'
