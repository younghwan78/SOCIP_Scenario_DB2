<!doctype html>
<html>
<head><meta charset="utf-8" /><title>graph selection bridge</title></head>
<body>
<script>
// Invisible bidirectional bridge: the ELK viewer iframes are one-way
// components.html embeds and cannot talk to Streamlit themselves, so they
// postMessage {type:'sdb-graph-select'} to the top window. This component,
// being same-origin, listens on the top window and forwards the selection
// into Streamlit as its component value.
function post(type, payload) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, payload || {}), '*');
}

window.addEventListener('message', function (event) {
  var data = event.data;
  if (data && data.type === 'streamlit:render') {
    post('streamlit:setFrameHeight', {height: 0});
  }
});

try {
  window.parent.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.type !== 'sdb-graph-select' || !data.id) return;
    post('streamlit:setComponentValue', {
      dataType: 'json',
      value: {
        id: String(data.id),
        kind: String(data.kind || ''),
        label: String(data.label || ''),
        seq: Number(data.seq || 0)
      }
    });
  });
} catch (err) {
  // Cross-origin parent (unexpected): bridge stays inert.
}

post('streamlit:componentReady', {apiVersion: 1});
</script>
</body>
</html>
