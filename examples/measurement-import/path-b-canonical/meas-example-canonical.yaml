# ── (선택) rail 을 논리 CPU 클러스터로 묶은 분해. power_mw 는 run 간 MeasuredKpi ──
cpu_breakdown:
  - cluster: BIG     # CPUCL3
    power_mw: {mean: 26.95, std: 0.23, ci_95: [26.7, 27.2], n: 3}
  - cluster: MID     # CPUCL2 + CPUCL1(LF0/LF1)
    power_mw: {mean: 160.19, std: 1.38, ci_95: [158.6, 161.8], n: 3}
  - cluster: LIT     # CPUCL0_DSU
    power_mw: {mean: 77.22, std: 0.66, ci_95: [76.5, 78.0], n: 3}

