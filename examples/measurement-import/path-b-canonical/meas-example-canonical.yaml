# =============================================================================
# Path B · canonical evidence.measurement YAML  — DB 가 직접 적재하는 최종 형식
# =============================================================================
# Path A(meas_import rail_long)의 출력과 "동일한 스키마"입니다. 변환 도구를 쓰지 않고
# 외부 측정 리포트의 통계치를 사람이 직접 옮겨 적을 때 이 형식을 손으로 작성합니다.
#
# 적재:  uv run python -m scenario_db.etl.loader examples/measurement-import/path-b-canonical
# 스키마: src/scenario_db/models/evidence/measurement.py · docs/measurement-evidence-contract.md
# -----------------------------------------------------------------------------

id: meas-example-pathb-uhd30-vdis-20260614
schema_version: "2.2"
kind: evidence.measurement

scenario_ref: uc-camera-recording
variant_ref: cam-rec-r1-uhd30-vdis
project_ref: proj-sm-s947b
measured_at: "2026-06-14T15:30:00+09:00"

execution_context:
  silicon_rev: EVT1
  sw_baseline_ref: sw-vendor-v1.2.3   # SSOT
  thermal: room
  ambient_temp_c: 25.0
  power_state: discharging
  method: measurement

provenance:
  device_id: "EVT1-ERD-SN-0042"
  chamber_controlled: true
  chamber_temp_c: 25.0
  build_id: "UP1A.260601.001"
  collection_method: "power_monitor"
  collection_tool_versions:
    power_monitor: "pm-tool-v3.1"
  sample_count: 3                      # 반복 측정(run) 횟수. 특이 시나리오 1회면 1
  duration_per_sample_s: 30.0          # run 당 구간 측정 길이(초)
  confidence_level: 0.95

aggregation:
  strategy: mean_over_runs             # run 간 평균(n=run 수)

# ── KPI: run 간 통계객체(MeasuredKpi). n = run 수 ──────────────────────────────
kpi:
  total_power_mw:                      # = Σ rail power_mw, run 간 집계
    mean: 675.222
    p95: 681.833
    std: 5.803
    ci_95: [668.656, 681.789]
    n: 3
  # frame latency 는 프레임 단위 분포(n = 프레임 수, run 수와 다른 축). p95 로 jank 판단.
  # 30fps 예산 = 33.3ms → mean 28.4 / p95 32.1 모두 예산 내. drop 은 timeline_events 로.
  # (MeasuredKpi 는 mean/p95/std/ci_95/n 만; max 필드 없음)
  frame_latency_ms: {mean: 28.4, p95: 32.1, n: 5400}
  fps_effective: 29.97

# ── rail-level 측정 테이블 (핵심) ──────────────────────────────────────────────
# rail 명/개수는 과제마다 다름 → free-form dict. 각 rail 은 run 간 평균:
#   voltage_v  : 인가 전압 검증용 (V)
#   current_ma : 주 지표 (mA)
#   power_mw   : 전력 (mW)
#   std_mw     : run 간 표준편차 (선택)
#   domain     : 대시보드 롤업 분류 (선택, 부분 선언 OK — 미지정은 이름 휴리스틱)
vdd_power:
  B5S4_VDDMIF_AP_L:            {voltage_v: 0.5687, current_ma: 70.4,   power_mw: 42.74,  std_mw: 0.367, domain: MIF}
  B3_4_5S2_VDD_CPUCL3_BIG_L:   {voltage_v: 0.0132, current_ma: 30.531, power_mw: 26.976, std_mw: 0.232, domain: CPU}
  B3_4S3_VDD_CPUCL2_MID_HF_L:  {voltage_v: 0.0357, current_ma: 9.704,  power_mw: 6.033,  std_mw: 0.052, domain: CPU}
  B2S3_VDD_CPUCL1_MID_LF1_L:   {voltage_v: 0.4519, current_ma: 70.989, power_mw: 41.03,  std_mw: 0.353, domain: CPU}
  B2S2_VDD_CPUCL1_MID_LF0_L:   {voltage_v: 0.5954, current_ma: 183.994, power_mw: 113.28, std_mw: 0.973, domain: CPU}
  B5_6S3_VDD_CPUCL0_DSU_L:     {voltage_v: 0.5866, current_ma: 129.766, power_mw: 77.301, std_mw: 0.664, domain: CPU}
  B4S4_VDD_INT_L:              {voltage_v: 0.6313, current_ma: 155.979, power_mw: 99.083, std_mw: 0.852}
  # 아래 rail 들은 domain 미지정 → 대시보드가 이름 휴리스틱으로 분류 (CAM/MEM/GPU/ICPU)
  B5_6S1_VDD_CAM_L:            {voltage_v: 0.6077, current_ma: 170.465, power_mw: 103.565, std_mw: 0.89}
  L1S3_VDD_ICPU_L:             {voltage_v: 0.7219, current_ma: 26.032,  power_mw: 18.781,  std_mw: 0.161}
  B1_2_3_4S1_VDD_G3D0_0P725_L: {voltage_v: 0.0111, current_ma: 7.058,   power_mw: 2.293,   std_mw: 0.02}   # GPU gated
  B1_2_3E1_VDD_G3D1_0P725_L:   {voltage_v: 0.0112, current_ma: 6.107,   power_mw: 1.851,   std_mw: 0.016}  # GPU gated
  B6S4_VDDQ_DRAM_MEM_0P5_T:    {voltage_v: 0.4280, current_ma: 17.624,  power_mw: 7.592,   std_mw: 0.065, domain: MEM}
  L5M_VDD1_MEM_L:              {voltage_v: 1.8014, current_ma: 9.741,   power_mw: 17.546,  std_mw: 0.151}
  SRB1S5_VDD2L_MEM_AP_L:       {voltage_v: 0.9108, current_ma: 25.986,  power_mw: 23.693,  std_mw: 0.204}
  SRB1S4_VDD2H_MEM_AP_L:       {voltage_v: 1.0027, current_ma: 57.96,   power_mw: 58.248,  std_mw: 0.501}
  B6S2_VDD_SRAM_L:             {voltage_v: 0.7217, current_ma: 48.781,  power_mw: 35.212,  std_mw: 0.303}

# ── CPU 클러스터 분해 = power(전력 측정) + freq/util(perfetto 분석) 병합 ───────────
#   power_mw     : 전력 측정에서 (run 간 MeasuredKpi)
#   freq_residency, avg_freq_mhz, util_pct : perfetto(별도 분석) 결과를 여기 기입
#   freq_residency = 시간가중 점유율 {freq_mhz, ratio(합≈1), time_ms}
cpu_breakdown:
  - cluster: BIG     # CPUCL3 — 이 시나리오선 거의 parked
    power_mw: {mean: 26.976, p95: 27.24, std: 0.232, ci_95: [26.713, 27.238], n: 3}
    avg_freq_mhz: 1000.0
    util_pct: 8.4
    freq_residency:
      - {freq_mhz: 3300.0, ratio: 0.03, time_ms: 5400.0}
      - {freq_mhz: 2400.0, ratio: 0.09, time_ms: 16200.0}
      - {freq_mhz: 1100.0, ratio: 0.22, time_ms: 39600.0}
      - {freq_mhz: 672.0,  ratio: 0.66, time_ms: 118800.0}
  - cluster: MID     # CPUCL2 + CPUCL1(LF0/LF1) — 카메라/인코더 workhorse
    power_mw: {mean: 160.343, p95: 161.913, std: 1.378, ci_95: [158.784, 161.902], n: 3}
    avg_freq_mhz: 1765.0
    util_pct: 47.5
    freq_residency:
      - {freq_mhz: 2400.0, ratio: 0.18, time_ms: 32400.0}
      - {freq_mhz: 1900.0, ratio: 0.46, time_ms: 82800.0}
      - {freq_mhz: 1400.0, ratio: 0.27, time_ms: 48600.0}
      - {freq_mhz: 900.0,  ratio: 0.09, time_ms: 16200.0}
  - cluster: LIT     # CPUCL0_DSU
    power_mw: {mean: 77.301, p95: 78.058, std: 0.664, ci_95: [76.55, 78.053], n: 3}
    avg_freq_mhz: 1228.0
    util_pct: 39.0
    freq_residency:
      - {freq_mhz: 1800.0, ratio: 0.12, time_ms: 21600.0}
      - {freq_mhz: 1300.0, ratio: 0.55, time_ms: 99000.0}
      - {freq_mhz: 900.0,  ratio: 0.33, time_ms: 59400.0}

# ── SW task 타이밍 (perfetto 분석 결과) — 핵심 task만 논리명으로 ────────────────
#   raw 스레드명이 아니라 논리 task명(eis_warp 등)으로 올려야 SW·프로젝트 간 비교 가능.
#   count_per_frame = samples / frame_count (프레임당 호출 수)
sw_task_timing:
  - {task: eis_warp,            process: vendor.camera.provider, thread: VDISCore, cluster: MID, mean_ms: 7.8, p50_ms: 7.4, p95_ms: 10.6, max_ms: 15.1, samples: 5400, count_per_frame: 1.0}
  - {task: hal_request_thread,  process: vendor.camera.provider, cluster: LIT, mean_ms: 2.3, p50_ms: 2.1, p95_ms: 3.8, max_ms: 6.9, samples: 5400, count_per_frame: 1.0}
  - {task: encoder_input_feed,  process: mediaserver, cluster: LIT, mean_ms: 1.1, p50_ms: 1.0, p95_ms: 1.9, max_ms: 4.2, samples: 5400, count_per_frame: 1.0}

# ── sparse 타임라인 이벤트 (frame drop / thermal 등) ──────────────────────────
timeline_events:
  - {type: frame_drop,   t_ms: 84210.0,  count: 1}
  - {type: thermal_step, t_ms: 152000.0, detail: "skin 39C, no throttle"}

# ── raw artifact 포인터: DB 에는 path + sha256 만 (Tier3 실파일은 file-store) ────
# 주의: perfetto trace(.pb) 자체는 DB 미저장 — 아래 포인터로만 추적.
artifacts:
  - type: perfetto_trace
    storage: fileshare
    path: "artifacts/proj-sm-s947b/uc-camera-recording/cam-rec-r1-uhd30-vdis/20260614-pathb/trace.pb"
    sha256: "0d1f7a3c9b2e4d5f6a7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b"
    bytes: 612368384
    mime: application/octet-stream
  - type: power_monitor_csv
    storage: fileshare
    path: "artifacts/proj-sm-s947b/uc-camera-recording/cam-rec-r1-uhd30-vdis/20260614-pathb/rail_power_by_run.csv"
    sha256: "1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f00f"
    bytes: 8120
    mime: text/csv
