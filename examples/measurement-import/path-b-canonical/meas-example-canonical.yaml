# 외부 측정 리포트의 통계치를 사람이 직접 옮겨 적을 때 이 형식을 손으로 작성합니다.
#
# 적재:  uv run python -m scenario_db.etl.loader examples/measurement-import/path-b-canonical
# 스키마: src/scenario_db/models/evidence/measurement.py · docs/measurement-evidence-contract.md
# -----------------------------------------------------------------------------

id: meas-example-pathb-uhd30-vdis-20260614
schema_version: "2.2"
kind: evidence.measurement

scenario_ref: uc-camera-recording
variant_ref: cam-rec-r1-uhd30-vdis
project_ref: proj-sm-s947b
measured_at: "2026-06-14T15:30:00+09:00"

execution_context:
  silicon_rev: EVT1
  sw_baseline_ref: sw-vendor-v1.2.3   # SSOT
  thermal: room
  ambient_temp_c: 25.0
  power_state: discharging
  method: measurement

provenance:
  device_id: "EVT1-ERD-SN-0042"
  chamber_controlled: true
  chamber_temp_c: 25.0
  build_id: "UP1A.260601.001"
  collection_method: "power_monitor"
  collection_tool_versions:
    power_monitor: "pm-tool-v3.1"
  sample_count: 3                      # 반복 측정(run) 횟수. 특이 시나리오 1회면 1
  duration_per_sample_s: 30.0          # run 당 구간 측정 길이(초)
  confidence_level: 0.95

aggregation:
  strategy: mean_over_runs             # run 간 평균(n=run 수)

# ── KPI: run 간 통계객체(MeasuredKpi). n = run 수 ──────────────────────────────
kpi:
  total_power_mw:                      # = Σ rail power_mw, run 간 집계
    mean: 674.5
    std: 5.8
    ci_95: [667.9, 681.1]
    n: 3
  frame_latency_ms: 28.4               # 스칼라 KPI 도 허용
  fps_effective: 29.97

# ── rail-level 측정 테이블 (핵심) ──────────────────────────────────────────────
# rail 명/개수는 과제마다 다름 → free-form dict. 각 rail 은 run 간 평균:
#   voltage_v  : 인가 전압 검증용 (V)
#   current_ma : 주 지표 (mA)
#   power_mw   : 전력 (mW)
#   std_mw     : run 간 표준편차 (선택)
vdd_power:
  B5S4_VDDMIF_AP_L:            {voltage_v: 0.5687, current_ma: 70.33,  power_mw: 42.70,  std_mw: 0.37}
