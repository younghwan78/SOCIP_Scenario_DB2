  B4S4_VDD_INT_L:              {voltage_v: 0.6313, current_ma: 155.82, power_mw: 98.98,  std_mw: 0.85}
  B5_6S1_VDD_CAM_L:            {voltage_v: 0.6077, current_ma: 170.29, power_mw: 103.46, std_mw: 0.89}
  L1S3_VDD_ICPU_L:             {voltage_v: 0.7219, current_ma: 26.01,  power_mw: 18.76,  std_mw: 0.16}
  B1_2_3_4S1_VDD_G3D0_0P725_L: {voltage_v: 0.0111, current_ma: 7.05,   power_mw: 2.29,   std_mw: 0.02}   # GPU gated
  B1_2_3E1_VDD_G3D1_0P725_L:   {voltage_v: 0.0112, current_ma: 6.10,   power_mw: 1.85,   std_mw: 0.02}   # GPU gated
  B6S4_VDDQ_DRAM_MEM_0P5_T:    {voltage_v: 0.4280, current_ma: 17.61,  power_mw: 7.58,   std_mw: 0.07}
