# SYNTHETIC Exynos2600 clock-residency example (generated by scripts/generate_clock_residency_example.py).
# 3 PMU passes x 15 s: wall + running (non-idle) CPU residency per pass (group -> pass divergence),
# DSU (domain_class cpu) and GPU (domain_class gpu) frequency tracks, idle states.
# Counters: one source per PMU pass (group) -> merged with CPU_CYCLES / INST_RETIRED anchors;
# pmu.window = ONE pass (15 s x 30 fps).
schema_version: '2.2'
id: meas-synthetic-clock-residency-r1-8k30-psm-e2600-evt1
project_ref: proj-sm-s947b
scenario_ref: uc-cam-recording-e2600
variant_ref: cam-rec-r1-8k30-psm
measured_at: '2026-10-07T11:00:00+09:00'
execution_context:
  silicon_rev: EVT1
  sw_baseline_ref: sw-vendor-v1.2.3
  thermal: room
  ambient_temp_c: 25.0
  power_state: discharging
  method: measurement
provenance:
  device_id: SYNTHETIC
  collection_method: synthetic_clock_residency
  sample_count: 3
  revision: 2
  duration_per_sample_s: 15.0
  confidence_level: 0.95
aggregation_strategy: mean_over_capture
pmu:
  format: table
  cpu_map:
    0-2: MID_LF0
    3-5: MID_LF1
    6-8: MID_HF
    '9': BIG
  table:
    sources:
    - file: cpu_freq_residency.csv
      kind: freq_residency
      group: pass1
      filter:
        pass: ^1$
      cpu:
        column: cpu
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: cpu_freq_residency.csv
      kind: freq_residency
      group: pass2
      filter:
        pass: ^2$
      cpu:
        column: cpu
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: cpu_freq_residency.csv
      kind: freq_residency
      group: pass3
      filter:
        pass: ^3$
      cpu:
        column: cpu
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: cpu_freq_residency_running.csv
      kind: freq_residency
      basis: active
      group: pass1
      filter:
        pass: ^1$
      cpu:
        column: cpu
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: cpu_freq_residency_running.csv
      kind: freq_residency
      basis: active
      group: pass2
      filter:
        pass: ^2$
      cpu:
        column: cpu
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: cpu_freq_residency_running.csv
      kind: freq_residency
      basis: active
      group: pass3
      filter:
        pass: ^3$
      cpu:
        column: cpu
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: cpu_idle_residency.csv
      kind: idle_residency
      cpu:
        column: cpu
      state_column: state
      value_column: dur_ns
      states:
        running: active
        WFI: clock_gated
        C2: power_gated
    - file: dsu_gpu_freq_residency.csv
      kind: freq_residency
      domain_class: cpu
      filter:
        domain: ^DSU$
        basis: ^wall$
      cluster:
        column: domain
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
    - file: dsu_gpu_freq_residency.csv
      kind: freq_residency
      domain_class: cpu
      filter:
        domain: ^DSU$
        basis: ^running$
      cluster:
        column: domain
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
      basis: active
    - file: dsu_gpu_freq_residency.csv
      kind: freq_residency
      domain_class: gpu
      filter:
        domain: ^GPU$
        basis: ^wall$
        pass: ^1$
      cluster:
        column: domain
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
      group: pass1
    - file: dsu_gpu_freq_residency.csv
      kind: freq_residency
      domain_class: gpu
      filter:
        domain: ^GPU$
        basis: ^wall$
        pass: ^2$
      cluster:
        column: domain
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
      group: pass2
    - file: dsu_gpu_freq_residency.csv
      kind: freq_residency
      domain_class: gpu
      filter:
        domain: ^GPU$
        basis: ^wall$
        pass: ^3$
      cluster:
        column: domain
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
      group: pass3
    - file: dsu_gpu_freq_residency.csv
      kind: freq_residency
      domain_class: gpu
      filter:
        domain: ^GPU$
        basis: ^running$
      cluster:
        column: domain
      freq_column: freq_khz
      freq_unit: khz
      value_column: dur_ns
      basis: active
    - file: pmu_counters_by_pass.tsv
      kind: counters
      group: pass1
      delimiter: "\t"
      filter:
        pass: ^1$
      layout: long
      counter_column: event
      value_column: count
      counters:
        cycles:
        - CPU_CYCLES
        instructions:
        - INST_RETIRED
        stall_cycles:
        - STALL_BACKEND_MEM
        bus_access:
        - BUS_ACCESS
      bytes_per_access: 64
      cluster:
        column: cluster
      task:
        column: thread
      unmapped_task: keep
    - file: pmu_counters_by_pass.tsv
      kind: counters
      group: pass2
      delimiter: "\t"
      filter:
        pass: ^2$
      layout: long
      counter_column: event
      value_column: count
      counters:
        cycles:
        - CPU_CYCLES
        instructions:
        - INST_RETIRED
        stall_cycles:
        - STALL_BACKEND_MEM
        bus_access:
        - BUS_ACCESS
      bytes_per_access: 64
      cluster:
        column: cluster
      task:
        column: thread
      unmapped_task: keep
    - file: pmu_counters_by_pass.tsv
      kind: counters
      group: pass3
      delimiter: "\t"
      filter:
        pass: ^3$
      layout: long
      counter_column: event
      value_column: count
      counters:
        cycles:
        - CPU_CYCLES
        instructions:
        - INST_RETIRED
        stall_cycles:
        - STALL_BACKEND_MEM
        bus_access:
        - BUS_ACCESS
      bytes_per_access: 64
      cluster:
        column: cluster
      task:
        column: thread
      unmapped_task: keep
    - file: gpu_idle_residency.csv
      kind: idle_residency
      domain_class: gpu
      cluster:
        column: domain
      state_column: state
      value_column: dur_ns
      states:
        busy: active
        clock_gated: clock_gated
        power_off: power_gated
  window:
    frames: 450.0
