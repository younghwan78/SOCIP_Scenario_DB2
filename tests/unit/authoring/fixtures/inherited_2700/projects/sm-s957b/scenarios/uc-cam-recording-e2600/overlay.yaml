        buffer: MCSC_VIDEO
        port_pairs:
        - src: MCSC_WDMA_W1
          dst: APV_RDMA_FRAME
      - from: apv_enc
        to: mpeg_writer
        type: control
      - from: mpeg_writer
        to: storage_write
        type: control
      add_nodes:
      - id: mpeg_writer
        ip_ref: ip-cpu-s5e9965
        role: sw_task
        instance_index: 0
      - id: storage_write
        ip_ref: ip-cpu-s5e9965
        role: sw_task
        instance_index: 0
      - id: apv_enc
        ip_ref: ip-apv-s5e9965
        role: encoder
        instance_index: 0
    buffer_overrides:
      MCSC_VIDEO:
        format: YUV422
        bitdepth: 10
      GDC_VIDEO:
