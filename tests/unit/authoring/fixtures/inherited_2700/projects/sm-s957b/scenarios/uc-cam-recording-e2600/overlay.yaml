        bitdepth: 10
  - id: cam-rec-r1-uhd30-pro
    extends: cam-rec-r1-uhd30-vdis
    design_conditions:
      camera_mode: pro_video
      pro_video_overlay: histogram+equalizer
      pro_video_source: assumed
    node_configs:
      pro_scope:
        sw_timing:
          min_ms: 2.0
          mean_ms: 3.0
          max_ms: 4.5
          value_source: assumed
          source_note: Assumed 2026-09-27 (scope reduction); replace with internal measurement.
    topology_patch:
      add_edges:
      - from: mfc_enc
        to: mpeg_writer
        type: control
      - from: mpeg_writer
        to: storage_write
        type: control
      - from: mcsc
        to: pro_scope
        type: control
      add_nodes:
      - id: mpeg_writer
        ip_ref: ip-cpu-s5e9965
        role: sw_task
        instance_index: 0
      - id: storage_write
        ip_ref: ip-cpu-s5e9965
