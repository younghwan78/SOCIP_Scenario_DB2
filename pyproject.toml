[project]
name = "02-scenariodb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YounghwanJoo", email = "neokein@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.115",
    "psycopg2-binary>=2.9.11",
    "plotly>=5.20",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
scenario-db-reconcile-artifacts = "scenario_db.reporting.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scenario_db"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.15.15",
    "testcontainers>=4.14.2",
]
notebook = [
    "jupyterlab>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "kaleido>=0.2",
    "networkx>=3.0",
    "tabulate>=0.9",
    "ipywidgets>=8.0",
    "python-dotenv>=1.2.2",
]
dashboard = [
    "plotly>=5.20",
    "streamlit>=1.40",
    "requests>=2.31",
]
sim = [
    "networkx>=3.0",
    "simpy>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "unit: pure Python, no external deps",
    "integration: requires Docker + PostgreSQL testcontainer",
]

[tool.coverage.run]
branch = true
source = ["scenario_db"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B904"]
ignore = ["E402", "E701", "E702", "F401", "F402", "F541", "F841"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
files = [
    "dashboard/components/api_auth.py",
    "src/scenario_db/api/auth.py",
    "src/scenario_db/api/cache.py",
    "src/scenario_db/api/deps.py",
    "src/scenario_db/api/pagination.py",
    "src/scenario_db/api/resource_limits.py",
    "src/scenario_db/api/schemas/simulation.py",
    "src/scenario_db/api/schemas/write.py",
    "src/scenario_db/config.py",
    "src/scenario_db/query_engine/field_registry.py",
    "src/scenario_db/reporting/cli.py",
    "src/scenario_db/reporting/exporter.py",
    "src/scenario_db/reporting/models.py",
    "src/scenario_db/reporting/reconciliation.py",
    "src/scenario_db/sim/readiness.py",
    "src/scenario_db/sim/resource_limits.py",
]
